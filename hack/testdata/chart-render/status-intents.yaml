#
# The status server's intents views on, behind an operator-owned auth Secret
# (opaque to the chart: the server checks it is oidc with both prefixes at
# startup), with the example user roles.
statusServer:
    intents:
        enabled: true
    auth:
        existingSecret: maul-status-auth
    rbac:
        userRoles: true
