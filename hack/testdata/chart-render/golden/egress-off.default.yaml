apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-egress-broker-authn
    labels:
        app: egress-broker
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authentication.k8s.io]
      resources: [tokenreviews]
      verbs: [create]
