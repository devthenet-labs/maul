apiVersion: apps/v1
kind: Deployment
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app: integration-controller
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
        app.kubernetes.io/component: controller
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: integration-controller
            app.kubernetes.io/instance: patchy
            app.kubernetes.io/part-of: patchy
    template:
        metadata:
            labels:
                app: integration-controller
                helm.sh/chart: patchy-VERSION
                app.kubernetes.io/managed-by: Helm
                app.kubernetes.io/version: "VERSION"
                app.kubernetes.io/name: integration-controller
                app.kubernetes.io/instance: patchy
                app.kubernetes.io/part-of: patchy
                app.kubernetes.io/component: controller
            annotations:
                checksum/config: CHECKSUM
        spec:
            serviceAccountName: patchy-integration-controller
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                fsGroupChangePolicy: Always
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: controller
                  image: ghcr.io/devthenet-labs/patchy/integration-controller:vVERSION
                  imagePullPolicy: IfNotPresent
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: patchy-integration-controller-config
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 50m
                        memory: 96Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                # The root filesystem is read-only; every binary wants a
                # writable /tmp.
                - name: tmp
                  emptyDir: {}
