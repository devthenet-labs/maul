# Source: patchy/templates/networkpolicy.yaml
# ---- context-controller ----------------------------------------------------------
# Ingress: 8081 from anywhere (kubelet probes arrive from the node IP, which
# no pod selector can match).
#
# Egress: DNS, then TCP 443/6443 — the Kubernetes API server (every
# controller is a CR controller), the forge API where the controller uses
# one, and any OTLP collector. 6443 covers kind/kubeadm API servers; managed
# clusters usually use 443. The link-local rule is EKS Pod Identity:
# the SDK's other in-cluster credential path fetches from the node-local
# agent at 169.254.170.23:80 over HTTP (fd00:ec2::23 on IPv6 clusters) —
# harmless elsewhere, since nothing else answers on that address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: patchy-context-controller
    namespace: patchy
    labels:
        app: context-controller
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: context-controller
            app.kubernetes.io/instance: patchy
            app.kubernetes.io/part-of: patchy
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 8081
    egress:
        # DNS.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        # The Kubernetes API server, the forge, an OTLP collector.
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
        # The EKS Pod Identity agent (see the header comment).
        - to:
              - ipBlock:
                    cidr: 169.254.170.23/32
              - ipBlock:
                    cidr: fd00:ec2::23/128
          ports:
              - protocol: TCP
                port: 80
