---
# Source: patchy/templates/networkpolicy.yaml
# ---- integration-controller ----------------------------------------------------------
# Ingress: 8081 from anywhere (kubelet probes arrive from the node IP, which
# no pod selector can match), plus 8080 — the provider webhook
# receivers; the fronting ingress controller may live in any namespace, and
# the per-Integration HMAC signature check is the authentication. Tighten the
# from: to your ingress namespace if you want L3 on top of the HMAC.
#
# Egress: DNS, then TCP 443/6443 — the Kubernetes API server (every
# controller is a CR controller), the forge API where the controller uses
# one, and any OTLP collector. 6443 covers kind/kubeadm API servers; managed
# clusters usually use 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app: integration-controller
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: integration-controller
            app.kubernetes.io/instance: patchy
            app.kubernetes.io/part-of: patchy
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 8080
              - protocol: TCP
                port: 8081
    egress:
        # DNS.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        # The Kubernetes API server, the forge, an OTLP collector.
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
---
