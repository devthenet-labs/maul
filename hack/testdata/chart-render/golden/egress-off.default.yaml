# Source: patchy/templates/networkpolicy.yaml
# ---- agent namespace: default deny, both directions ------------------------
# Nothing may reach an agent pod (the job controllers read its output from
# the pod log through the API server, not from the pod), and an agent pod may
# reach nothing except what the egress rule below re-permits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: patchy-agents-default-deny
    namespace: patchy-agents
    labels:
        app: patchy-agents
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: patchy-agents
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
spec:
    podSelector: {}
    policyTypes: [Ingress, Egress]
