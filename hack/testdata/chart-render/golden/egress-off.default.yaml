# Source: patchy/templates/deployments.yaml
# Copyright 2026 Bitwise Media Group Ltd.
# SPDX-License-Identifier: MIT
#
# One Deployment per controller, rendered from a single spec because they
# differ only in image, resources, config, and ports: the
# integration-controller additionally serves the provider webhook receivers
# on 8080, the source-controller the artifact tarballs on 9790 (backed by a
# /data emptyDir); every controller serves healthz/readyz on 8081. All five
# are CRD controllers, so every pod mounts its service-account token —
# rbac.yaml pins verb-by-verb what each identity may do.
#
# All five are singletons with strategy Recreate, ON PURPOSE. The binaries do
# run leader election (a coordination.k8s.io Lease), but that is insurance
# against a botched rollout racing two replicas — singleton-by-construction
# stays the deployment model. Do not scale these.
#
# No credential is mounted anywhere here: provider and forge credentials live
# in Secrets referenced by the Integration and Forge custom resources
# (spec.secretRef), read on demand through the API.
#
# With agent.repositoryImages enabled, source-controller additionally mounts
# the cosign public key (a ConfigMap, configmap.yaml) and, with pullSecret,
# the registry credential (optional; serviceaccounts.yaml renders it from
# pullSecretData) it resolves declared images with — the one
# dockerconfigjson key mapped to config.json, the file go-containerregistry
# reads under DOCKER_CONFIG.
---
# Source: patchy/templates/intent-controller.yaml
# Copyright 2026 Bitwise Media Group Ltd.
# SPDX-License-Identifier: MIT
#
# The intent controller, in one file (evaluation-controller precedent): an
# optional component (intentController.enabled, default false) that polls
# each Project's intent repository, plans the work in a read-only agent Job,
# posts the plan for an approver, builds the approved plan in the application
# repository's own image, pushes it to a branch it creates once and opens the
# pull request. With it off the chart renders exactly as it did without it:
# the fragments it adds elsewhere (the egress broker and the claude egress
# policies, through patchy.brokerEnabled and patchy.harnessEnabled) are keyed
# on the same flag. Mirrors deploy/kustomize/components/intent-controller.
#
# It is the second code path that writes to a forge (remediation-controller is
# the first). In the release namespace `secrets get` is limited to names in
# intentController.forgeSecrets; its agent-jobs Role can get, create, update
# and delete any Secret in the agents namespace, including model keys,
# image-pull credentials and other Jobs' handoffs. GitHub tokens are scoped
# per operation to one repository and one permission (opening a pull request
# also reads contents, which a private repository requires). There is no
# ClusterRole.
---
# Source: patchy/templates/egress-broker.yaml
# Ingress: the proxy port from the agent namespace only — the broker answers
# to agent pods and nobody else (the job controllers' advisory startup probe
# uses the unauthenticated /readyz on the same port, so they are granted it
# too) — plus 8081 probes from anywhere (kubelet probes arrive from the node
# IP). Egress: DNS, then TCP 443/6443 — the model APIs and the Kubernetes API
# server (TokenReview). extraEgress covers the cloud-identity side channels
# (EKS Pod Identity 169.254.170.23:80, GKE metadata 169.254.169.254:80) —
# but only on CNIs whose ipBlock can reach the node; under mode cilium the
# CiliumNetworkPolicy below is what actually grants them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: patchy-egress-broker
    namespace: patchy
    labels:
        app: egress-broker
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: egress-broker
            app.kubernetes.io/instance: patchy
            app.kubernetes.io/part-of: patchy
    policyTypes: [Ingress, Egress]
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: patchy-agents
              - podSelector: {}
          ports:
              - protocol: TCP
                port: 8080
        - ports:
              - protocol: TCP
                port: 8081
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
---
