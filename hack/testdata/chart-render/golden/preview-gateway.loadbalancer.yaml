# Source: maul/templates/preview-auth.yaml
# The preview gateway's Service: what an edge (Ingress, HTTPRoute, a tunnel)
# points at, or a LoadBalancer of its own. Port 80 is the gateway's own
# listener (8082), where it answers every preview host and the sign-in host;
# anything else reaching the relay's endpoints there (an edge that does not
# filter by Host) is rate limited behind gateway.forwardedHops, never the
# relay's.
apiVersion: v1
kind: Service
metadata:
  name: maul-preview-gateway
  namespace: maul
  labels:
    app: preview-auth
    helm.sh/chart: maul-VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/name: preview-auth
    app.kubernetes.io/instance: maul
    app.kubernetes.io/part-of: maul
spec:
  type: LoadBalancer
  # Local keeps the client's address as the peer (forwardedHops 0): under
  # Cluster, kube-proxy source-NATs to a node address, which inboundCIDRs
  # would refuse and the rate limit would share among every viewer.
  externalTrafficPolicy: Local
  # previewAuth.gateway.inboundCIDRs, kept at the load balancer.
  loadBalancerSourceRanges:
    - 203.0.113.0/24
    - 2001:db8::/32
  selector:
    app.kubernetes.io/name: preview-auth
    app.kubernetes.io/instance: maul
    app.kubernetes.io/part-of: maul
  ports:
    - name: http
      port: 80
      targetPort: gateway
      protocol: TCP
