# Source: maul/templates/preview-auth.yaml
# Ingress: 8080 from the edge ALB (ingressFrom narrows it to the ALB's
# subnets; it targets the pods by IP) plus 8081 probes. Egress: DNS, and TCP
# 443 and 6443 anywhere: the API server (Previews, access reviews, the
# Lease), Dex at its public issuer, and every preview host the probe asks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maul-preview-auth
  namespace: maul
  labels:
    app: preview-auth
    helm.sh/chart: maul-VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/name: preview-auth
    app.kubernetes.io/instance: maul
    app.kubernetes.io/part-of: maul
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: preview-auth
      app.kubernetes.io/instance: maul
      app.kubernetes.io/part-of: maul
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8082
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # The gateway proxies to the slot Pods' port http (the Service
    # resolves to them), and to nothing else in the slots.
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - maul-preview-0
                  - maul-preview-1
      ports:
        - protocol: TCP
          port: http
---
# Source: maul/templates/preview-foundation.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-isolation
  namespace: maul-preview-0
  annotations:
    helm.sh/resource-policy: keep
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Port http only, from the preview ALB's subnets (the legacy path)
    # and the preview gateway's Pods: in the release namespace AND
    # carrying its dedicated label, never the chart's selector labels.
    - from:
        - ipBlock:
            cidr: 10.40.128.0/24
        - ipBlock:
            cidr: 10.40.129.0/24
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maul
          podSelector:
            matchLabels:
              maul.run/preview-gateway: "true"
      ports:
        - protocol: TCP
          port: http
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.10/32
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Source: maul/templates/preview-auth.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: maul-preview-auth-config
  namespace: maul
  labels:
    app: preview-auth
    helm.sh/chart: maul-VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/name: preview-auth
    app.kubernetes.io/instance: maul
    app.kubernetes.io/part-of: maul
data:
  MAUL_HEALTH_ADDR: ":8081"
  MAUL_LISTEN_ADDR: ":8080"
  MAUL_LOG_LEVEL: "warn"
  MAUL_PREVIEW_AUTH_ACCESS_TOKEN_TTL: "10m"
  MAUL_PREVIEW_AUTH_DEX_CLIENT_ID: "maul-preview-auth"
  MAUL_PREVIEW_AUTH_DEX_CLIENT_SECRET_FILE: "/etc/maul/preview-auth/dex/clientSecret"
  MAUL_PREVIEW_AUTH_DEX_ISSUER_URL: "https://dex.maul.devthe.net"
  MAUL_PREVIEW_AUTH_FORWARDED_HOPS: "1"
  MAUL_PREVIEW_AUTH_GATEWAY: "true"
  MAUL_PREVIEW_AUTH_GATEWAY_FORWARDED_HOPS: "0"
  MAUL_PREVIEW_AUTH_GATEWAY_INBOUND_CIDRS: "203.0.113.0/24,2001:db8::/32"
  MAUL_PREVIEW_AUTH_GATEWAY_LISTEN_ADDR: ":8082"
  MAUL_PREVIEW_AUTH_GATEWAY_SIGN_IN_HOST: "preview-auth.maul.devthe.net"
  MAUL_PREVIEW_AUTH_GROUPS_CLAIM: "groups"
  MAUL_PREVIEW_AUTH_GROUPS_PREFIX: "github:"
  MAUL_PREVIEW_AUTH_HOST_SUFFIX: "preview.maul.devthe.net"
  MAUL_PREVIEW_AUTH_ISSUER: "https://preview-auth.maul.devthe.net"
  MAUL_PREVIEW_AUTH_KEYS_DIR: "/etc/maul/preview-auth/keys"
  MAUL_PREVIEW_AUTH_LEDGER_LEASE: "maul-preview-auth-codes"
  MAUL_PREVIEW_AUTH_PROBE_INTERVAL: "1m"
  MAUL_PREVIEW_AUTH_RATE_BURST: "30"
  MAUL_PREVIEW_AUTH_RATE_PER_SECOND: "5"
  MAUL_PREVIEW_AUTH_REQUIRE_VERIFIED_EMAIL: "false"
  MAUL_PREVIEW_AUTH_SESSION_MAX_AGE: "12h"
  MAUL_PREVIEW_AUTH_SLOT_COUNT: "2"
  MAUL_PREVIEW_AUTH_USERNAME_CLAIM: "preferred_username"
  MAUL_PREVIEW_AUTH_USERNAME_PREFIX: "github:"
