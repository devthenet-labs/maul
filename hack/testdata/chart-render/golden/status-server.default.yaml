apiVersion: v1
kind: Service
metadata:
    name: maul-status-server
    namespace: maul
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
