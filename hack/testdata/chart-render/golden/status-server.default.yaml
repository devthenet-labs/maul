# Source: maul/templates/status-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
    name: maul-status-server
    namespace: maul
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
        app.kubernetes.io/component: server
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: status-server
            app.kubernetes.io/instance: maul
            app.kubernetes.io/part-of: maul
    template:
        metadata:
            labels:
                app: status-server
                helm.sh/chart: maul-VERSION
                app.kubernetes.io/managed-by: Helm
                app.kubernetes.io/version: "VERSION"
                app.kubernetes.io/name: status-server
                app.kubernetes.io/instance: maul
                app.kubernetes.io/part-of: maul
                app.kubernetes.io/component: server
            annotations:
                checksum/config: CHECKSUM
        spec:
            serviceAccountName: maul-status-server
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                fsGroupChangePolicy: Always
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: server
                  image: ghcr.io/devthenet-labs/maul/status-server:vVERSION
                  imagePullPolicy: IfNotPresent
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: maul-status-server-config
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 50m
                        memory: 64Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: auth
                        mountPath: /etc/maul/auth
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
            volumes:
                # optional: with no auth Secret at all the server runs the
                # rollups-only posture.
                - name: auth
                  secret:
                      secretName: maul-status-auth
                      optional: true
                - name: tmp
                  emptyDir: {}
