---
# Source: maul/templates/status-server.yaml
# Ingress: 8080 from anywhere (the fronting ingress/gateway lives wherever
# yours does; session authentication and the public-rollups-only unconfigured
# posture carry the access control) plus 8081 probes. Egress: DNS, the
# Kubernetes API server (cache watches + access reviews), and TCP 443 out
# (the OIDC issuer, an OTLP collector).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: maul-status-server
    namespace: maul
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: status-server
            app.kubernetes.io/instance: maul
            app.kubernetes.io/part-of: maul
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 8080
              - protocol: TCP
                port: 8081
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
---
# Source: maul/templates/status-server.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-status-server
    namespace: maul
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
---
# Source: maul/templates/status-server.yaml
apiVersion: v1
kind: ConfigMap
metadata:
    name: maul-status-server-config
    namespace: maul
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
data:
    MAUL_AGENT_NAMESPACE: "maul-agents"
    MAUL_AUTH_CONFIG: "/etc/maul/auth/config.yaml"
    MAUL_HEALTH_ADDR: ":8081"
    MAUL_LISTEN_ADDR: ":8080"
    MAUL_LOG_LEVEL: "warn"
---
# Source: maul/templates/status-server.yaml
# SubjectAccessReview is cluster-scoped, so this one grant needs a
# ClusterRole. Review-only: the power to ask "may user U approve findings?",
# not to act.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-status-server-authz
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [authorization.k8s.io]
      resources: [subjectaccessreviews]
      verbs: [create]
---
# Source: maul/templates/status-server.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: maul-status-server-authz
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: maul-status-server-authz
subjects:
    - kind: ServiceAccount
      name: maul-status-server
      namespace: maul
