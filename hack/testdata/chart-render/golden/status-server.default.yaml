# Source: maul/templates/status-server.yaml
# Reads Findings/FindingRollups for the projection; writes SPEC only
# (approve records spec.approval, retry/expedite record spec.retry /
# spec.expedite, suspend/resume toggle spec.suspend, replay stamps
# Integration spec.replay). Deliberately NO */status — the status server
# never moves a phase — and no leases (no reconcilers, no leader election).
# The delete/deletecollection verbs back the access-review-gated reset
# action (demo tooling): wipe the pipeline state, keep the configuration.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: maul-status-server
    namespace: maul
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [findings]
      verbs: [get, list, watch, update, patch, delete, deletecollection]
    - apiGroups: [maul.run]
      resources: [findingrollups]
      verbs: [get, list, watch, delete, deletecollection]
    # Read-only plus reset: the projection lifts each run's report markdown
    # from the Investigation/Remediation children (reports live on the child
    # only); repositories exist for reset alone.
    - apiGroups: [maul.run]
      resources: [investigations, remediations, repositories]
      verbs: [get, list, watch, delete, deletecollection]
    # Spec-only write seam for the replay and backfill actions (spec.replay,
    # spec.backfill); the cached client's informer needs list/watch.
    - apiGroups: [maul.run]
      resources: [integrations]
      verbs: [get, list, watch, update, patch]
    # Read-only: the configuration view projects the Forges alongside the
    # Integrations.
    - apiGroups: [maul.run]
      resources: [forges]
      verbs: [get, list, watch]
    # The persisted agent transcripts, read one at a time when a human opens a
    # finding. Get only: they are read through the uncached API reader, so no
    # informer and no list/watch — caching every ConfigMap in the namespace to
    # serve these would be a poor trade.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get]
---
# Source: maul/templates/status-server.yaml
# Live transcripts: the status server follows a running agent's pod log to
# stream its conversation, through the API server — it never dials an agent
# pod, so the agents' default-deny ingress policy is untouched. Read-only, and
# scoped to the agents namespace: no Jobs, no Secrets, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: maul-status-server-agent-logs
    namespace: maul-agents
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
---
# Source: maul/templates/status-server.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-status-server-agent-logs
    namespace: maul-agents
    labels:
        app: status-server
        helm.sh/chart: maul-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: maul
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: maul-status-server-agent-logs
subjects:
    - kind: ServiceAccount
      name: maul-status-server
      namespace: maul
