#
# The Project settings page on, over the intents views, behind an
# operator-owned auth Secret (opaque to the chart: the server checks at
# startup that it is oidc with both prefixes and the federated:id scope).
# Every bound is the chart's default.
statusServer:
    intents:
        enabled: true
    auth:
        existingSecret: maul-status-auth
    projectSettings:
        enabled: true
