  name: preview-shop-1
  namespace: maul-preview-0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: maul-preview-controller
      maul.run/preview: shop-1
      maul.run/preview-component: web
      maul.run/preview-uid: preview-shop-1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        maul.run/reset-generation: "2"
      labels:
        app.kubernetes.io/managed-by: maul-preview-controller
        maul.run/preview: shop-1
        maul.run/preview-component: web
        maul.run/preview-part: web
        maul.run/preview-role: component
        maul.run/preview-uid: preview-shop-1
    spec:
      automountServiceAccountToken: false
      containers:
      - image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/maul/previews/acme-web:sha-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: IfNotPresent
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        eks.amazonaws.com/nodeclass: maul-preview
        karpenter.sh/nodepool: maul-preview
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: default
      tolerations:
      - effect: NoExecute
        key: maul.devthe.net/preview-only
        operator: Equal
        value: "true"
status: {}
