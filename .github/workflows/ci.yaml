# Continuous integration — thin caller for the org's reusable ci workflow (v5+:
# mise-task aware). It discovers the canonical tasks this repo defines and runs
# `make lint` / `build` / `test` as one parallel job each, then Codecov uploads
# from coverage/ — emitted by `make test`. `make lint` carries all check-mode
# static analysis — golangci-lint, govulncheck, addlicense, markdownlint,
# prettier --check — with the pinned tools coming from the toolchain submodule
# at .mise/ (no package.json or .node-version: mise provisions its own Node for
# the prose linters). The Go version for the product build comes from go.mod.
# The e2e suite runs sharded in the repo-local e2e job, and the repo-local
# envtest and helm-lint jobs cover the gates the reusable workflow has no slot
# for.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Dependabot keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        # The default cache-dependency-path (go.sum) is the only lockfile that
        # affects the build: the dev CLIs (golangci-lint, govulncheck, addlicense,
        # gotestsum, ...) are pinned by the toolchain submodule's
        # config.toml/mise.lock, not a tools/go.sum.
        uses: devthenet-labs/github-workflows/.github/workflows/ci.yaml@6838679e81c60654484ad3a7dec7697a2236748e # v6.3.0 + RUNNER_LABEL
        with:
            # The reusable workflow's e2e job runs the suite as one job, which
            # took ~2030s of hack/e2e.sh's 45m go test timeout; the repo-local
            # e2e job below runs it as two shards instead.
            e2e: false
            # The Codecov upload cannot succeed from this fork: the reusable
            # workflow hands codecov-action no token (upstream relies on its
            # Codecov org accepting tokenless uploads from public repos), and
            # devthenet-labs has no Codecov org, so every upload is refused with
            # "Token required - not valid tokenless upload". The job only ever
            # ran once lint went green, so this was a latent, not a new, failure.
            # `make test` still measures coverage; only the upload is skipped.
            # Flip back to true once devthenet-labs is on Codecov with tokenless
            # public uploads enabled.
            coverage: false

    # The end-to-end suite (`mise run e2e`): it boots an envtest
    # kube-apiserver, builds the real binaries and drives them against the
    # in-memory fake GitHub; the only network it touches is setup-envtest's
    # asset download. As one job it ran ~2030s of hack/e2e.sh's 45m go test
    # timeout, so it runs as two shards (MAUL_E2E_SHARD: e2e/shard splits the
    # top-level tests by a hash of their names, every test in exactly one
    # shard). Each shard builds the binaries its tests need. Set up as the
    # reusable workflow's e2e job was, with its action pins (github-workflows
    # v6.3.0).
    e2e:
        name: e2e (${{ matrix.shard }})
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        strategy:
            fail-fast: false
            matrix:
                shard: [1/2, 2/2]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run e2e
              env:
                  MAUL_E2E_SHARD: ${{ matrix.shard }}
              run: mise run e2e

    # The envtest suites (CRD schema validation, the action gating against a
    # real API server) skip themselves without KUBEBUILDER_ASSETS, so the `test`
    # job above passes without ever running them, and the reusable workflow has
    # no slot for an extra task. `make pr` runs them locally; this job is the
    # CI half. The setup mirrors the reusable workflow's jobs, with its action
    # pins (github-workflows v6.3.0) — keep the two in step when bumping.
    envtest:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            # pinned dev CLIs (setup-envtest among them) install via mise,
            # checksum-verified against mise.lock
            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run envtest
              run: mise run envtest

    # The chart gate: helm lint, a render of every component combination the
    # templates branch on, and the render assertions (hack/chart-render-test.sh:
    # which keys reach which controller, the mounts, the render-time guards and
    # the schema's value formats). The reusable workflow has no slot for it, the
    # toolchain's lint-helm scans helm/ rather than charts/, and helm.yaml lints
    # only at release, after the chart has merged. helm and yq come pinned from
    # mise, set up as in the envtest job above; no Go toolchain is needed.
    helm-lint:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run helm-lint
              run: mise run helm-lint

    # The reference AWS terraform module (deploy/terraform/aws): fmt -check,
    # validate, tflint, the offline mock-provider `terraform test` suites and
    # the terraform-docs drift check (hack/tf-lint.sh). No AWS credentials:
    # init downloads the AWS provider only for its schema. terraform, tflint and
    # terraform-docs come pinned from mise, set up as in the jobs above.
    terraform:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run tf-lint
              run: mise run tf-lint

    # The trees `maul init app` generates, checked the way their own CI
    # would (hack/scaffold-check.sh): actionlint, shellcheck and hadolint over
    # the golden trees, the guard's node tests, the publishers' python tests
    # and a vet and race test of the generated Go service. The golden test in
    # the test job pins their bytes; this proves those bytes work. Set up as
    # in the envtest job above; mise provides the linters, node and python.
    scaffold-check:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run scaffold-check
              run: mise run scaffold-check

    # The release packaging, built the way the release workflow builds it but
    # never published: `mise run snapshot` (goreleaser release --snapshot
    # --clean --skip=sign) compiles every goreleaser build for every target,
    # writes the archives and SBOMs, and builds every dockers_v2 image from its
    # Dockerfile for both platforms. Snapshot mode never pushes, and
    # --skip=sign leaves cosign out (it needs the release workflow's OIDC
    # token). A Dockerfile that COPYs a binary its image no longer gets, an
    # image whose build was removed, or a Dockerfile step that no longer runs
    # (a vanished apk pin) fails here instead of in the release after the
    # merge. The step before it holds the builds to cmd/: every binary there
    # must be built, so a new one cannot silently ship in no archive and no
    # image. QEMU and buildx as in the reusable release workflow, which runs
    # the arm64 stages emulated; goreleaser, syft and node come pinned from
    # mise, set up as in the envtest job above. The full history is fetched so
    # goreleaser can derive the snapshot version from the last tag.
    snapshot:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        timeout-minutes: 45
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/
                  fetch-depth: 0

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Setup QEMU
              uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

            - name: Setup docker buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Every binary under cmd/ is a goreleaser build
              run: ./hack/release-builds-check.sh

            - name: Build the release snapshot
              run: mise run snapshot

    # The pins `maul setup previews` recommends (`mise run preview-pins`,
    # TestLivePins): each pinned upstream chart version exists,
    # the values the recipes write render with it, and the generated Issuers
    # and Certificates are valid against cert-manager's CRDs at that version;
    # the pinned cloudflared image runs at its tag and digest and accepts the
    # cloudflare-tunnel recipe's config (offline: ingress validate and rule).
    # A stale or mistyped pin is a maul-documented vulnerability (design
    # §5.3), so this runs on every pull request, renovate's bumps included. It
    # needs the network (the charts' repositories, Docker Hub), helm, which
    # mise pins, and docker, which the runner image has; set up as in the
    # envtest job above.
    preview-pins:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (tasks + pinned tools) at .mise/

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run preview-pins
              run: mise run preview-pins

    # The claude CLI posture probe (hack/claude-posture-probe.sh): the REAL
    # claude CLI at the version Dockerfile.claude-agent-runner pins, run with
    # the postured argv against a scratch tree whose hooks, env block,
    # settings and .mcp.json must all stay inert, beside a scripted fake model
    # on loopback (no credential). It runs only when the CLI pin (a renovate
    # bump) or the posture changed against the base; `mise run
    # claude-posture-probe` runs it on demand. The full history is fetched so
    # the base commit is there to diff against.
    claude-posture-probe:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  fetch-depth: 0

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run the probe if the CLI pin or the posture changed
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
                    ./hack/claude-posture-probe.sh --if-changed "$BASE"
                  else
                    ./hack/claude-posture-probe.sh
                  fi

    # The browser tool against a real headless Chromium (hack/live-browser.sh,
    # `mise run live-browser`): npm ci of internal/previewtools/node from its
    # exact lockfile, the keyed CDP shim, TestPlaywrightCLIFormat (the pinned
    # Playwright CLI's snapshot and ref grammar against its golden), maul's
    # fixture and a compiled check under tsc --strict, and TestLiveBrowser
    # (the browser trial's matrix through the relay with no model), plus
    # S1-04's page functions on the same pins. It runs only when the browser
    # tool changed against the base, so every renovate bump of the Playwright
    # pins runs it. Chromium is the runner image's google-chrome; node comes
    # from mise, set up as in the preview-pins job.
    browser-tools:
        runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
        permissions:
            # check out the repository
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false # read-only checkout; don't leave the token in .git/config
                  submodules: true # the shared toolchain (pinned node) at .mise/
                  fetch-depth: 0

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: v2026.9.1
                  # sha256 of the linux-x64 mise binary for the version above, from the release's
                  # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
                  sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

            - name: Run the browser tool's live tests if it changed
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  MAUL_LIVE_PAGE_FUNCTIONS: "1"
              run: |
                  if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
                    mise exec -- ./hack/live-browser.sh --if-changed "$BASE"
                  else
                    mise exec -- ./hack/live-browser.sh
                  fi
