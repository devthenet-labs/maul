#
# The status server's grants for the intents views; mirrors the chart's
# statusServer.intents.enabled Roles (hack/chart-render-test.sh compares the
# rules).
#
# Read-only on the intent kinds, cached through informers (hence list and
# watch). Never */status, never a write, never Secrets. The plan and
# transcript ConfigMaps are read with the base Role's configmaps get, and the
# server serves one only when it carries the intent's label and a controller
# reference to its very owner. An evaluate run's evidence view gets its one
# PreviewVerification by name through the uncached reader (get only), and
# that verification's ledger and evidence ConfigMaps the same guarded way.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: maul-status-server-intents
    namespace: maul
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [projects, intents, intentruns, previews]
      verbs: [get, list, watch]
    - apiGroups: [maul.run]
      resources: [previewverifications]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-status-server-intents
    namespace: maul
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: maul-status-server-intents
subjects:
    - kind: ServiceAccount
      name: maul-status-server
      namespace: maul
---
# A live intent run's Job clock (creation, start, activeDeadlineSeconds, the
# stage idle limit) for the run panel, and the live follow's "has the Job
# ended" check. get only: the server projects those fields and never passes
# the Job (its env names SecretKeyRefs) to a viewer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: maul-status-server-agent-jobs
    namespace: maul-agents
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-status-server-agent-jobs
    namespace: maul-agents
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: maul-status-server-agent-jobs
subjects:
    - kind: ServiceAccount
      name: maul-status-server
      namespace: maul
