#
# DOCUMENTATION, not a resource — deliberately absent from kustomization.yaml
# (like secrets.example.yaml). Copy into your environment overlay and bind to
# your own users/SSO groups.
#
# Two clients consume these grants, and they are authorized differently:
#
#   * the STATUS PAGE evaluates them per signed-in user by asking the cluster
#     (SubjectAccessReview) — those users need no kubeconfig and never talk to
#     the API server themselves;
#   * the maul CLI acts as the user's OWN kubeconfig identity, so the API
#     server authorizes it directly.
#
# The CLI is why every role below viewer also grants native `patch` (and
# `update`, for kubectl edit): without them no client acting as the user could
# write a finding at all. The CLI writes each action as a merge patch of the
# one field it sets, so its field manager never claims fields an operator
# applies. RBAC has no notion of a field, so `patch`/`update` alone would
# grant the whole resource — the
# ValidatingAdmissionPolicy in admission-policy.yaml is what narrows it back
# down, binding each spec field to its custom verb for every client equally.
# Grant `patch`/`update` only alongside that policy, and note that `create`/`delete`
# are deliberately absent: with them, a user could delete a finding and
# recreate it with an approval already set.
#
# What the verbs buy:
#
#   * viewing findings   — native `get` on findings
#   * the action buttons — the CUSTOM verbs approve / retry / expedite /
#                          suspend / resume on findings.maul.run.
#                          Custom verbs are plain strings to RBAC; nothing
#                          else consumes them, so granting one confers exactly
#                          one button. approve releases holds and revives
#                          handed-off findings; retry recovers a Failed
#                          finding to the state it failed from; expedite skips
#                          the waiting stages (accumulation window, minimum
#                          age, queue position).
#   * the configuration view — native `get` on integrations shows the
#                          Forges/Integrations/enhancers configuration page.
#   * the backfill trigger — the CUSTOM verb backfill on
#                          integrations.maul.run stamps
#                          spec.backfill: a one-shot list-alerts walk that
#                          ingests alerts predating webhook coverage.
#   * the user menu's demo tooling — the CUSTOM verbs replay / reset on
#                          integrations.maul.run. replay asks
#                          the integration-controller to redeliver the
#                          webhook delivery log; reset deletes every
#                          pipeline resource in the namespace (findings,
#                          runs, repositories, rollups). Grant sparingly.
#
# MIGRATION (pre-1.0 breaking change): replay and reset used to be verbs on
# findings.maul.run. They moved to integrations — the resource
# they actually act on, and the one the integrations admission policy's
# authorizer checks — so existing bindings that grant `replay, reset` on
# findings must move those verbs to an integrations rule (with the native
# update/patch to write the stamp), as maul-findings-admin below does.
#
# Rollup statistics are public by design and need no grant on the status page.
# The CLI reads them through the API server like anything else, so `maul get
# rollups` does need get/list — which the viewer role already carries.
#
# Subjects come from the OIDC claims (auth config claims: username/groups),
# so bind Users to the username claim's values (e.g. email) and Groups to the
# groups claim's values. The example bindings are namespaced to `maul`:
# grants apply per namespace, uniformly across the findings in it.
---
# Read-only: sees the findings board and detail, never an action button.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-findings-viewer
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [findings, findingrollups]
      verbs: [get, list]
---
# Viewer + the approve button (AwaitingApproval holds and HandedOff revival).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-findings-approver
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [findings, findingrollups]
      verbs: [get, list]
    - apiGroups: [maul.run]
      resources: [findings]
      # update is the native verb the API server checks; the admission policy
      # is what limits it to spec.approval for this role.
      verbs: [update, patch, approve]
---
# Viewer + every action: approve, retry, expedite, suspend, resume.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-findings-operator
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [findings, findingrollups]
      verbs: [get, list]
    - apiGroups: [maul.run]
      resources: [findings]
      verbs: [update, patch, approve, retry, expedite, suspend, resume]
---
# Operator + the configuration view, the backfill trigger, and the user
# menu's demo tooling: replay the webhook delivery log, reset (delete) all
# pipeline state. Grant replay/reset sparingly — demo/dev environments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-findings-admin
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [findings, findingrollups]
      verbs: [get, list]
    - apiGroups: [maul.run]
      resources: [findings]
      verbs: [update, patch, approve, retry, expedite, suspend, resume]
    # get/list shows the configuration view (and `maul get integrations`);
    # update/patch is the native verb the stamp write needs; the custom
    # verbs are what the admission policy and the access reviews check.
    - apiGroups: [maul.run]
      resources: [integrations]
      verbs: [get, list, update, patch, backfill, replay, reset]
---
# Example bindings: an SSO group of operators, one individual approver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-findings-operators
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: maul-findings-operator
subjects:
    - kind: Group
      apiGroup: rbac.authorization.k8s.io
      name: security-engineering # a `groups` claim value
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-findings-approvers
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: maul-findings-approver
subjects:
    - kind: User
      apiGroup: rbac.authorization.k8s.io
      name: dev@example.com # a `username` claim value
---
# The intents views (components/status-intents; the chart's
# statusServer.intents.enabled): two read tiers per Project, each an access
# review for get on a VIRTUAL subresource of projects.maul.run.
# Nothing on the API server serves projects/intents or projects/transcripts,
# so these rules grant kubectl nothing; the status server's reviews are their
# only reader. With the intents views on, usernames and groups reach the
# reviews prefixed (auth config claims.usernamePrefix / groupsPrefix), so
# bind the prefixed names: github:octocat, github:acme:security. The prefixes
# apply to EVERY review the status server runs, the findings ones above
# included: once they are set, those bindings must name the prefixed values
# too, or their subjects lose the findings page.
#
#   * projects/intents     — the board, timeline and run numbers (phases,
#                            durations, recorded cost, outcomes in public
#                            wording, pull request and preview links)
#   * projects/transcripts — plus private content: plan text, run reports and
#                            transcripts. Grant it with projects/intents; on
#                            its own it opens nothing.
#
# A rule without resourceNames covers every Project; resourceNames scopes it
# to the Projects named. NEVER give a per-Project viewer native reads instead:
# get on configmaps in maul reads every Project's plans and transcripts (and
# every finding's), and pods/log in maul-agents reads raw agent output; the
# built-in view and edit roles include both.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-intents-viewer
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [projects/intents]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-intents-content
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [projects/intents, projects/transcripts]
      verbs: [get]
---
# Every Project's board for the whole security team.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-intents-viewers
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: maul-intents-viewer
subjects:
    - kind: Group
      apiGroup: rbac.authorization.k8s.io
      name: github:acme:security # a prefixed `groups` claim value (Dex: org:team)
---
# One Project's plans and transcripts for the team that owns it: a Role, not
# the ClusterRole, because resourceNames lives in the rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: maul-intents-content-storefront
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [projects/intents, projects/transcripts]
      resourceNames: [storefront] # the Project's name
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-intents-content-storefront
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: maul-intents-content-storefront
subjects:
    - kind: Group
      apiGroup: rbac.authorization.k8s.io
      name: github:acme:storefront
    - kind: User
      apiGroup: rbac.authorization.k8s.io
      name: github:octocat # a prefixed `username` claim value (a GitHub login)
---
# Preview viewers: who may open a Project's live previews once preview sign-in
# is on. One access review for get on the VIRTUAL subresource projects/previews,
# by Project name, in the release namespace. Like projects/intents, nothing on
# the API server serves it, so the rule grants kubectl nothing, and no
# admission policy is involved: no write ever reaches the API server for it.
# It is separate from the intents tiers in both directions: projects/intents
# and projects/transcripts do not open a preview, and projects/previews shows
# no board. Previews may carry real staging data, so grant it to people, not
# to service identities. Bind the prefixed claim values as above; prefer team
# groups over individual logins (GitHub logins are case-insensitive and can be
# renamed and re-registered, RBAC subject names are neither).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-preview-viewer
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [projects/previews]
      verbs: [get]
---
# Every Project's previews for one team. For one Project only, use a Role
# with resourceNames: [<project>], as maul-intents-content-storefront does.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-preview-viewers
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: maul-preview-viewer
subjects:
    - kind: Group
      apiGroup: rbac.authorization.k8s.io
      name: github:acme:reviewers # a prefixed `groups` claim value (Dex: org:team)
---
# Remote-evaluation submitters (the evolve CLI): create submits an
# evaluation and uploads workspaces, get reads snapshots and streams the SSE
# monitor, delete cancels. Native verbs only — no custom verbs, no admission
# policy involved; these bindings are the evaluation API's entire
# authorization surface.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: maul-evaluations-submitter
    labels:
        app.kubernetes.io/part-of: maul
rules:
    - apiGroups: [maul.run]
      resources: [evaluations]
      verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: maul-evaluations-submitters
    namespace: maul
    labels:
        app.kubernetes.io/part-of: maul
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: maul-evaluations-submitter
subjects:
    - kind: Group
      apiGroup: rbac.authorization.k8s.io
      name: skill-authors # a `groups` claim value
