#
# EXAMPLE ONLY — every resource here is commented out, and this file is NOT in
# kustomization.yaml's resources list. It documents the Secrets maul
# expects; it does not create them.
#
# Do not put real values in git. Use SOPS (age/KMS-encrypted, decrypted by
# your GitOps tooling or `sops -d | kubectl apply -f -`) or
# external-secrets.io with your own vault as the backing store, and reference
# them from an overlay. Plain `kubectl create secret` is fine for kind/dev.
#
# ---------------------------------------------------------------------------
# 1. maul-github  (namespace: maul)
#
# The GitHub credential, referenced by CUSTOM RESOURCES, not by Deployments:
# an Integration's spec.secretRef names it for webhook validation + issue
# projection + alert ingestion; a Forge's spec.secretRef names it (or a
# separate one) for repository clone/push access. One Secret may serve both,
# or you may split read and write identities across two GitHub Apps.
#
# Keys (internal/ghsecret):
#   appID + privateKey   GitHub App auth — the production mode. Tokens are
#                        minted per-installation, scoped per-repository.
#   token                a personal-access-token fallback (dev only; wins
#                        over App auth when set).
#   webhookSecret        the HMAC secret configured on the App's webhook
#                        (Integration secrets only; Forge ignores it).
#   proxyUsername +      OPTIONAL — basic-auth credentials for the forward
#   proxyPassword        proxy named by the referencing resource's spec.proxy
#                        (never embed them in the proxy URL itself).
#
# kubectl -n maul create secret generic maul-github \
#   --from-literal=appID=123456 \
#   --from-file=privateKey=./maul.2026-01-01.private-key.pem \
#   --from-literal=webhookSecret="$(openssl rand -hex 32)"
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: maul-github
#     namespace: maul
# type: Opaque
# stringData:
#     appID: "123456"
#     privateKey: |
#         -----BEGIN RSA PRIVATE KEY-----
#         ...the App's private key, downloaded once at App creation...
#         -----END RSA PRIVATE KEY-----
#     webhookSecret: "0123456789abcdef...  # openssl rand -hex 32"
#
# ---------------------------------------------------------------------------
# 2. the model credentials
#
# 2a. maul-anthropic — the claude runner's Anthropic credential (namespace:
# maul — NOT maul-agents). Claude is brokered: its model traffic goes
# through the egress credential broker, which is the Secret's ONLY consumer,
# so the credential lives in the controllers' namespace and never enters an
# agent pod. Only needed when the claude provider is `anthropic` (bedrock/
# vertex/foundry-entra use the broker's cloud workload identity instead).
# The api-key key holds either an API key (MAUL_ANTHROPIC_AUTH=key, the
# default) or a `claude setup-token` OAuth token (MAUL_ANTHROPIC_AUTH=
# token — the brokered replacement for the old CLAUDE_CODE_OAUTH_TOKEN
# secretEnv).
#
# MIGRATION from releases before the broker: this Secret used to live in
# maul-agents. Create it in maul, upgrade (the broker lands), then
# delete the old copy from maul-agents.
#
# kubectl -n maul create secret generic maul-anthropic \
#   --from-literal=api-key="sk-ant-..."
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: maul-anthropic
#     namespace: maul
# type: Opaque
# stringData:
#     api-key: "sk-ant-..."
#
# 2b. maul-openai — the codex runner's OpenAI API key, consumed ONLY by the
# egress broker, like 2a (namespace: maul, NOT maul-agents). Only needed
# when `codex` is in MAUL_HARNESSES. Codex is brokered: no credential
# enters a codex agent pod. Mount it into maul-egress-broker at
# /etc/maul/openai and set MAUL_OPENAI_API_KEY_FILE to
# /etc/maul/openai/api-key (configmap.yaml). API keys only. MIGRATION: it
# used to live in maul-agents, injected into codex pods; create it here,
# drop MAUL_CODEX_SECRET*, then delete the old copy.
#
# kubectl -n maul create secret generic maul-openai \
#   --from-literal=api-key="sk-..."
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: maul-openai
#     namespace: maul
# type: Opaque
# stringData:
#     api-key: "sk-..."
#
# 2c. the NON-BROKERED harness runner (namespace: maul-agents — NOT maul).
# One Secret for an enabled copilot runner. It lives in the AGENT namespace
# because it is consumed by the agent Job pods, not by the controllers:
# internal/jobs appends the runner's credential
#   $MAUL_<HARNESS>_SECRET_ENV <- secretKeyRef{name: $MAUL_<HARNESS>_SECRET,
#                                                key:  $MAUL_<HARNESS>_SECRET_KEY}
# to the agent container of a Job that runs that harness. A non-brokered
# harness is enabled only when it is in MAUL_HARNESSES AND its Secret
# exists (checked at controller startup); claude and codex are enabled by
# configuration alone, with a missing broker credential surfacing at the
# broker's /readyz.
#
# 2c. maul-copilot — the copilot runner. Only needed when `copilot` is in
# MAUL_HARNESSES. Unlike 2a/2b this is NOT a model API key: the Copilot CLI
# authenticates with a GitHub token (injected as COPILOT_GITHUB_TOKEN; GH_TOKEN
# and GITHUB_TOKEN are also accepted), which is the one credential class the
# agent pod is otherwise built never to hold. The agent cannot spend it against
# the GitHub API — the runner disables the built-in GitHub MCP server and the
# egress policy admits only the Copilot endpoints — but scope it as tightly as
# your account allows (a fine-grained token with Copilot access and no
# repository permissions; classic PATs are rejected by the CLI outright).
#
# kubectl -n maul-agents create secret generic maul-copilot \
#   --from-literal=token="github_pat_..."
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: maul-copilot
#     namespace: maul-agents
# type: Opaque
# stringData:
#     token: "github_pat_..."
#
# ---------------------------------------------------------------------------
# 3. maul-status-auth  (namespace: maul)
#
# The status server's authentication configuration, mounted at
# /etc/maul/auth (deployment-status-server.yaml; the volume is optional).
# WITHOUT this Secret the status page serves rollup statistics only: no
# findings, no actions, no sign-in. With it, the findings surface opens to
# authenticated users whose RBAC grants viewing (rbac.users.example.yaml).
#
# Key: config.yaml. Modes:
#   none       full access, no sign-in — development only (the dev overlay
#              ships this).
#   anonymous  one fixed identity for every visitor; RBAC still applies.
#   oidc       the real SSO flow (below). The clientSecret also keys the
#              session-cookie encryption: rotating it signs everyone out.
#
# kubectl -n maul create secret generic maul-status-auth \
#   --from-file=config.yaml=./status-auth.yaml
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: maul-status-auth
#     namespace: maul
# type: Opaque
# stringData:
#     config.yaml: |
#         mode: oidc
#         sessionDuration: 168h
#         oidc:
#             issuerURL: https://sso.example.com
#             clientID: maul-status
#             clientSecret: "..."
#             # scopes: [openid, offline_access, profile, email, groups]
#             # autoLogin: true
#             # redirectURL: https://maul-status.example.com/oauth2/callback
#             # claims: {username: email, groups: groups, displayName: name}
#
# ---------------------------------------------------------------------------
# The evaluation API's auth configuration (evaluation-controller mounts it at
# /etc/maul/auth/config.yaml). A trimmed sibling of the status server's:
# no sessions and NO client secret — evolve is a public PKCE client; the API
# only verifies bearer tokens against the issuer. Use `mode: none` for
# dev/e2e (fixed identity, authorization bypassed).
#
# kubectl -n maul create secret generic maul-evaluation-auth \
#   --from-file=config.yaml=./evaluation-auth.yaml
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: maul-evaluation-auth
#     namespace: maul
# type: Opaque
# stringData:
#     config.yaml: |
#         mode: oidc
#         oidc:
#             issuerURL: https://sso.example.com
#             clientID: evolve
#             # scopes: [openid, offline_access, profile, email, groups]
#             # claims: {username: email, groups: groups, displayName: name}
#
# ---------------------------------------------------------------------------
# There is deliberately NO GitHub credential in the maul-agents namespace —
# not even a per-Job one. The agent's init container fetches the repository
# as a digest-verified tarball from source-controller's artifact server; the
# per-Job Secret carries only handoff markdown. That absence is the isolation
# model — see networkpolicy.yaml.
