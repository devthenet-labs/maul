---
# Every controller is a Kubernetes controller now — the CRs in the maul
# namespace are the state machine — so every controller identity mounts its
# token. What each identity may do is pinned, verb by verb, in rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-integration-controller
    namespace: maul
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: maul
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-source-controller
    namespace: maul
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: maul
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-context-controller
    namespace: maul
    labels:
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/part-of: maul
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-investigation-controller
    namespace: maul
    labels:
        app.kubernetes.io/name: investigation-controller
        app.kubernetes.io/part-of: maul
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-remediation-controller
    namespace: maul
    labels:
        app.kubernetes.io/name: remediation-controller
        app.kubernetes.io/part-of: maul
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-evaluation-controller
    namespace: maul
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: maul
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-status-server
    namespace: maul
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: maul
---
# The egress credential broker. Its ONLY Kubernetes access is TokenReview
# (rbac.yaml) — no Secret API reads, no leases. On bedrock/vertex/foundry-
# entra providers this ServiceAccount is also the cloud workload-identity
# attachment point: annotate it (eks.amazonaws.com/role-arn /
# iam.gke.io/gcp-service-account / azure.workload.identity/client-id) in
# your overlay.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-egress-broker
    namespace: maul
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: maul
---
# The identity the agent Job pods run as (internal/jobs default
# --agent-service-account=maul-agent). The agent needs NO Kubernetes API
# access whatsoever, so no Role is bound to it and its token is not mounted —
# a prompt-injected agent must not be able to read the very Secrets the
# isolation model depends on.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: maul-agent
    namespace: maul-agents
    labels:
        app.kubernetes.io/name: maul-agent
        app.kubernetes.io/part-of: maul
automountServiceAccountToken: false
