---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: remediations.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    categories:
    - patchy
    kind: Remediation
    listKind: RemediationList
    plural: remediations
    shortNames:
    - rem
    singular: remediation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.findingRef.name
      name: Finding
      type: string
    - jsonPath: .spec.attempt
      name: Attempt
      type: integer
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.success
      name: Success
      type: boolean
    - jsonPath: .status.branch
      name: Branch
      priority: 1
      type: string
    - jsonPath: .status.stage.usage.costUSD
      name: Cost
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Remediation is one remediation attempt on a Finding: an agent job that
          implements the fix the referenced Investigation recommended, whose
          changeset is pushed as a branch and opened as a pull request. One immutable
          object per attempt, owned by the Finding; the changeset itself never
          appears here.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RemediationSpec identifies one remediation attempt. It is immutable — a
              new attempt is a new Remediation (CEL-enforced).
            properties:
              approvedBy:
                description: |-
                  ApprovedBy is the human whose approval caused this run, when it exists
                  because of one.
                type: string
              attempt:
                description: Attempt ordinal, 1-based.
                format: int32
                minimum: 1
                type: integer
              attributedTo:
                description: |-
                  AttributedTo is who the run is for, stamped at creation by
                  remediation-controller: the Finding's approver when it is held, else the
                  org under --attribution-mode attribute (design L1); nil under mode off and
                  on every run created before it. Immutable with the rest of the spec.
                properties:
                  reason:
                    description: Reason says why.
                    enum:
                    - org
                    - requester
                    - approver
                    - commenter
                    - reviewer
                    - submitter
                    - approver-unregistered
                    - submitter-unregistered
                    type: string
                  user:
                    description: User is the person the run is attributed to; nil
                      for the org.
                    properties:
                      id:
                        description: 'ID is GitHub''s numeric account id: the identity.'
                        format: int64
                        minimum: 1
                        type: integer
                      login:
                        description: |-
                          Login is the GitHub login when the reference was recorded, for display
                          only. Never a Bot: no bot is ever attributed a run.
                        maxLength: 64
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                        type: string
                    required:
                    - id
                    - login
                    type: object
                required:
                - reason
                type: object
                x-kubernetes-validations:
                - message: attributedTo.user is set exactly when the reason names
                    a person
                  rule: has(self.user) == (self.reason in ['requester', 'approver',
                    'commenter', 'reviewer', 'submitter'])
              findingRef:
                description: FindingRef is the owning Finding (UID-pinned).
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              investigationRef:
                description: InvestigationRef is the analysis this run executes.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              parameters:
                description: Parameters bound this run (clamped controller-side).
                properties:
                  estimate:
                    description: |-
                      Estimate the investigation made for this run, recorded alongside the
                      grant so the two can be compared after the fact.
                    properties:
                      maxTurns:
                        description: MaxTurns the investigation predicts the remediation
                          will take.
                        format: int32
                        minimum: 0
                        type: integer
                      tokenBudget:
                        description: TokenBudget is the predicted output-token spend.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  harness:
                    description: |-
                      Harness that runs Model, resolved from the model by the remediation
                      spawner (the model's provider decides which agent-runner image and
                      credential the Job uses). Empty until resolution.
                    type: string
                  maxTurns:
                    description: MaxTurns granted to the run.
                    format: int32
                    minimum: 0
                    type: integer
                  model:
                    description: |-
                      Model the harness runs, as a canonical provider-qualified id
                      (e.g. "anthropic/claude-sonnet-5").
                    type: string
                  tokenBudget:
                    description: TokenBudget granted to the run (output tokens; the
                      runner kill switch).
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              previousAttempt:
                description: |-
                  PreviousAttempt is the failed remediation this one retries (or the
                  one whose pull request was closed unmerged), rendered into the prompt
                  so the agent does not repeat the failure. Nil on a first attempt.
                properties:
                  attempt:
                    description: Attempt ordinal of the failed run.
                    format: int32
                    minimum: 1
                    type: integer
                  detail:
                    description: |-
                      Detail explains the outcome — for commit_failed, the git status
                      excerpt the runner found after commit.sh.
                    maxLength: 4096
                    type: string
                  name:
                    description: Name of the failed run (an Investigation or Remediation).
                    type: string
                  outcome:
                    description: |-
                      Outcome is the failed run's stage outcome (StageResult.Outcome), or
                      pull_request_closed when its pull request was closed unmerged.
                    maxLength: 64
                    type: string
                required:
                - attempt
                - name
                - outcome
                type: object
              priority:
                description: |-
                  Priority is the scheduling priority (0–100) computed from the
                  investigation results; the scheduler grants slots to the highest
                  pending priority first.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              repositoryRef:
                description: |-
                  RepositoryRef names the Repository artifact the agent works from (the
                  same SHA-pinned tree the investigation analysed).
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              revival:
                description: Revival marks a remediate-only run reviving a handed-off
                  finding.
                type: boolean
            required:
            - attempt
            - findingRef
            - investigationRef
            - priority
            - repositoryRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new Remediation for a new attempt
              rule: self == oldSelf
          status:
            description: |-
              RemediationStatus records the remediation results. Written only by
              remediation-controller.
            properties:
              branch:
                description: Branch carrying the pushed fix.
                type: string
              conditions:
                description: Conditions of the run (Complete, RolledUp*, AgentsPaused).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              confidence:
                description: Confidence decimal string in [0, 1].
                pattern: ^(0(\.[0-9]{1,4})?|1(\.0{1,4})?)$
                type: string
              grantedAt:
                description: GrantedAt is when the scheduler granted the run its slot.
                format: date-time
                type: string
              jobRef:
                description: JobRef locates the agent Job in the agents namespace.
                properties:
                  name:
                    description: Name of the Job.
                    type: string
                  namespace:
                    description: Namespace the Job runs in.
                    type: string
                  uid:
                    description: UID of the Job.
                    type: string
                required:
                - name
                - namespace
                type: object
              observedGeneration:
                description: ObservedGeneration is the last spec generation acted
                  on.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase of the run. Pending runs wait in the priority queue; the
                  scheduler's grant sets Running.
                enum:
                - Pending
                - Running
                - Complete
                - Failed
                type: string
              pullRequest:
                description: PullRequest opened for the fix.
                properties:
                  number:
                    description: Number of the pull request.
                    format: int64
                    type: integer
                  url:
                    description: URL of the pull request.
                    type: string
                required:
                - number
                type: object
              pushedCommit:
                description: PushedCommit is the SHA of the pushed commit.
                type: string
              report:
                description: Report is the full remediation report markdown.
                maxLength: 65536
                type: string
              reproduction:
                description: |-
                  Reproduction is the agent's own account of proving the bug with its
                  regression test before fixing it, from the report's reproduction
                  block. Self-reported: patchy runs no test itself. Nil when the report
                  had none (every report before the block existed), which reads as "not
                  reproduced".
                properties:
                  after:
                    description: After is a short excerpt of the test's output with
                      the fix applied.
                    maxLength: 2000
                    type: string
                  before:
                    description: Before is a short excerpt of the test's output on
                      the unfixed code.
                    maxLength: 2000
                    type: string
                  command:
                    description: Command ran the regression test.
                    maxLength: 500
                    type: string
                  reproduced:
                    description: |-
                      Reproduced reports that the test failed on the unfixed code for the
                      expected reason and passes with the fix.
                    type: boolean
                required:
                - reproduced
                type: object
              runnerImage:
                description: |-
                  RunnerImage is the image the Job actually launched on, written beside
                  JobRef from what the Job client returned; the changeset validator
                  applies its repository-image rules on this Source.
                properties:
                  image:
                    description: |-
                      Image is the image reference the agent container ran, as written into
                      the Job. With Source "repository" it is the digest-pinned reference
                      resolved onto the Repository's status. With Source "default" it is the
                      per-harness runner image exactly as the operator configured it, which
                      is digest-pinned only if that configuration pins it (a tag otherwise).
                    type: string
                  manifest:
                    description: |-
                      Manifest is the declaring file's repository-relative path, copied from
                      the Repository at launch when Source is "repository" so the tracking
                      issue and describe can name the file; empty otherwise.
                    type: string
                  networkProfile:
                    description: |-
                      NetworkProfile names the operator network profile the run's pod
                      carried (its dependency route through the egress proxy), read back
                      from the Job that exists; empty when the run had none.
                    maxLength: 32
                    pattern: ^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$
                    type: string
                  source:
                    description: |-
                      Source is RunnerImageSourceRepository when the image came from the
                      Repository's declaration and RunnerImageSourceDefault when the
                      per-harness runner image ran (nothing declared, a non-claude harness,
                      the kill switch).
                    enum:
                    - repository
                    - default
                    type: string
                required:
                - image
                - source
                type: object
              stage:
                description: Stage is the agent accounting for the run.
                properties:
                  detail:
                    description: Detail explains a non-ok outcome for humans.
                    maxLength: 4096
                    type: string
                  elapsedMilliseconds:
                    description: ElapsedMilliseconds is the stage's wall-clock duration.
                    format: int64
                    type: integer
                  finishedAt:
                    description: FinishedAt is when the stage ended.
                    format: date-time
                    type: string
                  harness:
                    description: Harness that executed the stage.
                    type: string
                  model:
                    description: Model the stage ran on.
                    type: string
                  numTurns:
                    description: NumTurns the agent took.
                    format: int32
                    type: integer
                  outcome:
                    description: |-
                      Outcome is the envelope outcome vocabulary (ok, runtime_error, timeout,
                      budget_exceeded, report_missing, report_invalid, commit_failed,
                      changeset_too_large, image_incompatible, changeset_rejected) plus
                      "aborted" for a run killed with no envelope. The pod never emits
                      changeset_rejected: the remediation collector sets it when a changeset
                      fails validation before any forge call.
                    type: string
                  sessionID:
                    description: SessionID of the harness session.
                    type: string
                  startedAt:
                    description: StartedAt is when the stage began.
                    format: date-time
                    type: string
                  transcript:
                    description: |-
                      Transcript points at the conversation this stage produced. The turns
                      themselves live in a ConfigMap owned by this run — far too large for a
                      status subresource — so what is recorded here is where to find them and
                      enough of a summary to render without fetching.
                    properties:
                      name:
                        description: Name of the ConfigMap holding the turns, in the
                          run's own namespace.
                        type: string
                      truncated:
                        description: |-
                          Truncated reports that recording bounds cut the conversation short, so
                          readers know the record is partial rather than complete.
                        type: boolean
                      turns:
                        description: Turns is how many the transcript holds.
                        format: int32
                        type: integer
                    required:
                    - name
                    type: object
                  usage:
                    description: Usage accounting for the stage.
                    properties:
                      cacheCreationTokens:
                        description: CacheCreationTokens written to prompt cache.
                        format: int64
                        type: integer
                      cacheReadTokens:
                        description: CacheReadTokens read from prompt cache.
                        format: int64
                        type: integer
                      costUSD:
                        description: |-
                          CostUSD is the harness-reported cost as a decimal string (structural
                          schemas forbid floats).
                        pattern: ^[0-9]+(\.[0-9]{1,6})?$
                        type: string
                      final:
                        description: |-
                          Final marks the usage settled: the controller has stopped waiting
                          for the broker and Source and Measured will not change.
                        type: boolean
                      inputTokens:
                        description: InputTokens consumed.
                        format: int64
                        type: integer
                      measured:
                        description: |-
                          Measured is the broker's metered usage of the run's pod, beside the
                          pod-reported counts above (which a pod could misreport). Present
                          when Source is measured or partial.
                        properties:
                          brokerBootTime:
                            description: |-
                              BrokerBootTime is when the broker's ledger began; Source is measured
                              only when it is before the run's Job was created.
                            format: date-time
                            type: string
                          cacheReadTokens:
                            description: CacheReadTokens observed.
                            format: int64
                            minimum: 0
                            type: integer
                          cacheWriteTokens:
                            description: |-
                              CacheWriteTokens observed: every prompt cache write, five-minute and
                              one-hour (Models has the split).
                            format: int64
                            minimum: 0
                            type: integer
                          costUSD:
                            description: |-
                              CostUSD prices the observed tokens: the sum of Models' costs, absent
                              when any model with observed tokens has no known price.
                            pattern: ^[0-9]+(\.[0-9]{1,6})?$
                            type: string
                          estimatedShortfallTokens:
                            description: |-
                              EstimatedShortfallTokens is the unmetered worst case: what the
                              broker charged its limits for cut or usage-less responses beyond what
                              it observed. Shown as unmetered, never priced, never part of a cost.
                            format: int64
                            minimum: 0
                            type: integer
                          inputTokens:
                            description: InputTokens observed.
                            format: int64
                            minimum: 0
                            type: integer
                          models:
                            description: Models is the usage per model.
                            items:
                              description: ModelUsage is a run's measured usage of
                                one model.
                              properties:
                                cacheReadTokens:
                                  description: CacheReadTokens observed.
                                  format: int64
                                  minimum: 0
                                  type: integer
                                cacheWrite1hTokens:
                                  description: 'CacheWrite1hTokens observed: one-hour
                                    prompt cache writes.'
                                  format: int64
                                  minimum: 0
                                  type: integer
                                cacheWrite5mTokens:
                                  description: 'CacheWrite5mTokens observed: five-minute
                                    prompt cache writes.'
                                  format: int64
                                  minimum: 0
                                  type: integer
                                costUSD:
                                  description: |-
                                    CostUSD prices the observed tokens at list rates; absent when the
                                    model has no known price (its tokens are kept).
                                  pattern: ^[0-9]+(\.[0-9]{1,6})?$
                                  type: string
                                credential:
                                  description: |-
                                    Credential is the kind of credential that paid: api-key,
                                    oauth-token (a Claude subscription) or cloud-identity.
                                  maxLength: 32
                                  type: string
                                estimatedShortfallTokens:
                                  description: EstimatedShortfallTokens is this model's
                                    unmetered worst case.
                                  format: int64
                                  minimum: 0
                                  type: integer
                                inputTokens:
                                  description: InputTokens observed.
                                  format: int64
                                  minimum: 0
                                  type: integer
                                model:
                                  description: |-
                                    Model is the registry's canonical id when the reported id resolves to
                                    one, else the id the broker reported (an unknown model).
                                  maxLength: 160
                                  minLength: 1
                                  type: string
                                outputTokens:
                                  description: OutputTokens observed.
                                  format: int64
                                  minimum: 0
                                  type: integer
                                priceTable:
                                  description: |-
                                    PriceTable is the price-table version CostUSD was priced at; set
                                    with CostUSD.
                                  maxLength: 32
                                  type: string
                                pricing:
                                  description: Pricing is list or subscription (notional);
                                    set with CostUSD.
                                  enum:
                                  - list
                                  - subscription
                                  type: string
                              required:
                              - model
                              type: object
                            maxItems: 16
                            type: array
                            x-kubernetes-list-type: atomic
                          outputTokens:
                            description: OutputTokens observed.
                            format: int64
                            minimum: 0
                            type: integer
                          priceTable:
                            description: PriceTable is the price-table version CostUSD
                              was priced at.
                            maxLength: 32
                            type: string
                          pricing:
                            description: |-
                              Pricing is subscription when any priced model's tokens were paid by
                              a subscription credential, else list.
                            enum:
                            - list
                            - subscription
                            type: string
                        type: object
                      outputTokens:
                        description: OutputTokens produced.
                        format: int64
                        type: integer
                      source:
                        description: |-
                          Source says which figure the run's usage is to be trusted as, once
                          Final: measured (the egress broker metered the whole pod), partial
                          (it metered only part of it: it restarted after the pod existed, or
                          requests were still in flight when the wait ended) or reported (no
                          broker figure: a non-brokered harness, or none was available; only
                          the pod-reported counts above exist). Set by the run's controller
                          under --usage-measurement; empty before or without it.
                        enum:
                        - measured
                        - partial
                        - reported
                        type: string
                    type: object
                required:
                - outcome
                type: object
              success:
                description: Success reports whether the agent produced a fix.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}