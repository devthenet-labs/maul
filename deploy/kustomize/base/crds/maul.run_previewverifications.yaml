---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: previewverifications.maul.run
spec:
  group: maul.run
  names:
    categories:
    - maul
    kind: PreviewVerification
    listKind: PreviewVerificationList
    plural: previewverifications
    shortNames:
    - pver
    singular: previewverification
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.intentRef.name
      name: Intent
      type: string
    - jsonPath: .spec.round
      name: Round
      type: integer
    - jsonPath: .spec.attempt
      name: Attempt
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PreviewVerification is one attempt to run an Intent's automatable
          acceptance criteria against its Preview, inside the Preview's slot. It
          lives in the release namespace, owned by its Intent (controller
          reference), named <intent>-v<round>-a<attempt>. intent-controller creates
          and deletes it and judges its observations; preview-controller runs the
          tester and writes its status. Its name is written into label values, so
          the schema refuses one over 63 characters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PreviewVerificationSpec is one request to run an Intent's automatable
              acceptance criteria (slice 1's tester), or to evaluate its approved
              outcomes (the evaluator), against its Preview at exactly the recorded
              heads: exactly one of criteria and outcomes, each with its digest; an
              outcome verification also names its rung and its tool pod's tools.
              intent-controller writes it once, at creation, and it is immutable: a new
              attempt or round is a new PreviewVerification. preview-controller re-checks
              every field against the Intent and the Preview before it renders anything.
            properties:
              attempt:
                description: |-
                  Attempt within the round, 1-based; only an infrastructure failure
                  starts another (MaxVerificationAttempts).
                format: int32
                maximum: 3
                minimum: 1
                type: integer
              checks:
                description: |-
                  Checks are the Intent's saved checks, copied inline from its check
                  store (status.acceptance.checks), which preview-controller copies
                  into the slot tool pod's ConfigMap: it never reads the store, so it
                  needs no read of the release namespace's ConfigMaps (SPEC Q1). Empty
                  on a first round, before any check is saved.
                items:
                  description: |-
                    SavedCheck is one confirmed, reviewed check of an approved outcome: its
                    canonical JSON (internal/checks.Canonical) and digest. The body is the
                    agent's, validated by internal/checks before it was ever run, and is
                    untrusted text: it is shown only as quoted data.
                  properties:
                    body:
                      description: Body is the check's canonical JSON, at most MaxSavedCheckBytes
                        bytes.
                      maxLength: 8192
                      minLength: 1
                      type: string
                    digest:
                      description: |-
                        Digest is internal/checks.Digest of the body: what every dry run,
                        confirmation, replay and review is recorded against.
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    expect:
                      description: |-
                        Expect is fail for a check saved to show a defect: proposed for a fail
                        verdict, its dry run and its confirmation red by assertion, reviewed
                        with the red question. It is the check of the outcome as approved all
                        the same, so it passes once the defect is fixed. Unset for a check
                        saved green.
                      enum:
                      - fail
                      type: string
                    form:
                      description: Form is how the check runs.
                      enum:
                      - http
                      - browser
                      - exec
                      type: string
                    id:
                      description: 'ID names the check: its outcome''s id with an
                        optional .<name>.'
                      pattern: ^[a-z][a-z0-9-]{0,31}(\.[a-z0-9][a-z0-9-]{0,31})?$
                      type: string
                    outcome:
                      description: Outcome is the id of the outcome the check is bound
                        to.
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                  required:
                  - body
                  - digest
                  - form
                  - id
                  - outcome
                  type: object
                  x-kubernetes-validations:
                  - message: a saved check's body is at most 8 KiB (MaxSavedCheckBytes)
                    rule: size(bytes(self.body)) <= 8192
                maxItems: 40
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              checksDigest:
                description: |-
                  ChecksDigest is the check store's digest
                  (status.acceptance.checks.digest). Set with Checks, and only with it.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              criteria:
                description: |-
                  Criteria are the automatable criteria of the Intent's approved
                  acceptance list, in plan order (slice 1's tester).
                items:
                  description: AcceptanceCriterion is one acceptance criterion of
                    an approved plan.
                  properties:
                    argv:
                      description: Argv is a command criterion's argument vector,
                        run without a shell.
                      items:
                        maxLength: 200
                        type: string
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    expect:
                      description: Expect is what a command criterion's run must show.
                      properties:
                        bodyContains:
                          description: BodyContains is a string the response body
                            must contain.
                          maxLength: 200
                          type: string
                        exit:
                          description: Exit is a command's expected exit code.
                          format: int32
                          type: integer
                        headers:
                          additionalProperties:
                            x-kubernetes-preserve-unknown-fields: true
                          description: Headers maps response header names to what
                            each must hold.
                          maxProperties: 4
                          type: object
                        json:
                          additionalProperties:
                            x-kubernetes-preserve-unknown-fields: true
                          description: |-
                            JSON maps RFC 6901 pointers into the response body to what each must
                            hold.
                          maxProperties: 8
                          type: object
                        status:
                          description: 'Status is the expected HTTP status: one code
                            or a list of codes.'
                          x-kubernetes-preserve-unknown-fields: true
                        stdoutContains:
                          description: StdoutContains is a string a command's stdout
                            must contain.
                          maxLength: 200
                          type: string
                        stdoutJSON:
                          additionalProperties:
                            x-kubernetes-preserve-unknown-fields: true
                          description: |-
                            StdoutJSON maps RFC 6901 pointers into a command's JSON stdout to what
                            each must hold.
                          maxProperties: 8
                          type: object
                      type: object
                    id:
                      description: ID names the criterion, unique within its plan.
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                    in:
                      description: In is where a command criterion runs.
                      properties:
                        component:
                          description: |-
                            Component is a previewed repository key: the command runs in that
                            component's runtime image inside the slot.
                          maxLength: 16
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        repository:
                          description: |-
                            Repository is a Project repository key: the command runs in that
                            repository's accepted agent image, without a model.
                          maxLength: 16
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: in names exactly one of component and repository
                        rule: has(self.component) != has(self.repository)
                    kind:
                      description: Kind is how the criterion is checked.
                      enum:
                      - http
                      - command
                      - manual
                      type: string
                    reason:
                      description: Reason says why a manual criterion needs a human.
                      maxLength: 120
                      pattern: ^[^\r\n]*$
                      type: string
                    statement:
                      description: Statement is the approved one-line statement of
                        what must hold.
                      maxLength: 200
                      minLength: 1
                      pattern: ^[^\r\n]*$
                      type: string
                    steps:
                      description: |-
                        Steps are an http criterion's requests, in order (the shorthand of a
                        bare request and expect is normalised into one step).
                      items:
                        description: |-
                          AcceptanceStep is one request of an http criterion and what its response
                          must show.
                        properties:
                          capture:
                            additionalProperties:
                              type: string
                            description: |-
                              Capture names values of the response (RFC 6901 pointers into its JSON
                              body) that later steps reference by name (the capture placeholder).
                            maxProperties: 4
                            type: object
                            x-kubernetes-validations:
                            - message: capture names are ^[a-z][a-z0-9]{0,15}$ and
                                their pointers at most 256 characters
                              rule: self.all(k, k.matches('^[a-z][a-z0-9]{0,15}$')
                                && size(self[k]) <= 256)
                          expect:
                            description: Expect is what the response must show.
                            properties:
                              bodyContains:
                                description: BodyContains is a string the response
                                  body must contain.
                                maxLength: 200
                                type: string
                              exit:
                                description: Exit is a command's expected exit code.
                                format: int32
                                type: integer
                              headers:
                                additionalProperties:
                                  x-kubernetes-preserve-unknown-fields: true
                                description: Headers maps response header names to
                                  what each must hold.
                                maxProperties: 4
                                type: object
                              json:
                                additionalProperties:
                                  x-kubernetes-preserve-unknown-fields: true
                                description: |-
                                  JSON maps RFC 6901 pointers into the response body to what each must
                                  hold.
                                maxProperties: 8
                                type: object
                              status:
                                description: 'Status is the expected HTTP status:
                                  one code or a list of codes.'
                                x-kubernetes-preserve-unknown-fields: true
                              stdoutContains:
                                description: StdoutContains is a string a command's
                                  stdout must contain.
                                maxLength: 200
                                type: string
                              stdoutJSON:
                                additionalProperties:
                                  x-kubernetes-preserve-unknown-fields: true
                                description: |-
                                  StdoutJSON maps RFC 6901 pointers into a command's JSON stdout to what
                                  each must hold.
                                maxProperties: 8
                                type: object
                            type: object
                          name:
                            description: Name labels the step for display.
                            maxLength: 32
                            pattern: ^[a-z][a-z0-9-]*$
                            type: string
                          request:
                            description: Request is what the tester sends.
                            properties:
                              body:
                                description: Body is a literal request body.
                                maxLength: 2048
                                type: string
                              headers:
                                additionalProperties:
                                  type: string
                                description: Headers sent with the request.
                                maxProperties: 8
                                type: object
                                x-kubernetes-validations:
                                - message: header names are ^[A-Za-z0-9-]{1,64}$ and
                                    their values at most 256 characters
                                  rule: self.all(k, k.matches('^[A-Za-z0-9-]{1,64}$')
                                    && size(self[k]) <= 256)
                              json:
                                description: JSON is a JSON request body.
                                x-kubernetes-preserve-unknown-fields: true
                              method:
                                description: Method of the request.
                                enum:
                                - GET
                                - HEAD
                                - POST
                                - PUT
                                - PATCH
                                - DELETE
                                type: string
                              path:
                                description: Path, with its query, starting with exactly
                                  one slash.
                                maxLength: 512
                                minLength: 1
                                pattern: ^/([^/].*)?$
                                type: string
                            required:
                            - method
                            - path
                            type: object
                        required:
                        - request
                        type: object
                      maxItems: 8
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    target:
                      description: Target is the previewed repository key an http
                        criterion is sent to.
                      maxLength: 16
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    timeout:
                      description: Timeout bounds a command criterion's run (a Go
                        duration, at most 10m).
                      maxLength: 16
                      type: string
                  required:
                  - id
                  - kind
                  - statement
                  type: object
                  x-kubernetes-validations:
                  - message: an http criterion names its target and its steps
                    rule: self.kind != 'http' || (has(self.target) && has(self.steps))
                  - message: a command criterion names where it runs (in) and its
                      argv
                    rule: self.kind != 'command' || (has(self.__in__) && has(self.argv))
                  - message: 'a manual criterion is checked by a human: no steps and
                      no argv'
                    rule: self.kind != 'manual' || (!has(self.steps) && !has(self.argv))
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              criteriaDigest:
                description: |-
                  CriteriaDigest is the digest of the Intent's full approved list
                  (status.acceptance.digest), of which Criteria is the automatable
                  subset. Set with Criteria, and only with it.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              headSetDigest:
                description: |-
                  HeadSetDigest is the sha256 over the sorted (repository, revision)
                  pairs of every Preview component: the combined change verified.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              heads:
                description: Heads are the Preview spec's components and their revisions.
                items:
                  description: |-
                    VerificationHead is one previewed component's revision in the combined
                    change a verification ran against: what the Preview spec runs.
                  properties:
                    component:
                      description: Component is the previewed repository key.
                      maxLength: 16
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    repository:
                      description: Repository is the repository's https URL.
                      maxLength: 256
                      minLength: 1
                      pattern: ^https://[^/\s@?#]+/[^/\s?#]+/[^/\s?#]+$
                      type: string
                    revision:
                      description: Revision is the full commit SHA the component runs.
                      pattern: ^[0-9a-f]{40}$
                      type: string
                  required:
                  - component
                  - repository
                  - revision
                  type: object
                maxItems: 4
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - component
                x-kubernetes-list-type: map
              intentRef:
                description: IntentRef is the Intent that owns the verification, pinned
                  by UID.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              outcomes:
                description: |-
                  Outcomes are the Intent's approved outcomes (status.acceptance.outcomes),
                  in plan order, manual ones included: the evaluator judges them.
                items:
                  description: |-
                    AcceptanceOutcome is one outcome of an approved plan: a statement of what
                    must hold, the issue line it answers, and whether a human checks it.
                  properties:
                    from:
                      description: From quotes the issue line the outcome answers.
                      maxLength: 300
                      pattern: ^[^\r\n]*$
                      type: string
                    id:
                      description: ID names the outcome, unique within its plan.
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                    kind:
                      description: Kind is change or keep; unset is change.
                      enum:
                      - change
                      - keep
                      type: string
                    manual:
                      description: Manual marks an outcome only a human can check
                        (/maul accept).
                      type: boolean
                    outcome:
                      description: Outcome is the approved one-line statement of what
                        must hold.
                      maxLength: 500
                      minLength: 1
                      pattern: ^[^\r\n]*$
                      type: string
                    reason:
                      description: Reason says why a manual outcome needs a human.
                      maxLength: 120
                      pattern: ^[^\r\n]*$
                      type: string
                  required:
                  - id
                  - outcome
                  type: object
                maxItems: 20
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              outcomesDigest:
                description: |-
                  OutcomesDigest is the Intent's status.acceptance.outcomesDigest. Set
                  with Outcomes, and only with it.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              previewGeneration:
                description: PreviewGeneration is the Preview generation the heads
                  were read at.
                format: int64
                minimum: 1
                type: integer
              previewRef:
                description: PreviewRef is the Intent's Preview, pinned by UID.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              round:
                description: Round is the verification round, 1-based.
                format: int32
                maximum: 999
                minimum: 1
                type: integer
              run:
                description: |-
                  Run is the random token every run placeholder of this attempt carries:
                  v<round>a<attempt>t<try>-<run>.
                pattern: ^[0-9a-f]{6}$
                type: string
              rung:
                description: |-
                  Rung is how much of an evaluation the round runs. Set on an outcome
                  verification, and only on one.
                enum:
                - full
                - replay
                type: string
              timeout:
                description: Timeout is the tester Job's, or the tool pod's, wall
                  clock.
                type: string
              tools:
                description: |-
                  Tools is what the slot tool pod offers. Set on an outcome
                  verification, and only on one.
                properties:
                  browser:
                    description: Browser runs the browser sidecar.
                    type: boolean
                  lookAroundRoutes:
                    description: |-
                      LookAroundRoutes bounds the routes the look-around visits; zero
                      skips it.
                    format: int32
                    maximum: 8
                    minimum: 0
                    type: integer
                  maxToolCalls:
                    description: |-
                      MaxToolCalls bounds the evaluator's tool calls; a call past it is
                      refused, and the refusal is a ledger entry.
                    format: int32
                    maximum: 300
                    minimum: 50
                    type: integer
                  sandbox:
                    description: |-
                      Sandbox runs the sandbox sidecar (exec checks and agent-written
                      clients).
                    type: boolean
                required:
                - maxToolCalls
                type: object
            required:
            - attempt
            - headSetDigest
            - heads
            - intentRef
            - previewGeneration
            - previewRef
            - round
            - run
            - timeout
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new PreviewVerification for a new
                attempt
              rule: self == oldSelf
            - message: a verification runs exactly one of criteria and outcomes
              rule: has(self.criteria) != has(self.outcomes)
            - message: criteria and criteriaDigest are set together
              rule: has(self.criteria) == has(self.criteriaDigest)
            - message: outcomes and outcomesDigest are set together
              rule: has(self.outcomes) == has(self.outcomesDigest)
            - message: an outcome verification, and only one, names its rung and its
                tools
              rule: has(self.outcomes) == has(self.rung) && has(self.outcomes) ==
                has(self.tools)
            - message: saved checks belong to an outcome verification
              rule: '!has(self.checks) || has(self.outcomes)'
            - message: checks and checksDigest are set together
              rule: has(self.checks) == has(self.checksDigest)
            - message: 'a replay round replays saved checks: it needs at least one'
              rule: '!has(self.rung) || self.rung != ''replay'' || has(self.checks)'
            - message: spec.intentRef.uid is required
              rule: has(self.intentRef.uid) && size(self.intentRef.uid) > 0
            - message: spec.previewRef.uid is required
              rule: has(self.previewRef.uid) && size(self.previewRef.uid) > 0
            - message: spec.timeout must be between 1m and 1h
              rule: duration(self.timeout) >= duration('1m') && duration(self.timeout)
                <= duration('1h')
          status:
            description: |-
              PreviewVerificationStatus is written only by preview-controller: what the
              tester and the kubelet observed, never a verdict.
            properties:
              capture:
                description: |-
                  Capture summarises the component log tails and slot events captured
                  for the evaluator.
                properties:
                  components:
                    description: Components are the per-component log tails.
                    items:
                      description: ComponentCapture is one component's captured log
                        tail.
                      properties:
                        bytes:
                          description: Bytes held, at most 64 KiB.
                          format: int32
                          maximum: 65536
                          minimum: 0
                          type: integer
                        name:
                          description: Name of the part.
                          maxLength: 20
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        truncated:
                          description: Truncated reports that older output was dropped
                            to keep the newest.
                          type: boolean
                      required:
                      - bytes
                      - name
                      type: object
                    maxItems: 12
                    type: array
                    x-kubernetes-list-type: atomic
                  events:
                    description: Events counts the slot events and container states
                      captured.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                type: object
              completedAt:
                description: CompletedAt is when the attempt settled.
                format: date-time
                type: string
              confirmations:
                description: |-
                  Confirmations is each proposed check's confirmation run, alone with
                  a fresh run token, after the evaluator finished.
                items:
                  description: CheckRun is one run of one check, as the ledger recorded
                    it.
                  properties:
                    assertionStep:
                      description: |-
                        AssertionStep is, for a failed run red by assertion, the step (1-based)
                        at which both attempts failed, an assertion of a check that otherwise
                        ran (toolwire.CheckRunRecord.AssertionStep): never a check error, a
                        timeout or a locator that resolved to nothing. Unset otherwise.
                      format: int32
                      maximum: 64
                      minimum: 1
                      type: integer
                    checkDigest:
                      description: CheckDigest is the check's digest.
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    dryRunSeq:
                      description: |-
                        DryRunSeq is the ledger entry of the dry run a confirmation required:
                        green, or, for a check expected to fail (Expect), red by assertion;
                        unset on a replay.
                      format: int32
                      maximum: 512
                      minimum: 1
                      type: integer
                    expect:
                      description: |-
                        Expect is fail for a confirmation of a check the evaluator proposed
                        to show a defect.
                      enum:
                      - fail
                      type: string
                    result:
                      description: Result of the run.
                      enum:
                      - pass
                      - fail
                      - quarantined
                      - error
                      - refused
                      type: string
                    seq:
                      description: Seq is the ledger entry of the run.
                      format: int32
                      maximum: 512
                      minimum: 1
                      type: integer
                    token:
                      description: |-
                        Token is the fresh run token the run substituted for the check's
                        run placeholder.
                      maxLength: 40
                      minLength: 1
                      pattern: ^[A-Za-z0-9-]+$
                      type: string
                  required:
                  - checkDigest
                  - result
                  - seq
                  - token
                  type: object
                maxItems: 40
                type: array
                x-kubernetes-list-type: atomic
              confirmed:
                description: |-
                  Confirmed are the proposed checks that passed their confirmation,
                  their bodies read from the verified ledger (never from the
                  evaluator's report): what intent-controller may store once reviewed.
                items:
                  description: |-
                    SavedCheck is one confirmed, reviewed check of an approved outcome: its
                    canonical JSON (internal/checks.Canonical) and digest. The body is the
                    agent's, validated by internal/checks before it was ever run, and is
                    untrusted text: it is shown only as quoted data.
                  properties:
                    body:
                      description: Body is the check's canonical JSON, at most MaxSavedCheckBytes
                        bytes.
                      maxLength: 8192
                      minLength: 1
                      type: string
                    digest:
                      description: |-
                        Digest is internal/checks.Digest of the body: what every dry run,
                        confirmation, replay and review is recorded against.
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    expect:
                      description: |-
                        Expect is fail for a check saved to show a defect: proposed for a fail
                        verdict, its dry run and its confirmation red by assertion, reviewed
                        with the red question. It is the check of the outcome as approved all
                        the same, so it passes once the defect is fixed. Unset for a check
                        saved green.
                      enum:
                      - fail
                      type: string
                    form:
                      description: Form is how the check runs.
                      enum:
                      - http
                      - browser
                      - exec
                      type: string
                    id:
                      description: 'ID names the check: its outcome''s id with an
                        optional .<name>.'
                      pattern: ^[a-z][a-z0-9-]{0,31}(\.[a-z0-9][a-z0-9-]{0,31})?$
                      type: string
                    outcome:
                      description: Outcome is the id of the outcome the check is bound
                        to.
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                  required:
                  - body
                  - digest
                  - form
