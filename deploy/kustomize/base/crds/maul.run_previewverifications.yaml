---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: previewverifications.maul.run
spec:
  group: maul.run
  names:
    categories:
    - maul
    kind: PreviewVerification
    listKind: PreviewVerificationList
    plural: previewverifications
    shortNames:
    - pver
    singular: previewverification
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.intentRef.name
      name: Intent
      type: string
    - jsonPath: .spec.round
      name: Round
      type: integer
    - jsonPath: .spec.attempt
      name: Attempt
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PreviewVerification is one attempt to evaluate an Intent's approved
          outcomes, against its Preview inside the Preview's slot or, for a Project
          with no preview, in the agents namespace. It lives in the release
          namespace, owned by its Intent (controller reference), named
          <intent>-v<round>-a<attempt>. intent-controller creates and deletes it
          and decides what its ledger shows; preview-controller (or, for an agents
          verification, intent-controller's agents host) runs the tool pod and
          writes its status. Its name is written into label values, so
          the schema refuses one over 63 characters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PreviewVerificationSpec is one request to evaluate an Intent's approved
              outcomes (the agent evaluator) against its Preview, or in the agents
              namespace's workspace, at exactly the recorded heads: the outcomes with
              their digest, the rung and the tool pod's tools. Slice 1's criteria are
              removed: a request without outcomes is refused (a stored one, pruned of
              its criteria, is answered Stale stale-approval and never run).
              intent-controller writes it once, at creation, and it is immutable: a new
              attempt or round is a new PreviewVerification. preview-controller re-checks
              every field against the Intent and the Preview before it renders anything.
            properties:
              attempt:
                description: |-
                  Attempt within the round, 1-based; only an infrastructure failure
                  starts another (MaxVerificationAttempts).
                format: int32
                maximum: 3
                minimum: 1
                type: integer
              checks:
                description: |-
                  Checks are the Intent's saved checks, copied inline from its check
                  store (status.acceptance.checks), which preview-controller copies
                  into the slot tool pod's ConfigMap: it never reads the store, so it
                  needs no read of the release namespace's ConfigMaps (SPEC Q1). Empty
                  on a first round, before any check is saved.
                items:
                  description: |-
                    SavedCheck is one confirmed, reviewed check of an approved outcome: its
                    canonical JSON (internal/checks.Canonical) and digest. The body is the
                    agent's, validated by internal/checks before it was ever run, and is
                    untrusted text: it is shown only as quoted data.
                  properties:
                    body:
                      description: Body is the check's canonical JSON, at most MaxSavedCheckBytes
                        bytes.
                      maxLength: 8192
                      minLength: 1
                      type: string
                    digest:
                      description: |-
                        Digest is internal/checks.Digest of the body: what every dry run,
                        confirmation, replay and review is recorded against.
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    expect:
                      description: |-
                        Expect is fail for a check saved to show a defect: proposed for a fail
                        verdict, its dry run and its confirmation red by assertion, reviewed
                        with the red question. It is the check of the outcome as approved all
                        the same, so it passes once the defect is fixed. Unset for a check
                        saved green.
                      enum:
                      - fail
                      type: string
                    failedAssertion:
                      description: |-
                        FailedAssertion is, for a check saved red, which assertion of
                        FailedStep failed (CheckRun.AssertionID). Until the check replays green
                        once, only a run red by this same assertion reproduces its defect.
                      maxLength: 512
                      type: string
                    failedStep:
                      description: |-
                        FailedStep is, for a check saved red, the step (1-based) at which its
                        confirmation failed by assertion.
                      format: int32
                      maximum: 64
                      minimum: 1
                      type: integer
                    form:
                      description: Form is how the check runs.
                      enum:
                      - http
                      - browser
                      - exec
                      - run
                      type: string
                    id:
                      description: 'ID names the check: its outcome''s id with an
                        optional .<name>.'
                      pattern: ^[a-z][a-z0-9-]{0,31}(\.[a-z0-9][a-z0-9-]{0,31})?$
                      type: string
                    outcome:
                      description: Outcome is the id of the outcome the check is bound
                        to.
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                  required:
                  - body
                  - digest
                  - form
                  - id
                  - outcome
                  type: object
                  x-kubernetes-validations:
                  - message: a saved check's body is at most 8 KiB (MaxSavedCheckBytes)
                    rule: size(bytes(self.body)) <= 8192
                maxItems: 40
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              checksDigest:
                description: |-
                  ChecksDigest is the check store's digest
                  (status.acceptance.checks.digest). Set with Checks, and only with it.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              headSetDigest:
                description: |-
                  HeadSetDigest is the sha256 over the sorted (repository, revision)
                  pairs of every Preview component: the combined change verified.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              heads:
                description: |-
                  Heads are the Preview spec's components and their revisions; on an
                  agents verification, the PR heads, the workspace's repository among
                  them at its headSHA.
                items:
                  description: |-
                    VerificationHead is one previewed component's revision in the combined
                    change a verification ran against: what the Preview spec runs.
                  properties:
                    component:
                      description: Component is the previewed repository key.
                      maxLength: 16
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    repository:
                      description: Repository is the repository's https URL.
                      maxLength: 256
                      minLength: 1
                      pattern: ^https://[^/\s@?#]+/[^/\s?#]+/[^/\s?#]+$
                      type: string
                    revision:
                      description: Revision is the full commit SHA the component runs.
                      pattern: ^[0-9a-f]{40}$
                      type: string
                  required:
                  - component
                  - repository
                  - revision
                  type: object
                maxItems: 4
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - component
                x-kubernetes-list-type: map
              intentRef:
                description: IntentRef is the Intent that owns the verification, pinned
                  by UID.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              outcomes:
                description: |-
                  Outcomes are the Intent's approved outcomes (status.acceptance.outcomes),
                  in plan order, manual ones included: the evaluator judges them.
                items:
                  description: |-
                    AcceptanceOutcome is one outcome of an approved plan: a statement of what
                    must hold, the issue line it answers, and whether a human checks it.
                  properties:
                    from:
                      description: From quotes the issue line the outcome answers.
                      maxLength: 300
                      pattern: ^[^\r\n]*$
                      type: string
                    id:
                      description: ID names the outcome, unique within its plan.
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                    kind:
                      description: Kind is change or keep; unset is change.
                      enum:
                      - change
                      - keep
                      type: string
                    manual:
                      description: Manual marks an outcome only a human can check
                        (/maul accept).
                      type: boolean
                    outcome:
                      description: Outcome is the approved one-line statement of what
                        must hold.
                      maxLength: 500
                      minLength: 1
                      pattern: ^[^\r\n]*$
                      type: string
                    reason:
                      description: Reason says why a manual outcome needs a human.
                      maxLength: 120
                      pattern: ^[^\r\n]*$
                      type: string
                  required:
                  - id
                  - outcome
                  type: object
                maxItems: 20
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              outcomesDigest:
                description: |-
                  OutcomesDigest is the Intent's status.acceptance.outcomesDigest. Set
                  with Outcomes, and only with it.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              placement:
                description: |-
                  Placement is where the tool pod runs (VerificationPlacement); unset
                  is slot. Immutable with the spec.
                enum:
                - slot
                - agents
                type: string
              previewGeneration:
                description: |-
                  PreviewGeneration is the Preview generation the heads were read at:
                  at least 1 on a slot verification, unset on an agents one.
                format: int64
                type: integer
              previewRef:
                description: |-
                  PreviewRef is the Intent's Preview, pinned by UID. Required on a slot
                  verification, unset on an agents one.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              round:
                description: Round is the verification round, 1-based.
                format: int32
                maximum: 999
                minimum: 1
                type: integer
              run:
                description: |-
                  Run is the random token every run placeholder of this attempt carries:
                  v<round>a<attempt>t<try>-<run>.
                pattern: ^[0-9a-f]{6}$
                type: string
              rung:
                description: |-
                  Rung is how much of an evaluation the round runs. Set on an outcome
                  verification, and only on one.
                enum:
                - full
                - replay
                type: string
              timeout:
                description: Timeout is the tool pod's wall clock.
                type: string
              tools:
                description: |-
                  Tools is what the slot tool pod offers. Set on an outcome
                  verification, and only on one.
                properties:
                  browser:
                    description: Browser runs the browser sidecar.
                    type: boolean
                  lookAroundRoutes:
                    description: |-
                      LookAroundRoutes bounds the routes the look-around visits; zero
                      skips it.
                    format: int32
                    maximum: 8
                    minimum: 0
                    type: integer
                  maxToolCalls:
                    description: |-
                      MaxToolCalls bounds the evaluator's tool calls; a call past it is
                      refused, and the refusal is a ledger entry.
                    format: int32
                    maximum: 300
                    minimum: 50
                    type: integer
                  sandbox:
                    description: |-
                      Sandbox runs the sandbox sidecar (exec checks and agent-written
                      clients).
                    type: boolean
                required:
                - maxToolCalls
                type: object
              workspace:
                description: |-
                  Workspace is what an agents verification builds and runs: one
                  repository's head and base trees in its accepted runner image. Set
                  on an agents verification, and only on one.
                properties:
                  baseRepositoryRef:
                    description: BaseRepositoryRef is the Repository pinned to BaseSHA,
                      by UID.
                    properties:
                      name:
                        description: Name of the referent.
                        minLength: 1
                        type: string
                      uid:
                        description: UID of the referent at the time the reference
                          was written.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: the base repository's uid is required
                      rule: has(self.uid) && size(self.uid) > 0
                  baseSHA:
                    description: BaseSHA is the merge base of the head and the PR's
                      base branch.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  headRepositoryRef:
                    description: HeadRepositoryRef is the Repository pinned to HeadSHA,
                      by UID.
                    properties:
                      name:
                        description: Name of the referent.
                        minLength: 1
                        type: string
                      uid:
                        description: UID of the referent at the time the reference
                          was written.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: the head repository's uid is required
                      rule: has(self.uid) && size(self.uid) > 0
                  headSHA:
                    description: HeadSHA is the PR head commit.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  networkProfile:
                    description: |-
                      NetworkProfile is the operator network profile the repository's
                      build gets; unset means none. The tool pod's network is never wider.
                    pattern: ^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$
                    type: string
                  repository:
                    description: Repository is the Project repository's key.
                    maxLength: 16
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  sandboxImage:
                    description: |-
                      SandboxImage is the repository's accepted runner image, by digest:
                      both sandboxes run it.
                    maxLength: 512
                    pattern: ^[a-z0-9][^@\s]*@sha256:[0-9a-f]{64}$
                    type: string
                  sandboxSearchPath:
                    description: |-
                      SandboxSearchPath is that image's sanitized PATH (its RunnerImage's
                      searchPath): absolute entries only.
                    maxLength: 4096
                    minLength: 1
                    pattern: ^/[^:\x00-\x1f]*(:/[^:\x00-\x1f]*)*$
                    type: string
                  surface:
                    description: 'Surface is what the tool pod builds: a cli or a
                      library.'
                    properties:
                      cli:
                        description: CLI builds a binary from the tree.
                        properties:
                          binary:
                            description: Binary is the built binary (CLISurface.Binary).
                            maxLength: 139
                            pattern: ^/work/bin(/[A-Za-z0-9_][A-Za-z0-9._-]{0,63}){1,2}$
                            type: string
                          build:
                            description: Build is the build argv (CLISurface.Build).
                            items:
                              maxLength: 256
                              minLength: 1
                              pattern: ^[^\x00-\x1f\x7f]+$
                              type: string
                            maxItems: 16
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                            x-kubernetes-validations:
                            - message: the build must write under /work/bin
                              rule: self.exists(a, a.contains('/work/bin/') || a.endsWith('/work/bin'))
                          buildTimeout:
                            description: BuildTimeout bounds each tree's build, between
                              1m and 20m.
                            type: string
                            x-kubernetes-validations:
                            - message: buildTimeout must be between 1m and 20m
                              rule: duration(self) >= duration('1m') && duration(self)
                                <= duration('20m')
                        required:
                        - binary
                        - build
                        - buildTimeout
                        type: object
                      library:
                        description: Library runs consumer programs against the tree.
                        properties:
                          language:
                            description: Language of the library.
                            enum:
                            - go
                            type: string
                        required:
                        - language
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: a workspace surface is exactly one of cli and library
                      rule: has(self.cli) != has(self.library)
                required:
                - baseRepositoryRef
                - baseSHA
                - headRepositoryRef
                - headSHA
                - repository
                - sandboxImage
                - sandboxSearchPath
                - surface
                type: object
            required:
            - attempt
            - headSetDigest
            - heads
            - intentRef
            - round
            - run
            - timeout
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new PreviewVerification for a new
                attempt
              rule: self == oldSelf
            - message: 'a verification evaluates outcomes: slice 1''s criteria are
                removed'
              rule: has(self.outcomes)
            - message: outcomes and outcomesDigest are set together
              rule: has(self.outcomes) == has(self.outcomesDigest)
            - message: an outcome verification, and only one, names its rung and its
                tools
              rule: has(self.outcomes) == has(self.rung) && has(self.outcomes) ==
                has(self.tools)
            - message: saved checks belong to an outcome verification
              rule: '!has(self.checks) || has(self.outcomes)'
            - message: checks and checksDigest are set together
              rule: has(self.checks) == has(self.checksDigest)
            - message: 'a replay round replays saved checks: it needs at least one'
              rule: '!has(self.rung) || self.rung != ''replay'' || has(self.checks)'
            - message: spec.intentRef.uid is required
              rule: has(self.intentRef.uid) && size(self.intentRef.uid) > 0
            - message: spec.previewRef.uid is required
              rule: (has(self.placement) && self.placement == 'agents') || (has(self.previewRef)
                && has(self.previewRef.uid) && size(self.previewRef.uid) > 0)
            - message: spec.previewGeneration must be at least 1 on a slot verification
              rule: (has(self.placement) && self.placement == 'agents') || (has(self.previewGeneration)
                && self.previewGeneration >= 1)
            - message: spec.timeout must be between 1m and 1h (75m on an agents verification)
              rule: 'duration(self.timeout) >= duration(''1m'') && duration(self.timeout)
                <= ((has(self.placement) && self.placement == ''agents'') ? duration(''75m'')
                : duration(''1h''))'
            - message: an agents verification, and only one, names its workspace
              rule: has(self.workspace) == (has(self.placement) && self.placement
                == 'agents')
            - message: 'an agents verification has no Preview: previewRef and previewGeneration
                are unset'
              rule: '!has(self.placement) || self.placement != ''agents'' || (!has(self.previewRef)
                && !has(self.previewGeneration))'
            - message: 'an agents verification''s workspace builds one of its heads:
                spec.heads names spec.workspace.repository at spec.workspace.headSHA'
              rule: '!has(self.workspace) || self.heads.exists(h, h.component == self.workspace.repository
                && h.revision == self.workspace.headSHA)'
            - message: an agents verification evaluates outcomes with no browser and
                no look-around
              rule: '!has(self.placement) || self.placement != ''agents'' || (has(self.outcomes)
                && has(self.tools) && !(has(self.tools.browser) && self.tools.browser)
                && (!has(self.tools.lookAroundRoutes) || self.tools.lookAroundRoutes
                == 0))'
          status:
            description: |-
              PreviewVerificationStatus is written only by preview-controller (and, for
              an agents verification, by intent-controller's agents host): what the
              tool pod and the kubelet observed, never a verdict.
            properties:
              base:
                description: |-
                  Base is an agents verification's base side: whether its outcomes need
                  a base comparison, whether the base tree built, and each check's run
                  at base. Unset on a slot verification.
                properties:
                  required:
                    description: |-
                      Required reports that a change outcome's check must fail by assertion
                      at base.
                    type: boolean
                  runs:
                    description: |-
                      Runs are the checks' runs at base, each with a fresh run token
                      (CheckRun.tree base). Each names the base tree explicitly: an unset
                      tree reads as head (CheckRun.Side), so a base run without it would
                      stand for a head run.
                    items:
                      description: CheckRun is one run of one check, as the ledger
                        recorded it.
                      properties:
                        assertionID:
                          description: |-
                            AssertionID names which assertion of that step failed
                            (toolwire.StepRecord.AssertionID): "json <pointer>", "header <name>",
                            "bodyContains", "marker <id>" or "expect". Set with AssertionStep.
                          maxLength: 512
                          type: string
                        assertionStep:
                          description: |-
                            AssertionStep is, for a failed run red by assertion, the step (1-based)
                            at which both attempts failed, an assertion of a check that otherwise
                            ran (toolwire.CheckRunRecord.AssertionStep): never a check error, a
                            timeout or a locator that resolved to nothing. Unset otherwise.
                          format: int32
                          maximum: 64
                          minimum: 1
                          type: integer
                        cause:
                          description: |-
                            Cause is, for an error run at the base of an agents verification,
                            why it errored, when the error is the tree's (CheckRunCause); unset
                            for every other run, and on every slot run.
                          enum:
                          - compile
                          - vendored-tree
                          - replace-outside-tree
                          - no-module
                          - base-unbuildable
                          type: string
                        checkDigest:
                          description: CheckDigest is the check's digest.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        dryRunSeq:
                          description: |-
                            DryRunSeq is the ledger entry of the dry run a confirmation required:
                            green, or, for a check expected to fail (Expect), red by assertion;
                            unset on a replay.
                          format: int32
                          maximum: 512
                          minimum: 1
                          type: integer
                        expect:
                          description: |-
                            Expect is fail for a confirmation of a check the evaluator proposed
                            to show a defect.
                          enum:
                          - fail
                          type: string
                        result:
                          description: Result of the run.
                          enum:
                          - pass
                          - fail
                          - quarantined
                          - error
                          - refused
                          type: string
                        seq:
                          description: Seq is the ledger entry of the run.
                          format: int32
                          maximum: 512
                          minimum: 1
                          type: integer
                        token:
                          description: |-
                            Token is the fresh run token the run substituted for the check's
                            run placeholder.
                          maxLength: 40
                          minLength: 1
                          pattern: ^[A-Za-z0-9-]+$
                          type: string
                        tree:
                          description: |-
                            Tree is the tree the run ran against in an agents verification;
                            unset is head (Side), and a slot verification never sets it.
                          enum:
                          - head
                          - base
                          type: string
                      required:
                      - checkDigest
                      - result
                      - seq
                      - token
                      type: object
                    maxItems: 80
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: every base run names the base tree
                      rule: self.all(r, has(r.tree) && r.tree == 'base')
                  unbuildable:
                    description: |-
                      Unbuildable reports that the base tree did not build: every base run
                      is n/a and a pass rests on the other rules, labelled "no base
                      comparison".
                    type: boolean
                type: object
              capture:
                description: |-
                  Capture summarises the component log tails and slot events captured
                  for the evaluator.
                properties:
                  components:
                    description: Components are the per-component log tails.
                    items:
                      description: ComponentCapture is one component's captured log
                        tail.
                      properties:
                        bytes:
                          description: Bytes held, at most 64 KiB.
                          format: int32
                          maximum: 65536
                          minimum: 0
                          type: integer
                        name:
                          description: Name of the part.
                          maxLength: 20
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        truncated:
                          description: Truncated reports that older output was dropped
                            to keep the newest.
                          type: boolean
                      required:
                      - bytes
                      - name
                      type: object
                    maxItems: 12
                    type: array
                    x-kubernetes-list-type: atomic
                  events:
                    description: Events counts the slot events and container states
                      captured.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                type: object
              completedAt:
                description: CompletedAt is when the attempt settled.
                format: date-time
                type: string
              confirmations:
                description: |-
                  Confirmations is each proposed check's confirmation run, alone with
                  a fresh run token, after the evaluator finished.
                items:
                  description: CheckRun is one run of one check, as the ledger recorded
                    it.
                  properties:
                    assertionID:
                      description: |-
                        AssertionID names which assertion of that step failed
                        (toolwire.StepRecord.AssertionID): "json <pointer>", "header <name>",
                        "bodyContains", "marker <id>" or "expect". Set with AssertionStep.
                      maxLength: 512
                      type: string
                    assertionStep:
                      description: |-
                        AssertionStep is, for a failed run red by assertion, the step (1-based)
                        at which both attempts failed, an assertion of a check that otherwise
                        ran (toolwire.CheckRunRecord.AssertionStep): never a check error, a
                        timeout or a locator that resolved to nothing. Unset otherwise.
                      format: int32
                      maximum: 64
                      minimum: 1
                      type: integer
                    cause:
                      description: |-
                        Cause is, for an error run at the base of an agents verification,
                        why it errored, when the error is the tree's (CheckRunCause); unset
                        for every other run, and on every slot run.
                      enum:
                      - compile
                      - vendored-tree
                      - replace-outside-tree
                      - no-module
                      - base-unbuildable
                      type: string
                    checkDigest:
                      description: CheckDigest is the check's digest.
                      pattern: ^sha256:[0-9a-f]{64}$
