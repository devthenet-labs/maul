#
# kind-friendly overlay: local images, a NodePort webhook, minutes instead of
# hours, the fake-CMDB enhancer, the fake harness, and throwaway credentials.
#
#     kind create cluster --config deploy/kind.yaml   # (bring your own; map
#                                                     #  30079 to host)
#     kubectl apply -k deploy/kustomize/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - ../../base
    - static-context.yaml
    - secret-dev.yaml
    - crs-dev.yaml
    - ingress-integration.yaml
    # Canned status-page data (suspended findings + rollup statistics).
    # `kubectl apply -k` creates the objects; run `mise run status-demo` to
    # seed their statuses (phases, rollup buckets) — see the file header.
    - findings-demo.yaml

# No Cilium component: kind runs kindnet, which honours NetworkPolicy only if
# you swap the CNI. Base NetworkPolicies are applied and simply have no effect
# on a stock kind cluster — do not read a green dev apply as a working sandbox.

# Local images: `make snapshot` builds them (per-arch, unpushed — retag the
# host-arch one as maul/<name>:dev), then `kind load docker-image maul/...`.
images:
    - name: ghcr.io/devthenet-labs/maul/integration-controller
      newName: maul/integration-controller
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/source-controller
      newName: maul/source-controller
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/context-controller
      newName: maul/context-controller
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/investigation-controller
      newName: maul/investigation-controller
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/remediation-controller
      newName: maul/remediation-controller
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/evaluation-controller
      newName: maul/evaluation-controller
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/claude-agent-runner
      newName: maul/claude-agent-runner
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/codex-agent-runner
      newName: maul/codex-agent-runner
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/copilot-agent-runner
      newName: maul/copilot-agent-runner
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/status-server
      newName: maul/status-server
      newTag: dev
    - name: ghcr.io/devthenet-labs/maul/egress-broker
      newName: maul/egress-broker
      newTag: dev

patches:
    - path: configmap-patch.yaml
    - path: deployment-context-controller-patch.yaml
    # NodePort the integration-controller's webhook receiver. Point your
    # tunnel (smee.io, ngrok, `gh webhook forward`) at 30079; `mise run
    # replay` delivers recorded fixtures to the same port.
    - path: services-nodeport-patch.yaml
      target:
          kind: Service
          name: maul-integration-controller
    - target:
          kind: Service
          name: maul-integration-controller
      patch: |
          - op: add
            path: /spec/ports/0/nodePort
            value: 30079
    # The evaluation controller reads the shared ConfigMap too, where
    # MAUL_HARNESSES: fake (configmap-patch.yaml) names a runner it has no
    # image for (there is no fake evolve runner), so it would exit at startup.
    # Pod env wins over envFrom, as with the base's MAUL_AUTH_CONFIG:
    # restrict it to the brokered claude runner, which needs nothing to start.
    # An evaluation that calls the model needs the real key secret-dev.yaml
    # describes for maul-anthropic.
    - target:
          kind: Deployment
          name: maul-evaluation-controller
      patch: |
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
                name: MAUL_HARNESSES
                value: claude
    # Laptop-sized. Requests tiny — a kind node has no headroom. Limits stay
    # (kubescape C-0270/C-0271 gate on them) but loose enough to never
    # throttle a dev loop.
    - target:
          kind: Deployment
          labelSelector: app.kubernetes.io/part-of=maul
      patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources
            value:
                requests:
                    cpu: 10m
                    memory: 64Mi
                limits:
                    cpu: "1"
                    memory: 256Mi
