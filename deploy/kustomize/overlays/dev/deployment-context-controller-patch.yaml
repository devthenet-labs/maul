# Mount the fake CMDB where MAUL_STATIC_CONTEXT_FILE points.
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: maul-context-controller
    namespace: maul
spec:
    template:
        spec:
            containers:
                - name: controller
                  volumeMounts:
                      - name: static-context
                        mountPath: /etc/maul/context
                        readOnly: true
            volumes:
                - name: static-context
                  configMap:
                      name: maul-static-context
