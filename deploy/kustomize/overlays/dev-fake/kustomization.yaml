#
# The credential-less end-to-end overlay: everything from dev, with GitHub
# replaced by the e2e suite's fake API running in-cluster and the model
# replaced by a scripted agent — the whole CRD pipeline runs with zero real
# credentials and nothing on the host.
#
#     MAUL_OVERLAY=dev-fake make dev-colima      # deploy (builds the fake images too)
#     mise run replay -- -dev-secret \
#         fixtures/webhooks/code_scanning_alert.created.json
#     kubectl get maul -n maul -w              # watch the pipeline
#
# The fake's API is reachable from the host at http://localhost:30990 (its
# Service NodePort). See docs/deployment/colima.md for the full walkthrough.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - ../dev
    - fakegithub.yaml
    - networkpolicy-fakegithub.yaml

patches:
    # The scripted agent image (hack/fake-agent) as the fake runner instead of
    # the real agent-runner: prints canned MAUL-EVENT lines, needs no model
    # key. The dev overlay already restricts the enabled set to the fake
    # harness (MAUL_HARNESSES: fake); this just swaps its image.
    - patch: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
              name: maul-config
              namespace: maul
          data:
              MAUL_FAKE_AGENT_IMAGE: maul/fake-agent:dev
    # Point the Integration and Forge at the in-cluster fake GitHub.
    - target:
          group: maul.run
          kind: Integration
          name: github
      patch: |
          - op: add
            path: /spec/github/baseURL
            value: http://maul-fakegithub.maul.svc.cluster.local:9990
    - target:
          group: maul.run
          kind: Forge
          name: github
      patch: |
          - op: add
            path: /spec/baseURL
            value: http://maul-fakegithub.maul.svc.cluster.local:9990
