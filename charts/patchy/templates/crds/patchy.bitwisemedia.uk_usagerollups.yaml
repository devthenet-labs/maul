{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: usagerollups.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    categories:
    - patchy
    kind: UsageRollup
    listKind: UsageRollupList
    plural: usagerollups
    shortNames:
    - ur
    singular: usagerollup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scope.type
      name: Scope
      type: string
    - jsonPath: .spec.scope.user
      name: User
      type: string
    - jsonPath: .status.login
      name: Login
      type: string
    - jsonPath: .spec.scope.project
      name: Project
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UsageRollup accumulates the durable per-day and per-month usage of one
          scope: one user (a person or the org), one user's runs in one Project, or
          one Project. Each run's own controller folds the run in once it settles
          (with its usage final), before the run can be deleted; the rollups outlive
          the runs' TTL. They live only in etcd, so a cluster rebuild resets them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UsageRollupSpec pins the scope; it is immutable.
            properties:
              scope:
                description: Scope this rollup aggregates.
                properties:
                  project:
                    description: Project is the Project the intents' runs belonged
                      to.
                    maxLength: 253
                    minLength: 1
                    type: string
                  type:
                    description: Type of the dimension.
                    enum:
                    - user
                    - user-project
                    - project
                    type: string
                  user:
                    description: |-
                      User is whom the runs were attributed to, as the attributed-to
                      annotation says it: "org", or "github-id:<numeric id>" (the identity;
                      a login is display only).
                    pattern: ^(org|github-id:[1-9][0-9]{0,18})$
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: scope.user is set exactly for the user and user-project
                    scopes
                  rule: has(self.user) == (self.type in ['user', 'user-project'])
                - message: scope.project is set exactly for the user-project and project
                    scopes
                  rule: has(self.project) == (self.type in ['user-project', 'project'])
            required:
            - scope
            type: object
            x-kubernetes-validations:
            - message: spec.scope is immutable
              rule: self == oldSelf
          status:
            description: |-
              UsageRollupStatus is the accumulated usage. All data lives in status; the
              ledger makes application exactly-once per run.
            properties:
              days:
                additionalProperties:
                  description: UsageBucket is one day's or month's usage within a
                    scope.
                  properties:
                    cacheReadTokens:
                      description: CacheReadTokens metered.
                      format: int64
                      type: integer
                    cacheWriteTokens:
                      description: CacheWriteTokens metered (five-minute and one-hour).
                      format: int64
                      type: integer
                    costMicroUSD:
                      description: |-
                        CostMicroUSD is the metered tokens' cost at list rates, paid on an API
                        key or a cloud identity.
                      format: int64
                      type: integer
                    inputTokens:
                      description: InputTokens metered.
                      format: int64
                      type: integer
                    kinds:
                      additionalProperties:
                        description: |-
                          UsageKindTotals is one run kind's share of a bucket, for a chart stacked by
                          kind: trusted figures only, beside the run count.
                        properties:
                          costMicroUSD:
                            description: CostMicroUSD at list rates.
                            format: int64
                            type: integer
                          notionalCostMicroUSD:
                            description: NotionalCostMicroUSD for a subscription.
                            format: int64
                            type: integer
                          runs:
                            description: Runs of this kind, whatever their source.
                            format: int64
                            type: integer
                          tokens:
                            description: Tokens metered, every class.
                            format: int64
                            type: integer
                        type: object
                      description: |-
                        Kinds splits the bucket by run kind: investigation, remediation, plan,
                        build, revise, check-fix, evaluation.
                      maxProperties: 16
                      type: object
                    notionalCostMicroUSD:
                      description: |-
                        NotionalCostMicroUSD is the list-rate equivalent of metered tokens a
                        Claude subscription paid for: never money spent.
                      format: int64
                      type: integer
                    outputTokens:
                      description: OutputTokens metered.
                      format: int64
                      type: integer
                    partialRuns:
                      description: |-
                        PartialRuns are the runs whose metered figure is partial (the broker
                        saw only part of the pod); their tokens are in the trusted totals.
                      format: int64
                      type: integer
                    reportedCostMicroUSD:
                      description: |-
                        ReportedCostMicroUSD sums the reported runs' pod-reported cost.
                        Untrusted.
                      format: int64
                      type: integer
                    reportedRuns:
                      description: ReportedRuns are the runs with only a pod-reported
                        figure.
                      format: int64
                      type: integer
                    reportedTokens:
                      description: |-
                        ReportedTokens sums every token class the reported runs' pods said
                        they used. Untrusted.
                      format: int64
                      type: integer
                    runs:
                      description: Runs counted, whatever their source.
                      format: int64
                      type: integer
                    unmeteredTokens:
                      description: |-
                        UnmeteredTokens is the broker's worst-case shortfall: never priced,
                        never part of a cost.
                      format: int64
                      type: integer
                    unpricedRuns:
                      description: |-
                        UnpricedRuns are metered runs with tokens of a model that has no known
                        price: their tokens are counted, their cost is not.
                      format: int64
                      type: integer
                  type: object
                description: |-
                  Days are the day buckets keyed "2026-10-16" (UTC, the run's
                  completion), the last UsageRetentionDays only.
                maxProperties: 400
                type: object
              firstProcessed:
                description: FirstProcessed is the usage epoch for this scope.
                format: date-time
                type: string
              lastProcessed:
                description: LastProcessed is the most recent aggregation.
                format: date-time
                type: string
              login:
                description: |-
                  Login is the GitHub login last seen for a person's user or
                  user-project scope, for display only (the scope's id is the
                  identity).
                maxLength: 64
                type: string
              months:
                additionalProperties:
                  description: |-
                    UsageMonthBucket is one month's usage within a scope, and on a user scope
                    the month's most expensive intents.
                  properties:
                    cacheReadTokens:
                      description: CacheReadTokens metered.
                      format: int64
                      type: integer
                    cacheWriteTokens:
                      description: CacheWriteTokens metered (five-minute and one-hour).
                      format: int64
                      type: integer
                    costMicroUSD:
                      description: |-
                        CostMicroUSD is the metered tokens' cost at list rates, paid on an API
                        key or a cloud identity.
                      format: int64
                      type: integer
                    inputTokens:
                      description: InputTokens metered.
                      format: int64
                      type: integer
                    kinds:
                      additionalProperties:
                        description: |-
                          UsageKindTotals is one run kind's share of a bucket, for a chart stacked by
                          kind: trusted figures only, beside the run count.
                        properties:
                          costMicroUSD:
                            description: CostMicroUSD at list rates.
                            format: int64
                            type: integer
                          notionalCostMicroUSD:
                            description: NotionalCostMicroUSD for a subscription.
                            format: int64
                            type: integer
                          runs:
                            description: Runs of this kind, whatever their source.
                            format: int64
                            type: integer
                          tokens:
                            description: Tokens metered, every class.
                            format: int64
                            type: integer
                        type: object
                      description: |-
                        Kinds splits the bucket by run kind: investigation, remediation, plan,
                        build, revise, check-fix, evaluation.
                      maxProperties: 16
                      type: object
                    notionalCostMicroUSD:
                      description: |-
                        NotionalCostMicroUSD is the list-rate equivalent of metered tokens a
                        Claude subscription paid for: never money spent.
                      format: int64
                      type: integer
                    outputTokens:
                      description: OutputTokens metered.
                      format: int64
                      type: integer
                    partialRuns:
                      description: |-
                        PartialRuns are the runs whose metered figure is partial (the broker
                        saw only part of the pod); their tokens are in the trusted totals.
                      format: int64
                      type: integer
                    reportedCostMicroUSD:
                      description: |-
                        ReportedCostMicroUSD sums the reported runs' pod-reported cost.
                        Untrusted.
                      format: int64
                      type: integer
                    reportedRuns:
                      description: ReportedRuns are the runs with only a pod-reported
                        figure.
                      format: int64
                      type: integer
                    reportedTokens:
                      description: |-
                        ReportedTokens sums every token class the reported runs' pods said
                        they used. Untrusted.
                      format: int64
                      type: integer
                    runs:
                      description: Runs counted, whatever their source.
                      format: int64
                      type: integer
                    topIntents:
                      description: |-
                        TopIntents is the user scope's bounded list of the month's most
                        expensive intents (cost, then tokens), at most MaxTopIntents. It is
                        kept as runs arrive: an intent enters a full list only when its runs
                        so far outrank the last entry, so a long tail of cheap intents is
                        not listed, and an evicted intent's earlier runs are forgotten here
                        (never in the bucket's totals).
                      items:
                        description: |-
                          UsageTopIntent is one intent's usage within a month, for a user's "top
                          intents".
                        properties:
                          costMicroUSD:
                            description: CostMicroUSD at list rates.
                            format: int64
                            type: integer
                          intent:
                            description: Intent is the Intent's name.
                            maxLength: 253
                            minLength: 1
                            type: string
                          notionalCostMicroUSD:
                            description: NotionalCostMicroUSD for a subscription.
                            format: int64
                            type: integer
                          project:
                            description: Project the intent belonged to.
                            maxLength: 253
                            type: string
                          runs:
                            description: Runs counted.
                            format: int64
                            type: integer
                          tokens:
                            description: Tokens metered, every class.
                            format: int64
                            type: integer
                        required:
                        - intent
                        type: object
                      maxItems: 10
                      type: array
                      x-kubernetes-list-type: atomic
                    unmeteredTokens:
                      description: |-
                        UnmeteredTokens is the broker's worst-case shortfall: never priced,
                        never part of a cost.
                      format: int64
                      type: integer
                    unpricedRuns:
                      description: |-
                        UnpricedRuns are metered runs with tokens of a model that has no known
                        price: their tokens are counted, their cost is not.
                      format: int64
                      type: integer
                  type: object
                description: |-
                  Months are the month buckets keyed "2026-10" (UTC), at most
                  UsageRetentionMonths.
                maxProperties: 120
                type: object
              recent:
                description: |-
                  Recent is the exactly-once ledger: the last 512 applied run keys
                  ("u:<run uid>").
                items:
                  type: string
                maxItems: 512
                type: array
              schemaVersion:
                description: SchemaVersion of the bucket layout; see UsageRollupSchemaVersion.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
