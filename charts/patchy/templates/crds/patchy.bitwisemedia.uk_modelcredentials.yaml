{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelcredentials.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    kind: ModelCredential
    listKind: ModelCredentialList
    plural: modelcredentials
    shortNames:
    - mcred
    singular: modelcredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.ownerLogin
      name: Login
      type: string
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.health
      name: Health
      type: string
    - jsonPath: .status.fingerprint
      name: Fingerprint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelCredential is the non-secret record of one person's own model
          credential for one provider (per-user credentials design, L3). The
          credential itself is a Secret in the credentials namespace, named
          ModelCredentialSecretName and labelled with the owner hash; nobody reads
          it back but the egress broker. Both names derive from the owner and the
          provider, so there is at most one per (person, provider). It is outside the
          patchy category on purpose: whose credential exists is visible only to
          its owner and to admins.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelCredentialSpec is whose credential this is and for what. There is no
              Secret pointer: the Secret's name is derived from the owner and provider
              (ModelCredentialSecretName), so nobody can aim a credential at a Secret
              of their choosing.
            properties:
              kind:
                description: |-
                  Kind is how it authenticates; replacing an API key with a setup-token
                  (or back) changes it. An openai credential is always an api-key
                  (ModelCredentialKinds).
                enum:
                - api-key
                - oauth-token
                type: string
              owner:
                description: |-
                  Owner is the person the credential belongs to and pays for, in the
                  attributed-to grammar: "github-id:<numeric id>". A run attributed to
                  that value is the only one that may use it.
                maxLength: 29
                pattern: ^github-id:[1-9][0-9]{0,18}$
                type: string
              ownerLogin:
                description: |-
                  OwnerLogin is the owner's GitHub login when the credential was last
                  written, for display only (the id is the identity).
                maxLength: 64
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                type: string
              provider:
                description: Provider the credential is for.
                enum:
                - anthropic
                - openai
                type: string
            required:
            - kind
            - owner
            - provider
            type: object
            x-kubernetes-validations:
            - message: spec.owner is immutable
              rule: self.owner == oldSelf.owner
            - message: spec.provider is immutable
              rule: self.provider == oldSelf.provider
            - message: an openai credential is an API key (kind api-key)
              rule: self.provider != 'openai' || self.kind == 'api-key'
          status:
            description: |-
              ModelCredentialStatus holds the non-secret facts about the stored
              credential. The status server writes the fingerprint (and resets health
              to Unknown) when it writes the Secret; the egress broker writes health and
              the timestamps. The chart's admission policy holds each to its own fields.
            properties:
              fingerprint:
                description: |-
                  Fingerprint identifies the stored credential without revealing it:
                  its last four characters and a SHA-256 prefix
                  (ModelCredentialFingerprint).
                pattern: ^[A-Za-z0-9_*-]{4}:[0-9a-f]{12}$
                type: string
              health:
                description: Health is what the broker's last probe found; empty is
                  Unknown.
                enum:
                - Valid
                - Rejected
                - Unknown
                type: string
              lastRejectedAt:
                description: LastRejectedAt is when the provider last refused it.
                format: date-time
                type: string
              lastUsedAt:
                description: |-
                  LastUsedAt is when the broker last attached the credential to a
                  request.
                format: date-time
                type: string
              secretVersion:
                description: |-
                  SecretVersion is the resourceVersion of the credential Secret that
                  Health was judged against. Health speaks for that version only: while
                  the Secret's current resourceVersion differs (the person stored a new
                  credential since), the health is Unknown whatever Health says. The
                  broker writes it with Health; the status server may only clear it.
                maxLength: 64
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a ModelCredential is named <sha256(spec.owner)[:16]>-<spec.provider>
          rule: self.metadata.name.matches('^[0-9a-f]{16}-[a-z]+$') && self.metadata.name.substring(17)
            == self.spec.provider
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
