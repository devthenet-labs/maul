#
# Per-user model credentials' admission policies (design L3 and revision 1),
# rendered only while egressBroker.userCredentials.mode is not off. The store
# and its RBAC are user-credentials.yaml, whose guards (the broker, attribution, the
# subscription guard) run before these render.
#
# WHY THIS EXISTS
#
# A ModelCredential says whose key pays for whose runs, and its Secret is that
# key. RBAC alone decides who may write them, and a broad grant (a role over
# every patchy kind, or over every Secret in a namespace) would let its
# holder store a credential under another person's name or point one at a
# Secret of their choosing. So the records and the Secrets are admitted only
# from the status server (which stamps the signed-in person as the owner
# after its own access review) or from a credentials admin (the virtual
# modelcredentials/all), every Secret must carry the derived name, the owner
# hash label that matches it and one bounded data key, and each status field
# keeps one writer: the status server the fingerprint, the broker the health
# its own probes found.
{{- if include "patchy.userCredentialsOn" . }}
{{- $ns := .Release.Namespace }}
{{- $cns := .Values.egressBroker.userCredentials.namespace | default "patchy-credentials" }}
{{- $broker := printf "system:serviceaccount:%s:%s" $ns (include "patchy.serviceAccountName" (dict "root" . "name" "egress-broker" "vals" .Values.egressBroker)) }}
{{- $status := "" }}
{{- if .Values.statusServer.enabled }}
{{- $status = printf "system:serviceaccount:%s:%s" $ns (include "patchy.serviceAccountName" (dict "root" . "name" "status-server" "vals" .Values.statusServer)) }}
{{- end }}
{{- /* v1alpha1.ModelCredentialSecretNamePattern, LabelCredentialOwner,
ModelCredentialSecretKey and ModelCredentialSecretMaxBytes:
TestUserCredentialPatternsAreTheAPIs pins them together. */}}
{{- $secretName := "^cred-[0-9a-f]{16}-(anthropic|openai)$" }}
{{- $ownerLabel := "patchy.bitwisemedia.uk/credential-owner" }}
{{- $dataKey := "credential" }}
{{- $maxBytes := 3072 }}
{{- /* Secret data reaches CEL as base64 text on some API servers and as
bytes on others; a multiple of three bounds both exactly. */}}
{{- $maxBase64 := div (mul $maxBytes 4) 3 }}
{{- $admin := printf "authorizer.group('patchy.bitwisemedia.uk').resource('modelcredentials').subresource('all').namespace('%s').check('update').allowed()" $ns }}
{{- /*
The records. Only the status server (for the signed-in person) or an admin
creates or changes one. Deleting is a revocation and bills nobody, so RBAC
alone decides it (and a namespace deletion is never held up).
*/}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-credentials-records
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [modelcredentials]
    {{- if $status }}
    matchConditions:
        - name: not-the-status-server
          expression: request.userInfo.username != '{{ $status }}'
    {{- end }}
    validations:
        - expression: >-
              {{ $admin }}
          messageExpression: >-
              "modelcredential " + request.name + " may be written only by the status server, for the " +
              "signed-in person, or by a credentials admin (update on modelcredentials/all)"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "patchy.fullname" . }}-credentials-records
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "patchy.fullname" . }}-credentials-records
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ $ns }}
{{- /*
The records' status. Health comes only from the broker's own probes, so the
broker writes health and the timestamps and never the fingerprint; the
status server, which sees the key when it stores it, writes the fingerprint
and may only reset health to Unknown, never touching the timestamps. Nobody
else writes status at all, an admin included.
*/}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-credentials-status
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [UPDATE]
              resources: [modelcredentials/status]
    variables:
        - name: broker
          expression: request.userInfo.username == '{{ $broker }}'
        - name: statusServer
          expression: {{ if $status }}request.userInfo.username == '{{ $status }}'{{ else }}false{{ end }}
    validations:
        - expression: variables.broker || variables.statusServer
          messageExpression: >-
              "the status of modelcredential " + request.name + " is written only by the egress broker " +
              "(health) and the status server (fingerprint)"
          reason: Forbidden
        - expression: >-
              !variables.broker || object.?status.?fingerprint == oldObject.?status.?fingerprint
          messageExpression: >-
              "the egress broker may not change the fingerprint of modelcredential " + request.name
          reason: Forbidden
        - expression: >-
              !variables.statusServer || (
                (object.?status.?health.orValue('Unknown') == 'Unknown'
                  || object.?status.?health == oldObject.?status.?health)
                && object.?status.?lastUsedAt == oldObject.?status.?lastUsedAt
                && object.?status.?lastRejectedAt == oldObject.?status.?lastRejectedAt
                && (object.?status.?secretVersion.orValue('') == ''
                  || object.?status.?secretVersion == oldObject.?status.?secretVersion)
              )
          messageExpression: >-
              "the status server may only reset the health of modelcredential " + request.name +
              " to Unknown, never its timestamps, and may only clear the Secret version it was judged " +
              "against; health comes from the egress broker's probes"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "patchy.fullname" . }}-credentials-status
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "patchy.fullname" . }}-credentials-status
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ $ns }}
{{- /*
The Secrets. Written only by the status server or an admin, each carries the
derived name, the owner-hash label equal to the hash in that name (the
broker checks it again before use) and exactly one data key, non-empty and
bounded, of type Opaque.
*/}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-credential-secrets
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [""]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [secrets]
    variables:
        - name: data
          expression: "object.?data.orValue({})"
    validations:
        - expression: >-
              {{ if $status }}request.userInfo.username == '{{ $status }}' || {{ end }}{{ $admin }}
          messageExpression: >-
              "secret " + request.name + " in {{ $cns }} may be written only by the status server or by a " +
              "credentials admin (update on modelcredentials/all)"
          reason: Forbidden
        - expression: >-
              object.metadata.name.matches('{{ $secretName }}')
              && object.metadata.?labels[?'{{ $ownerLabel }}'].orValue('') == object.metadata.name.substring(5, 21)
          messageExpression: >-
              "secret " + request.name + " in {{ $cns }} must be named cred-<owner hash>-<provider> and " +
              "labelled {{ $ownerLabel }} with the same owner hash"
          reason: Forbidden
        - expression: >-
              object.?type.orValue('Opaque') == 'Opaque'
              && size(variables.data) == 1 && '{{ $dataKey }}' in variables.data
              && size(variables.data['{{ $dataKey }}']) >= 1
              && size(variables.data['{{ $dataKey }}']) <= (type(variables.data['{{ $dataKey }}']) == bytes ? {{ $maxBytes }} : {{ $maxBase64 }})
          messageExpression: >-
              "secret " + request.name + " in {{ $cns }} must be Opaque and hold exactly one key, " +
              "{{ $dataKey }}, of 1 to {{ $maxBytes }} bytes"
          reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "patchy.fullname" . }}-credential-secrets
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "patchy.fullname" . }}-credential-secrets
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ $cns }}
{{- end }}
