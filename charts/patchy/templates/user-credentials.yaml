#
# Per-user model credentials' store and its RBAC (design L3 and revision 1),
# rendered only while egressBroker.userCredentials.mode is not off. The
# admission policies that pin who writes what are user-credentials-policy.yaml.
#
# WHAT LIVES WHERE
#
# Each person's credential is one Secret per provider in its own namespace
# (egressBroker.userCredentials.namespace), named cred-<owner hash>-<provider>
# and labelled patchy.bitwisemedia.uk/credential-owner: <owner hash>. Its
# non-secret facts are a ModelCredential in the release namespace, named
# <owner hash>-<provider>. Both names derive from the owner's GitHub id
# (v1alpha1.ModelCredentialName, ModelCredentialSecretName), so no caller ever
# chooses one.
#
# WHO MAY DO WHAT
#
#   status server  writes the Secrets (create, update, delete; never get,
#                  list, watch or patch: a stored key is never read back to
#                  anyone, and a PATCH response is the whole stored object) and the ModelCredentials, for the signed-in person
#                  after its own access review on modelcredentials/self.
#   egress broker  reads its caller pods (get, for the attributed-to
#                  annotation), the ModelCredentials and the Secrets (an
#                  informer, so revocation reaches it within a minute), and
#                  patches the records' status with its own probes' health.
#   people         nothing on the API server: the -credentials-self
#                  ClusterRole grants only the virtual modelcredentials/self,
#                  which the status server's access reviews read.
#   admins         the -credentials-admin ClusterRole: every record, and the
#                  virtual modelcredentials/all the policies and the status
#                  server recognise an admin by.
{{- if include "patchy.userCredentialsOn" . }}
{{- $uc := .Values.egressBroker.userCredentials }}
{{- $ns := .Release.Namespace }}
{{- $cns := $uc.namespace | default "patchy-credentials" }}
{{- $provider := (.Values.agent.runners.claude.provider | default dict).name | default "anthropic" }}
{{- if not (include "patchy.claudeBrokered" .) }}
{{- fail (printf "egressBroker.userCredentials.mode is %s but the egress broker is not deployed (no claude runner is enabled); per-user credentials are the broker's" $uc.mode) }}
{{- end }}
{{- if include "patchy.harnessEnabled" (dict "root" . "id" "codex") }}
{{- fail (printf "egressBroker.userCredentials.mode is %s while the codex runner is enabled; per-user credentials are Anthropic API keys and setup-tokens only for now, and a codex run must never be held on, or paid by, an Anthropic record: disable agent.runners.codex, or set the mode off" $uc.mode) }}
{{- end }}
{{- if include "patchy.openaiRoute" . }}
{{- fail (printf "egressBroker.userCredentials.mode is %s while egressBroker.openai.apiKey is set; per-user credentials are Anthropic API keys and setup-tokens only for now, and the broker refuses to start with them beside the openai route: leave egressBroker.openai.apiKey.secret empty, or set the mode off" $uc.mode) }}
{{- end }}
{{- if ne $provider "anthropic" }}
{{- fail (printf "egressBroker.userCredentials.mode is %s but agent.runners.claude.provider.name is %s; per-user credentials are Anthropic API keys and setup-tokens only (bedrock, vertex and foundry keep the broker's one identity: use attribution.mode alone)" $uc.mode $provider) }}
{{- end }}
{{- if not (include "patchy.attributionOn" .) }}
{{- fail (printf "egressBroker.userCredentials.mode is %s but attribution.mode is off; whose credential pays is read from the run's attribution, so set attribution.mode attribute" $uc.mode) }}
{{- end }}
{{- if and (eq .Values.egressBroker.anthropicAuth "token") (ne ($uc.orgCredentialIsPersonal | default "") "acknowledged") }}
{{- fail (printf "egressBroker.userCredentials.mode is %s while the org credential is a setup-token (egressBroker.anthropicAuth token), which is a person's Claude subscription: every run with no human behind it would bill it. Switch the org credential to an API key (anthropicAuth key), or set egressBroker.userCredentials.orgCredentialIsPersonal acknowledged" $uc.mode) }}
{{- end }}
{{- if or (eq $cns $ns) (eq $cns .Values.agent.namespace) }}
{{- fail (printf "egressBroker.userCredentials.namespace %s must be a namespace of its own, not the release or the agent namespace: the status server may write every Secret in it" $cns) }}
{{- end }}
{{- $broker := include "patchy.serviceAccountName" (dict "root" . "name" "egress-broker" "vals" .Values.egressBroker) }}
{{- if $uc.createNamespace }}
---
# Credential Secrets only. No workload runs here, so the strictest Pod
# Security level costs nothing. Kept on uninstall and when the mode goes back
# to off: deleting it would delete everyone's stored credential, which is the
# operator's decision to make (kubectl delete namespace), never a side effect.
apiVersion: v1
kind: Namespace
metadata:
    name: {{ $cns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "credentials") | nindent 8 }}
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    annotations:
        helm.sh/resource-policy: keep
        {{- with include "patchy.annotations" (dict "root" .) }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
{{- if .Values.statusServer.enabled }}
{{- $status := include "patchy.serviceAccountName" (dict "root" . "name" "status-server" "vals" .Values.statusServer) }}
---
# The status server stores a person's credential and never reads one back:
# write verbs only, in this namespace only. The admission policy holds every
# Secret it writes to the derived name, the owner-hash label and one bounded
# data key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-status-server-credential-secrets
    namespace: {{ $cns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "status-server") | nindent 8 }}
rules:
    - apiGroups: [""]
      resources: [secrets]
      # No patch: the API server answers a PATCH with the whole stored
      # object, data included, so even a no-op patch would read a key back.
      verbs: [create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-status-server-credential-secrets
    namespace: {{ $cns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "status-server") | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-status-server-credential-secrets
subjects:
    - kind: ServiceAccount
      name: {{ $status }}
      namespace: {{ $ns }}
---
# The records: the status server creates, replaces and deletes them for the
# signed-in person (owner stamped server-side), and writes their fingerprint
# and an Unknown health when it writes the Secret (the policy keeps every
# other status field the broker's).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-status-server-credentials
    namespace: {{ $ns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "status-server") | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials]
      verbs: [get, list, watch, create, update, patch, delete]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials/status]
      verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-status-server-credentials
    namespace: {{ $ns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "status-server") | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-status-server-credentials
subjects:
    - kind: ServiceAccount
      name: {{ $status }}
      namespace: {{ $ns }}
{{- end }}
---
# The broker resolves a request's credential from its caller pod's
# attributed-to annotation: get on pods in the agent namespace, by name (the
# token's own pod, UID-checked). No list, no watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-egress-broker-credential-pods
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "egress-broker") | nindent 8 }}
rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-egress-broker-credential-pods
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "egress-broker") | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-egress-broker-credential-pods
subjects:
    - kind: ServiceAccount
      name: {{ $broker }}
      namespace: {{ $ns }}
---
# The credential Secrets: the broker is their only reader. list and watch
# feed the informer that caps revocation latency (revision 1); this
# namespace holds nothing but these Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-egress-broker-credential-secrets
    namespace: {{ $cns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "egress-broker") | nindent 8 }}
rules:
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-egress-broker-credential-secrets
    namespace: {{ $cns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "egress-broker") | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-egress-broker-credential-secrets
subjects:
    - kind: ServiceAccount
      name: {{ $broker }}
      namespace: {{ $ns }}
---
# The records, read through a small informer, and their health: the one CR
# status the broker writes, from probes it issues itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-egress-broker-credentials
    namespace: {{ $ns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "egress-broker") | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials/status]
      verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-egress-broker-credentials
    namespace: {{ $ns }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "egress-broker") | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-egress-broker-credentials
subjects:
    - kind: ServiceAccount
      name: {{ $broker }}
      namespace: {{ $ns }}
---
# Managing one's own credential on the status page: the virtual
# modelcredentials/self, read only by the status server's access reviews
# (nothing on the API server serves it, so it grants kubectl nothing). get
# shows your record, update sets or replaces your key, delete removes it.
# Bind it with a RoleBinding in the release namespace, usually to the group
# everyone who signs in has.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-credentials-self
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "credentials") | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials/self]
      verbs: [get, update, delete]
---
# Credential admins: everyone's records (see whose credential exists, its
# fingerprint and health; delete one to revoke it), and the virtual
# modelcredentials/all that the status server and the admission policies
# recognise an admin by. It grants no Secret access: a stored credential is
# never readable through patchy. Bind it with a RoleBinding in the release
# namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-credentials-admin
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "credentials") | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials/all]
      verbs: [get, update, delete]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [modelcredentials]
      verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
