#
# One ConfigMap per controller, consumed with envFrom. Every key is a MAUL_*
# environment variable (internal/cli/options.go maps them back onto flags):
# the shared keys come from .Values.config — each overridable per controller
# by repeating the key under <controller>.config — and the
# controller-specific keys from <controller>.config, so each ConfigMap
# carries exactly the settings its binary binds. The key vocabulary mirrors
# deploy/kustomize/base/configmap.yaml.
#
# NOT here: forge/provider credentials. They live in Secrets referenced by
# the Integration and Forge custom resources (spec.secretRef) — see crs.yaml
# and deploy/kustomize/base/secrets.example.yaml.
#
# The data is assembled as a dict so the extra maps (config.extra, then
# <controller>.config.extra) can override any derived key without rendering
# it twice.
#
# agent.repositoryImages, when enabled, adds the repository-image keys to the
# source-, investigation- and remediation-controller data (and to
# intent-controller's, when that is deployed), plus the cosign public key
# ConfigMap source-controller mounts (last in this file). Its render-time
# guards run here, because this file always renders.
#
# agent.resources.default, when any of it is set, adds the MAUL_AGENT_* CPU
# and memory keys to the investigation-, remediation- and intent-controller
# data (evaluation-controller.yaml adds them to its own); agent.resources.classes
# adds MAUL_INTENT_RESOURCE_CLASSES to intent-controller's alone. Unset, they
# render nothing.
#
# The optional intent-controller renders its ConfigMap from the same define
# below, but from its own template (intent-controller.yaml), so the whole
# component stays behind intentController.enabled.
{{- include "maul.repositoryImagesGuard" . }}
{{- include "maul.egressProxyGuard" . }}
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController)
    (dict "name" "source-controller" "vals" .Values.sourceController)
    (dict "name" "context-controller" "vals" .Values.contextController)
    (dict "name" "investigation-controller" "vals" .Values.investigationController)
    (dict "name" "remediation-controller" "vals" .Values.remediationController)
}}
{{- include "maul.controllerConfigMap" (dict "root" $ "c" $c) }}
{{- end }}

{{- /*
One controller's ConfigMap document. Context: dict "root" $ "c" (dict "name"
<controller> "vals" <its values block>). A define rather than inline so
deployments.yaml can hash exactly this controller's ConfigMap into its pod
template's checksum/config annotation: a helm upgrade that changes one
controller's config rolls that controller, and no other.
*/}}
{{- define "maul.controllerConfigMap" }}
{{- $root := .root }}
{{- $c := .c }}
{{- $g := $root.Values.config }}
{{- $own := $c.vals.config }}
{{/*
The health address is fixed: the containerPort, probes, and NetworkPolicy
ports all say 8081, so a knob here would just let the pieces disagree. Same
for :8080 (integration) and :9790 (source).
*/}}
{{- $data := dict
    "MAUL_HEALTH_ADDR" ":8081"
    "MAUL_LOG_LEVEL" ($own.logLevel | default $g.logLevel)
}}
{{- if eq $c.name "integration-controller" }}
{{- $_ := set $data "MAUL_LISTEN_ADDR" ":8080" }}
{{- $_ := set $data "MAUL_ACCUMULATION_WINDOW" $own.accumulationWindow }}
{{- $_ := set $data "MAUL_PROJECTION_CONCURRENCY" $own.projectionConcurrency }}
{{- $intRI := $root.Values.agent.repositoryImages | default dict }}
{{- if $intRI.enabled }}
{{/*
The runner-image tracking-issue comment: integration-controller watches each
finding's Repository record and projects rejections and fallbacks to owners.
*/}}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGES" "true" }}
{{- end }}
{{- /* The tracking issue's credential notice links the Account page. */}}
{{- $_ := include "maul.accountURLData" (dict "root" $root "data" $data) }}
{{- else if eq $c.name "context-controller" }}
{{- $_ := set $data "MAUL_ENHANCE_CONCURRENCY" $own.enhanceConcurrency }}
{{- $_ := set $data "MAUL_ENHANCE_MAX_OUTBOUND" $own.enhanceMaxOutbound }}
{{- $_ := set $data "MAUL_ENHANCER_CONFIG_TTL" $own.enhancerConfigTTL }}
{{- else if eq $c.name "source-controller" }}
{{- $_ := set $data "MAUL_ARTIFACT_ADDR" ":9790" }}
{{- $_ := set $data "MAUL_ARTIFACT_DIR" "/data/artifacts" }}
{{/*
The binary's own default base URL assumes the kustomize Service name
(maul-source-controller); the chart's Service is <fullname>-source-
controller, so the URL minted into Repository statuses is pinned here.
*/}}
{{- $_ := set $data "MAUL_ARTIFACT_BASE_URL" (printf "http://%s-source-controller.%s.svc.cluster.local:9790" (include "maul.fullname" $root) $root.Release.Namespace) }}
{{- if $root.Values.evaluationController.enabled }}
{{/*
The internal workspace-blob endpoint the evaluation controller streams
uploads to (NetworkPolicy-gated to that one client). Rendered only when the
evaluation controller is deployed — without it the second listener never
starts.
*/}}
{{- $_ := set $data "MAUL_ARTIFACT_INTERNAL_ADDR" ":9791" }}
{{- $_ := set $data "MAUL_WORKSPACE_RETENTION" $root.Values.evaluationController.workspaceRetention }}
{{- end }}
{{- $ri := $root.Values.agent.repositoryImages | default dict }}
{{- if $ri.enabled }}
{{/*
Repository-declared runner images: source-controller reads the declaration
out of the pinned tarball and resolves it under this policy. The cosign key
and the registry credential are files (mounted by deployments.yaml); only
their paths are config.
*/}}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGES" "true" }}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGE_REGISTRIES" (join "," $ri.registries) }}
{{- if $root.Values.preview.enabled }}
{{/*
The preview image prefix is never an agent image's registry. The prefix
helper already refuses to render an allowlist that overlaps it; this holds
source-controller to the same rule on its own, whatever reaches its
registries key (a config.extra override included).
*/}}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGE_DENIED_REGISTRIES" (include "maul.previewImagePrefix" $root) }}
{{- end }}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGE_MAX_BYTES" $ri.maxBytes }}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGE_ON_REJECT" ($ri.onReject | default "default") }}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGE_ALLOW_UNSIGNED" ($ri.allowUnsigned | default false) }}
{{- if $ri.cosignPublicKey }}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGE_COSIGN_KEY_FILE" "/etc/maul/repository-image/cosign.pub" }}
{{- end }}
{{- if $ri.pullSecret }}
{{- $_ := set $data "DOCKER_CONFIG" "/etc/maul/registry" }}
{{- end }}
{{- end }}
{{- else if or (eq $c.name "investigation-controller") (eq $c.name "remediation-controller") }}
{{/*
The job-controller block, shared by both: how the agent Jobs run, and the
budgets a remediation may spend. One runner per enabled harness stamps its
own MAUL_<HARNESS>_AGENT_IMAGE and
credential keys, and MAUL_HARNESSES restricts the controllers to exactly the
harnesses enabled here (network-policy rendering can't probe credentials, so
enablement is explicit). Pinning a runner's image digest is one edit under
agent.runners.<harness>.image.
*/}}
{{- $_ := set $data "MAUL_MAX_ATTEMPTS" ($own.maxAttempts | default $g.maxAttempts) }}
{{- $_ := set $data "MAUL_PRIORITY_AGING_INTERVAL" ($own.priorityAgingInterval | default $g.priorityAgingInterval) }}
{{- $_ := set $data "MAUL_PRIORITY_AGING_CAP" ($own.priorityAgingCap | default $g.priorityAgingCap) }}
{{- $_ := set $data "MAUL_AGENT_NAMESPACE" $root.Values.agent.namespace }}
{{- $_ := set $data "MAUL_AGENT_SERVICE_ACCOUNT" $root.Values.agent.serviceAccount }}
{{- $enabled := list }}
{{- range $id, $r := $root.Values.agent.runners }}
{{- if $r.enabled }}
{{- $enabled = append $enabled $id }}
{{- $_ := set $data (printf "MAUL_%s_AGENT_IMAGE" (upper $id)) (include "maul.image" (dict "root" $root "binary" (printf "%s-agent-runner" $id) "image" $r.image)) }}
{{- if eq $id "claude" }}
{{/*
Claude is brokered: the broker URL + provider stamps replace the
MAUL_CLAUDE_SECRET* keys — no model credential exists in the agent
namespace for claude anymore.
*/}}
{{- $_ := include "maul.claudeProviderData" (dict "root" $root "data" $data) }}
{{- else if eq $id "codex" }}
{{/*
Codex is brokered too: the broker URL is all it needs (its route is the
broker's openai one, derived in runnercfg). No MAUL_CODEX_SECRET* key is
stamped: those flags are removed, and no OpenAI key exists in the agent
namespace.
*/}}
{{- $_ := set $data "MAUL_BROKER_URL" (include "maul.brokerURL" $root) }}
{{- else if $r.secret }}
{{- $_ := set $data (printf "MAUL_%s_SECRET" (upper $id)) $r.secret }}
{{- $_ := set $data (printf "MAUL_%s_SECRET_KEY" (upper $id)) $r.secretKey }}
{{- $_ := set $data (printf "MAUL_%s_SECRET_ENV" (upper $id)) $r.secretEnv }}
{{- end }}
{{- end }}
{{- end }}
{{- $_ := set $data "MAUL_HARNESSES" (join "," $enabled) }}
{{- $_ := set $data "MAUL_JOB_DEADLINE" $root.Values.agent.jobDeadline }}
{{- $_ := set $data "MAUL_JOB_TTL" $root.Values.agent.jobTTL }}
{{- $_ := set $data "MAUL_MODEL_ALLOWLIST" $root.Values.agent.modelAllowlist }}
{{- $_ := set $data "MAUL_REMEDIATE_AUTO_MAX_TURNS" $root.Values.agent.remediate.auto.maxTurns }}
{{- $_ := set $data "MAUL_REMEDIATE_AUTO_TOKEN_BUDGET" $root.Values.agent.remediate.auto.tokenBudget }}
{{- $_ := set $data "MAUL_REMEDIATE_MANUAL_MAX_TURNS" $root.Values.agent.remediate.manual.maxTurns }}
{{- $_ := set $data "MAUL_REMEDIATE_MANUAL_TOKEN_BUDGET" $root.Values.agent.remediate.manual.tokenBudget }}
{{- $_ := include "maul.agentResourcesData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.agentDNSData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.agentsPausedData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.attributionData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.usageMeterData" (dict "root" $root "data" $data) }}
{{- if eq $c.name "investigation-controller" }}
{{- $_ := set $data "MAUL_FINDING_MIN_AGE" $own.findingMinAge }}
{{- $_ := set $data "MAUL_GATE_CONCURRENCY" $own.gateConcurrency }}
{{- $_ := set $data "MAUL_MAX_CONCURRENT_INVESTIGATIONS" $own.maxConcurrentInvestigations }}
{{- $_ := set $data "MAUL_CONFIDENCE_THRESHOLD" $own.confidenceThreshold }}
{{- $_ := set $data "MAUL_INVESTIGATE_MODEL" $root.Values.agent.investigate.model }}
{{- $_ := set $data "MAUL_INVESTIGATE_TIMEOUT" $root.Values.agent.investigate.timeout }}
{{- with $root.Values.agent.investigate.idleTimeout }}
{{- $_ := set $data "MAUL_INVESTIGATE_IDLE_TIMEOUT" . }}
{{- end }}
{{- $_ := set $data "MAUL_INVESTIGATE_MAX_TURNS" $root.Values.agent.investigate.maxTurns }}
{{- $_ := set $data "MAUL_INVESTIGATE_TOKEN_BUDGET" $root.Values.agent.investigate.tokenBudget }}
{{- else }}
{{- $_ := set $data "MAUL_MAX_CONCURRENT_REMEDIATIONS" $own.maxConcurrentRemediations }}
{{- $_ := include "maul.userCredentialsData" (dict "root" $root "data" $data) }}
{{- $_ := set $data "MAUL_FINDING_TTL" $own.findingTTL }}
{{- $_ := set $data "MAUL_REMEDIATE_MODEL" $root.Values.agent.remediate.model }}
{{- $_ := set $data "MAUL_REMEDIATE_TIMEOUT" $root.Values.agent.remediate.timeout }}
{{- with $root.Values.agent.remediate.idleTimeout }}
{{- $_ := set $data "MAUL_REMEDIATE_IDLE_TIMEOUT" . }}
{{- end }}
{{- end }}
{{- $ri := $root.Values.agent.repositoryImages | default dict }}
{{- if $ri.enabled }}
{{/*
Both job controllers run a Repository's pinned image only while this is on,
and put the ephemeral-storage wall on every agent Job; the changeset entry
cap is remediation's alone.
*/}}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGES" "true" }}
{{- $_ := set $data "MAUL_AGENT_EPHEMERAL_STORAGE" $ri.ephemeralStorage }}
{{- if eq $c.name "remediation-controller" }}
{{- $_ := set $data "MAUL_CHANGESET_MAX_ENTRIES" $ri.changesetMaxEntries }}
{{- end }}
{{- end }}
{{- else if eq $c.name "intent-controller" }}
{{/*
intent-controller runs its agent Jobs on brokered claude, and on brokered
codex only under intentController.codex.enabled, so only those runners are
stamped, whatever agent.runners enables for findings. Its
own settings carry an intent- prefix (MAUL_INTENT_*), and its Job deadline
is its own: a build stage alone may take an hour.
*/}}
{{- $_ := set $data "MAUL_AGENT_NAMESPACE" $root.Values.agent.namespace }}
{{- $_ := set $data "MAUL_AGENT_SERVICE_ACCOUNT" $root.Values.agent.serviceAccount }}
{{- $_ := set $data "MAUL_JOB_TTL" $root.Values.agent.jobTTL }}
{{- $_ := set $data "MAUL_CLAUDE_AGENT_IMAGE" (include "maul.image" (dict "root" $root "binary" "claude-agent-runner" "image" $root.Values.agent.runners.claude.image)) }}
{{- $_ := include "maul.claudeProviderData" (dict "root" $root "data" $data) }}
{{- $_ := set $data "MAUL_HARNESSES" "claude" }}
{{- if include "maul.intentCodex" $root }}
{{/*
intentController.codex.enabled: a Project choosing spec.harness codex plans
and builds on brokered codex, on the codex runner image (the finding fleet's
agent.runners.codex.image) through the broker's openai route. Off, none of
these keys renders and the ConfigMap is as it was.
*/}}
{{- $_ := set $data "MAUL_HARNESSES" "claude,codex" }}
{{- $_ := set $data "MAUL_CODEX_AGENT_IMAGE" (include "maul.image" (dict "root" $root "binary" "codex-agent-runner" "image" $root.Values.agent.runners.codex.image)) }}
{{- $_ := set $data "MAUL_INTENT_CODEX" "true" }}
{{- $_ := set $data "MAUL_INTENT_CODEX_PLAN_MODEL" $root.Values.intentController.codex.planModel }}
{{- $_ := set $data "MAUL_INTENT_CODEX_BUILD_MODEL" $root.Values.intentController.codex.buildModel }}
{{- end }}
{{- $_ := set $data "MAUL_INTENT_POLL_INTERVAL" $own.pollInterval }}
{{- $_ := set $data "MAUL_INTENT_APPROVAL_POLL_INTERVAL" $own.approvalPollInterval }}
{{- $_ := set $data "MAUL_INTENT_PR_POLL_INTERVAL" $own.prPollInterval }}
{{- $_ := set $data "MAUL_INTENT_PREVIEWS_ENABLED" $root.Values.previewController.enabled }}
{{- if include "maul.previewVerification" $root }}
{{- /*
Acceptance verification (preview.verification.enabled): intent-controller
writes PreviewVerification requests, each timeout clamped to the slot Job
deadline bound preview-controller and maul-preview-jobs hold it to. Off, no
key renders and the ConfigMap is as it was.
*/}}
{{- $_ := set $data "MAUL_INTENT_VERIFICATION" "true" }}
{{- $_ := set $data "MAUL_INTENT_VERIFY_TIMEOUT_MAX" (include "maul.previewVerifyDeadlineMax" $root) }}
{{- if include "maul.previewTools" $root }}
{{- /*
The agent evaluator (intentController.verification.evaluator, with
verification on): rounds, their stages and the hand-off. The cost ceiling is
in micro-USD, as every cost flag takes it. Off, no key renders.
*/}}
{{- $ev := $root.Values.intentController.verification }}
{{- $_ := set $data "MAUL_INTENT_EVALUATOR" "true" }}
{{- $_ := set $data "MAUL_INTENT_EVALUATE_MODEL" $ev.evaluateModel }}
{{- $_ := set $data "MAUL_INTENT_CHECKREVIEW_MODEL" $ev.checkReviewModel }}
{{- $_ := set $data "MAUL_INTENT_EVALUATE_TIMEOUT" $ev.evaluateTimeout }}
{{- $_ := set $data "MAUL_INTENT_DEFAULT_HANDOFF" $ev.defaultHandoff }}
{{- $_ := set $data "MAUL_INTENT_HANDOFF_MAX" $ev.handoffMax }}
{{- $_ := set $data "MAUL_INTENT_EVALUATE_CODEX" $ev.codexEvaluator }}
{{- $_ := set $data "MAUL_INTENT_EVALUATION_COST_MAX" (int64 (round (mulf $ev.maxEvaluateCostUSD 1000000) 0)) }}
{{- $_ := set $data "MAUL_INTENT_MAX_TOOL_CALLS" $ev.maxToolCalls }}
{{- $_ := set $data "MAUL_INTENT_EVALUATE_MAX_TURNS" $ev.evaluateMaxTurns }}
{{- $_ := set $data "MAUL_INTENT_CHECKREVIEW_MAX_TURNS" $ev.checkReviewMaxTurns }}
{{- end }}
{{- end }}
{{- $_ := set $data "MAUL_INTENT_MULTI_REPO" $own.multiRepo }}
{{- $_ := set $data "MAUL_INTENT_DEPENDENCIES" (dig "dependencies" "enabled" true $root.Values.intentController) }}
{{- $_ := set $data "MAUL_INTENT_MAX_CONCURRENT_RUNS" $own.maxConcurrentRuns }}
{{- $_ := set $data "MAUL_INTENT_RATE_LIMIT_FLOOR" $own.rateLimitFloor }}
{{- $_ := set $data "MAUL_INTENT_TTL" $own.intentTTL }}
{{- $_ := set $data "MAUL_INTENT_JOB_DEADLINE" $own.jobDeadline }}
{{- with $own.jobDeadlineMax }}
{{- $_ := set $data "MAUL_INTENT_JOB_DEADLINE_MAX" . }}
{{- end }}
{{- range $stage := list "plan" "build" }}
{{- $s := index $own $stage }}
{{- $prefix := printf "MAUL_INTENT_%s_" (upper $stage) }}
{{- $_ := set $data (print $prefix "MODEL") $s.model }}
{{- $_ := set $data (print $prefix "MAX_TURNS") $s.maxTurns }}
{{- $_ := set $data (print $prefix "TOKEN_BUDGET") $s.tokenBudget }}
{{- $_ := set $data (print $prefix "TIMEOUT") $s.timeout }}
{{- with $s.idleTimeout }}
{{- $_ := set $data (print $prefix "IDLE_TIMEOUT") . }}
{{- end }}
{{- end }}
{{- $_ := set $data "MAUL_INTENT_REVISE_MAX_TURNS" $own.revise.maxTurns }}
{{- $_ := set $data "MAUL_INTENT_REVISE_TOKEN_BUDGET" $own.revise.tokenBudget }}
{{- $_ := set $data "MAUL_INTENT_REVISE_TIMEOUT" $own.revise.timeout }}
{{- with $own.revise.idleTimeout }}
{{- $_ := set $data "MAUL_INTENT_REVISE_IDLE_TIMEOUT" . }}
{{- end }}
{{- /*
Plans, and the builds of a repository that picks no class, run on the default
CPU and memory; the classes a Project picks from per repository are
intent-controller's alone. Neither renders while unset, so the default
ConfigMap is unchanged.
*/}}
{{- $_ := include "maul.agentResourcesData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.agentDNSData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.agentsPausedData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.attributionData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.usageMeterData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.brokerBudgetData" (dict "root" $root "data" $data) }}
{{- $_ := include "maul.userCredentialsData" (dict "root" $root "data" $data) }}
{{- with ($root.Values.agent.resources | default dict).classes }}
{{- $_ := set $data "MAUL_INTENT_RESOURCE_CLASSES" (toJson .) }}
{{- end }}
{{- $ri := $root.Values.agent.repositoryImages | default dict }}
{{- if $ri.enabled }}
{{/*
A build runs only on an accepted repository image (a Project may opt out
with requireRepositoryImage: false), so without these keys every build
blocks on ImageRequired. The changeset entry cap is remediation's value.
*/}}
{{- $_ := set $data "MAUL_REPOSITORY_IMAGES" "true" }}
{{- $_ := set $data "MAUL_AGENT_EPHEMERAL_STORAGE" $ri.ephemeralStorage }}
{{- $_ := set $data "MAUL_CHANGESET_MAX_ENTRIES" $ri.changesetMaxEntries }}
{{- end }}
{{- else if eq $c.name "preview-controller" }}
{{- $p := $root.Values.preview }}
{{- $_ := set $data "MAUL_PREVIEW_SLOT_COUNT" $p.slotCount }}
{{- $_ := set $data "MAUL_PREVIEW_IMAGE_PREFIX" (include "maul.previewImagePrefix" $root) }}
{{- $_ := set $data "MAUL_PREVIEW_HOST_SUFFIX" $p.hostSuffix }}
{{- /* Node isolation (_preview.tpl): the EKS names keep their own keys, so
       an install configured by them alone renders this ConfigMap as it
       always did; a generic selector and mode none add a key each. */}}
{{- $nodes := include "maul.previewNodeIsolation" $root | fromJson }}
{{- with $nodes.nodePool }}{{ $_ := set $data "MAUL_PREVIEW_NODE_POOL" . }}{{ end }}
{{- with $nodes.nodeClass }}{{ $_ := set $data "MAUL_PREVIEW_NODE_CLASS" . }}{{ end }}
{{- with $nodes.taintKey }}{{ $_ := set $data "MAUL_PREVIEW_TAINT_KEY" . }}{{ end }}
{{- with $nodes.selector }}{{ $_ := set $data "MAUL_PREVIEW_NODE_SELECTOR" (toJson .) }}{{ end }}
{{- if eq $nodes.mode "none" }}{{ $_ := set $data "MAUL_PREVIEW_NODE_ISOLATION" "none" }}{{ end }}
{{- $_ := set $data "MAUL_PREVIEW_ROLLOUT_TIMEOUT" $own.rolloutTimeout }}
{{- $_ := set $data "MAUL_PREVIEW_POLL_INTERVAL" $own.pollInterval }}
{{- $_ := set $data "MAUL_PREVIEW_MAX_RETRIES" $own.maxRetries }}
{{- /* Target health is the preview ALB's: without the legacy slot Ingress
       there is no load balancer target to wait for, so the controller is
       told false (it would ignore true, with a warning at every start). */}}
{{- $_ := set $data "MAUL_PREVIEW_TARGET_HEALTH" (and (include "maul.previewLegacyIngress" $root | eq "true") $own.targetHealth) }}
{{- $_ := set $data "MAUL_PREVIEW_LEGACY_INGRESS" (include "maul.previewLegacyIngress" $root | eq "true") }}
{{- if include "maul.previewVerification" $root }}
{{- /* Acceptance verification: the tester image switches the
       VerificationReconciler on; the deadline bound is maul-preview-jobs'.
       Off, neither key renders. */}}
{{- $_ := set $data "MAUL_PREVIEW_TESTER_IMAGE" (include "maul.previewTesterImage" $root) }}
{{- $_ := set $data "MAUL_PREVIEW_VERIFY_DEADLINE_MAX" (include "maul.previewVerifyDeadlineMax" $root) }}
{{- if include "maul.previewTools" $root }}
{{- /* The agent evaluator's slot tool pod: its three images, by digest,
       exactly those the slot policies admit. Off, no key renders. */}}
{{- $img := include "maul.previewToolImages" $root | fromJson }}
{{- $_ := set $data "MAUL_PREVIEW_EVALUATOR" "true" }}
{{- $_ := set $data "MAUL_PREVIEW_TOOLS_IMAGE" $img.tools }}
{{- $_ := set $data "MAUL_PREVIEW_BROWSER_IMAGE" $img.browser }}
{{- $_ := set $data "MAUL_PREVIEW_TOOLBOX_IMAGE" $img.toolbox }}
{{- /* The one namespace a tool pod's per-verification ingress policy
       admits its evaluator from, as maul-preview-networkpolicies pins it. */}}
{{- $_ := set $data "MAUL_PREVIEW_AGENTS_NAMESPACE" $root.Values.agent.namespace }}
{{- end }}
{{- end }}
{{- /*
Preview sign-in required (previewAuth.stage require): the pinned annotation
sets, rendered once in _preview-auth.tpl, so every Ingress the controller
writes carries exactly what the slot admission policies compare. The previous
generation's sets ride beside them during a rotation's overlap.
*/}}
{{- $pas := include "maul.previewAuthState" $root | fromJson }}
{{- if and $pas.enabled (eq $pas.stage "require") }}
{{- $_ := set $data "MAUL_PREVIEW_AUTH_REQUIRED" "true" }}
{{- $_ := set $data "MAUL_PREVIEW_AUTH_ANNOTATIONS" (get $pas.sets (toString (int $pas.applyGen)) | toJson) }}
{{- if gt (int $pas.otherGen) 0 }}
{{- $_ := set $data "MAUL_PREVIEW_AUTH_PREVIOUS_ANNOTATIONS" (get $pas.sets (toString (int $pas.otherGen)) | toJson) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (include "maul.egressProxyEnabled" $root) (has $c.name (list "remediation-controller" "intent-controller")) }}
{{- /*
Network profiles (egressProxy): the job controllers that launch remediate
and build Jobs get the kill switch, the profile set and the proxy's URL.
investigation-controller and evaluation-controller never bind these flags,
so they never carry them.
*/}}
{{- $_ := include "maul.networkProfilesData" (dict "root" $root "data" $data) }}
{{- end }}
{{/*
The global egress proxy (spec.proxy on a Forge/GitHub Integration overrides
it per resource). NO_PROXY always starts with the cluster-internal suffixes
so in-cluster traffic (the artifact endpoint, the egress broker, the API
server) never detours through the proxy. Set before the extra loops so
config.extra keeps the last word.
*/}}
{{- $p := $root.Values.proxy | default dict }}
{{- if or $p.httpsProxy $p.httpProxy }}
{{- with $p.httpsProxy }}
{{- $_ := set $data "HTTPS_PROXY" . }}
{{- end }}
{{- with $p.httpProxy }}
{{- $_ := set $data "HTTP_PROXY" . }}
{{- end }}
{{- $no := "localhost,127.0.0.1,.svc,.cluster.local" }}
{{- with $p.noProxy }}
{{- $no = printf "%s,%s" $no . }}
{{- end }}
{{- $_ := set $data "NO_PROXY" $no }}
{{- end }}
{{- range $k, $v := $g.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
{{- range $k, $v := $own.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "maul.configMapName" (dict "root" $root "name" $c.name) }}
    namespace: {{ $root.Release.Namespace }}
    labels:
        {{- include "maul.labels" (dict "root" $root "name" $c.name) | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $root) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
data:
    {{- range $k, $v := $data }}
    {{- /* Helm parses every values.yaml number as a float64, and toString
           renders a large one in scientific notation ("1.2e+06"), which the
           binaries' strconv.Atoi rejects at startup. Integral floats are
           therefore rendered as integers; genuine fractions (confidence
           thresholds) fall through unchanged. */ -}}
    {{- $s := $v | toString }}
    {{- if and (kindIs "float64" $v) (eq $v (floor $v)) }}
    {{- $s = int64 $v | toString }}
    {{- end }}
    {{ $k }}: {{ $s | quote }}
    {{- end }}
{{- end }}
{{- $ri := .Values.agent.repositoryImages | default dict }}
{{- if and $ri.enabled $ri.cosignPublicKey }}
---
# The public key every repository-declared image must be cosign-signed with,
# mounted into source-controller at /etc/maul/repository-image/cosign.pub
# (MAUL_REPOSITORY_IMAGE_COSIGN_KEY_FILE). A public key, so a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "maul.fullname" . }}-repository-image-key
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "maul.labels" (dict "root" . "name" "source-controller") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
data:
    cosign.pub: |
        {{- $ri.cosignPublicKey | trim | nindent 8 }}
{{- end }}
