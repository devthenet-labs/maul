#
# Fail-closed, exact-slot admission. No exempt user or controller: even maul
# must create only a Pod/Deployment/Service/Ingress fitting the slot contract.
# Paired with the kept namespace/network/quota resources so rollback or
# uninstall cannot leave a live workload in an unguarded slot.
# Helm adds ownership annotations to chart resources. Admit them only on the
# fixed selectorless placeholder Service/Ingress in slot 0, never on a
# preview-controller or other user-created resource.
{{- if .Values.preview.enabled }}
{{- $p := .Values.preview }}
{{- /* Node isolation (_preview.tpl): the selector every slot Pod must carry,
       the EKS NodePool and NodeClass labels first, so an install configured
       by those names alone renders the policy it always did; with mode none
       neither the selector nor the toleration rule renders. */}}
{{- $nodes := include "maul.previewNodeIsolation" . | fromJson }}
{{- $eksOnly := and $nodes.eks (eq (len $nodes.pairs) 2) }}
{{- $slots := list }}
{{- range $i := until (int $p.slotCount) }}{{ $slots = append $slots (printf "maul-preview-%d" $i) }}{{ end }}
{{- $guardSlots := list }}
{{- range $i := until 4 }}{{ $guardSlots = append $guardSlots (printf "maul-preview-%d" $i) }}{{ end }}
{{- $prefix := include "maul.previewImagePrefix" . }}
{{- /*
Preview sign-in (previewAuth, _preview-auth.tpl): with it enabled, the slot
Ingress policy admits each admitted key generation's pinned sign-in
annotations, exactly and as a whole set, except auth-session-timeout, which
may be any whole number of seconds up to the ceiling (a shorter ALB session is
never weaker, and so a sessionTimeout change is never refused by the policy
it replaces). It records the generations in its preview-auth-admits
annotation and the ceiling in preview-auth-session-timeout (the require
stage's lookups read both). In the require stage a second, kept policy
requires them. Disabled, both policies render exactly as before.
*/}}
{{- $pas := include "maul.previewAuthState" . | fromJson }}
{{- $authWant := "" }}
{{- if $pas.enabled }}
{{- $gens := list $pas.gen }}
{{- if gt (int $pas.prevGen) 0 }}{{ $gens = append $gens $pas.prevGen }}{{ end }}
{{- $authWant = include "maul.previewAuthWant" (dict "st" $pas "gens" $gens) }}
{{- end }}
{{- $authKeys := list "alb.ingress.kubernetes.io/auth-type" "alb.ingress.kubernetes.io/auth-idp-oidc" "alb.ingress.kubernetes.io/auth-on-unauthenticated-request" "alb.ingress.kubernetes.io/auth-scope" "alb.ingress.kubernetes.io/auth-session-cookie" "alb.ingress.kubernetes.io/auth-session-timeout" | toJson }}
{{- /*
An UPDATE that changes nothing a load balancer reads: its spec and annotations
are exactly what they were (a finalizer, label or owner reference change).
EKS Auto Mode removes its group.ingress.eks.amazonaws.com finalizer with such
an UPDATE; refusing it on an Ingress or Service that no longer conforms (one
created before a rule tightened) would leave that object Terminating forever
and its slot wedged. Being deleted is no exemption: a Terminating object's spec
stays writable until its finalizers go, so a spec or annotation change to one
is evaluated like any other.
*/}}
{{- $unchangedForLB := "request.operation != 'UPDATE' || !(object.spec == oldObject.spec && has(object.metadata.annotations) == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations))" }}
{{- /*
Acceptance verification (preview.verification.enabled, helpers in
preview-verification-policy.yaml): a tester Job runs in the slot, so the pod
rules gain a jobs kind (every rule below applies to a Job's pod template,
under the Job rules of its own), the pod and Job image rules admit the
tester's exact digest beside the preview prefix (never a Deployment's: no
component runs it), and maul-preview-networkpolicies fences
preview-controller's edge policies. Off, everything renders as before.
*/}}
{{- $verify := include "maul.previewVerification" . }}
{{- $kinds := list (dict "name" "pods" "group" `""` "resource" "pods" "pod" "object.spec" "exact" list) (dict "name" "deployments" "group" "apps" "resource" "deployments" "pod" "object.spec.template.spec" "exact" list) }}
{{- $pcSA := "" }}
{{- $deadlineMax := 0 }}
{{- if $verify }}
{{- $tester := include "maul.previewTesterImage" . }}
{{- $pcSA = printf "system:serviceaccount:%s:%s" .Release.Namespace (include "maul.serviceAccountName" (dict "root" . "name" "preview-controller" "vals" .Values.previewController)) }}
{{- $deadlineMax = int ($p.verification.deadlineMaxSeconds | default 1800) }}
{{- $kinds = list (dict "name" "pods" "group" `""` "resource" "pods" "pod" "object.spec" "exact" (list $tester)) (dict "name" "deployments" "group" "apps" "resource" "deployments" "pod" "object.spec.template.spec" "exact" list) (dict "name" "jobs" "group" "batch" "resource" "jobs" "pod" "object.spec.template.spec" "exact" (list $tester)) }}
{{- end }}
{{- range $kind := $kinds }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-{{ $kind.name }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [{{ $kind.group }}]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [{{ $kind.resource }}{{ if eq $kind.name "pods" }}, pods/ephemeralcontainers{{ end }}]
    # Match the actual namespace name; do not rely on a label selector alone
    # for this security decision.
    matchConditions:
        - name: exact-preview-slot
          expression: 'request.namespace in {{ $guardSlots | toJson }}'
        {{- if eq $kind.name "jobs" }}
        # A metadata-only UPDATE (the garbage collector removing a
        # foreground-deletion finalizer) changes nothing a pod runs.
        - name: spec-changed
          expression: "request.operation != 'UPDATE' || object.spec != oldObject.spec"
        {{- end }}
    variables:
        - name: pod
          expression: {{ $kind.pod | quote }}
        {{- if eq $kind.name "jobs" }}
        - name: spec
          expression: object.spec
        {{- end }}
    validations:
        {{- if eq $kind.name "jobs" }}
        - expression: "request.userInfo.username == '{{ $pcSA }}'"
          message: only preview-controller runs Jobs in a preview slot
        - expression: >-
              has(variables.spec.backoffLimit) && variables.spec.backoffLimit == 0 &&
              (!has(variables.spec.parallelism) || variables.spec.parallelism == 1) &&
              (!has(variables.spec.completions) || variables.spec.completions == 1) &&
              (!has(variables.spec.manualSelector) || !variables.spec.manualSelector) &&
              !has(variables.spec.ttlSecondsAfterFinished) && !has(variables.spec.podFailurePolicy) &&
              (!has(variables.spec.suspend) || !variables.spec.suspend)
          message: preview Jobs run once, never retried, never self-deleting
        - expression: >-
              has(variables.spec.activeDeadlineSeconds) &&
              variables.spec.activeDeadlineSeconds <= {{ $deadlineMax }} &&
              has(variables.pod.activeDeadlineSeconds) &&
              variables.pod.activeDeadlineSeconds <= variables.spec.activeDeadlineSeconds &&
              variables.pod.restartPolicy == 'Never'
          message: preview Jobs and their pods carry a bounded deadline
        - expression: >-
              object.spec.template.metadata.?labels[?'maul.run/preview-role'].orValue('') in ['tester', 'command', 'seed'] &&
              object.spec.template.metadata.?labels[?'maul.run/preview-uid'].orValue('') != '' &&
              object.spec.template.metadata.?labels[?'maul.run/preview-part'].orValue('') != ''
          message: preview Job pods are labelled with their Preview, part and role
        {{- end }}
        - expression: >-
              variables.pod.containers.all(c,
              {{- if $kind.exact }}
                c.image in {{ $kind.exact | toJson }} ||
              {{- end }}
                c.image.startsWith('{{ $prefix }}') &&
                c.image.substring({{ len $prefix }}).matches('^[a-z0-9-]+:sha-[0-9a-f]{40}$'))
          message: only immutable maul preview ECR images are allowed
        - expression: size(variables.pod.containers) == 1
          message: preview pods run exactly one container
        - expression: >-
              has(variables.pod.automountServiceAccountToken) &&
              variables.pod.automountServiceAccountToken == false &&
              has(variables.pod.serviceAccountName) &&
              variables.pod.serviceAccountName == 'default'
          message: preview pods must explicitly disable API token mounting and use the default ServiceAccount
        - expression: >-
              (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) &&
              (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0) &&
              (!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir)))
          message: preview pods may use only emptyDir volumes and no init or ephemeral containers
        - expression: >-
              (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
              (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
              (!has(variables.pod.hostIPC) || !variables.pod.hostIPC)
          message: preview pods may not use host namespaces
        {{- if eq $nodes.mode "required" }}
        - expression: >-
              has(variables.pod.nodeSelector) &&
              {{- range $i, $pair := $nodes.pairs }}
              '{{ index $pair 0 }}' in variables.pod.nodeSelector &&
              variables.pod.nodeSelector['{{ index $pair 0 }}'] == {{ index $pair 1 | quote }}{{ if lt (add1 $i) (len $nodes.pairs) }} &&{{ end }}
              {{- end }}
          message: preview pods must select the dedicated preview {{ if $eksOnly }}node pool and class{{ else }}nodes{{ end }}
        - expression: >-
              has(variables.pod.tolerations) &&
              variables.pod.tolerations.exists(t,
                has(t.key) && t.key == {{ $nodes.taintKey | quote }} &&
                has(t.operator) && t.operator == 'Equal' &&
                has(t.value) && t.value == 'true' &&
                has(t.effect) && t.effect == 'NoExecute' &&
                !has(t.tolerationSeconds))
          message: preview pods must tolerate the exact preview-only taint
        {{- end }}
        - expression: >-
              {{- if eq $kind.name "pods" }}
              (!has(variables.pod.nodeName) || variables.pod.nodeName == '' ||
                (request.operation == 'UPDATE' && oldObject != null &&
                  has(oldObject.spec.nodeName) &&
                  variables.pod.nodeName == oldObject.spec.nodeName)) &&
              {{- else }}
              (!has(variables.pod.nodeName) || variables.pod.nodeName == '') &&
              {{- end }}
              (!has(variables.pod.schedulerName) || variables.pod.schedulerName == '' ||
                variables.pod.schedulerName == 'default-scheduler')
          message: preview pods may not bypass the default scheduler
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-all-slots-{{ $kind.name }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-{{ $kind.name }}
    validationActions: [Deny]
{{- /* Jobs are new with verification: no retained per-slot binding to
       upgrade, and a slot Job's pod meets the outside-pods policy below
       anywhere else. */}}
{{- if ne $kind.name "jobs" }}
# Keep the older per-slot bindings below for a safe upgrade of retained
# policies. This global binding protects a slot even if its label is changed.
{{- range $slot := $slots }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ $slot }}-{{ $kind.name }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-{{ $kind.name }}
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ $slot }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-outside-{{ $kind.name }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [{{ if eq $kind.name "pods" }}""{{ else }}apps{{ end }}]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [{{ $kind.resource }}{{ if eq $kind.name "pods" }}, pods/ephemeralcontainers{{ end }}]
    matchConditions:
        - name: outside-preview-slots
          expression: '!(request.namespace in {{ $slots | toJson }})'
    variables:
        - name: pod
          expression: {{ $kind.pod | quote }}
    validations:
        - expression: >-
              !has(variables.pod.tolerations) ||
              variables.pod.tolerations.all(t,
                {{- if $nodes.taintKey }}
                (!has(t.key) || t.key != {{ $nodes.taintKey | quote }}) &&
                {{- end }}
                !(has(t.operator) && t.operator == 'Exists' &&
                  (!has(t.key) || t.key == '')))
          message: preview-only toleration and tolerate-all are forbidden outside preview slots
        - expression: >-
              {{- if eq $kind.name "pods" }}
              !has(variables.pod.nodeName) || variables.pod.nodeName == '' ||
              (request.operation == 'UPDATE' && oldObject != null &&
                has(oldObject.spec.nodeName) &&
                variables.pod.nodeName == oldObject.spec.nodeName)
              {{- else }}
              !has(variables.pod.nodeName) || variables.pod.nodeName == ''
              {{- end }}
          message: direct node placement is forbidden outside preview slots
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-outside-{{ $kind.name }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-outside-{{ $kind.name }}
    validationActions: [Deny]
{{- end }}
{{- end }}
{{- if $verify }}
---
# Acceptance verification's edge policies. preview-controller renders one
# additive policy per part of a Preview (preview-<p>-np-<part>): it selects
# that part by the Preview's UID and part labels alone, covers both
# directions, and its every peer is a part of the same Preview, by those two
# labels only, on explicit numeric TCP ports. preview-isolation stays Helm's:
# preview-controller may never create, change or delete it. Every other
# writer keeps today's posture. Kept, like every slot policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-networkpolicies
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [networking.k8s.io]
              apiVersions: [v1]
              operations: [CREATE, UPDATE, DELETE]
              resources: [networkpolicies]
    matchConditions:
        - name: exact-preview-slot
          expression: 'request.namespace in {{ $guardSlots | toJson }}'
    variables:
        - name: np
          expression: "request.operation == 'DELETE' ? oldObject : object"
        - name: pc
          expression: "request.userInfo.username == '{{ $pcSA }}'"
        - name: sel
          expression: variables.np.spec.podSelector
        - name: uid
          expression: "variables.sel.?matchLabels[?'maul.run/preview-uid'].orValue('')"
        # A peer: a pod selector of exactly the policy's own Preview UID and
        # one part, nothing else (no IP block, no namespace selector).
        - name: rulesOK
          expression: >-
              request.operation == 'DELETE' || (
              (!has(object.spec.ingress) || object.spec.ingress.all(r,
                has(r.from) && size(r.from) > 0 && has(r.ports) && size(r.ports) > 0 &&
                r.ports.all(p, has(p.protocol) && p.protocol == 'TCP' && has(p.port) &&
                  type(p.port) == int && !has(p.endPort)) &&
                r.from.all(f, !has(f.ipBlock) && !has(f.namespaceSelector) && has(f.podSelector) &&
                  !has(f.podSelector.matchExpressions) && has(f.podSelector.matchLabels) &&
                  size(f.podSelector.matchLabels) == 2 &&
                  f.podSelector.matchLabels[?'maul.run/preview-uid'] == optional.of(variables.uid) &&
                  'maul.run/preview-part' in f.podSelector.matchLabels))) &&
              (!has(object.spec.egress) || object.spec.egress.all(r,
                has(r.to) && size(r.to) > 0 && has(r.ports) && size(r.ports) > 0 &&
                r.ports.all(p, has(p.protocol) && p.protocol == 'TCP' && has(p.port) &&
                  type(p.port) == int && !has(p.endPort)) &&
                r.to.all(t, !has(t.ipBlock) && !has(t.namespaceSelector) && has(t.podSelector) &&
                  !has(t.podSelector.matchExpressions) && has(t.podSelector.matchLabels) &&
                  size(t.podSelector.matchLabels) == 2 &&
                  t.podSelector.matchLabels[?'maul.run/preview-uid'] == optional.of(variables.uid) &&
                  'maul.run/preview-part' in t.podSelector.matchLabels))))
    validations:
        - expression: "!(variables.pc && variables.np.metadata.name == 'preview-isolation')"
          message: preview-controller may never create, change or delete the slot isolation policy
        - expression: >-
              !variables.pc || (variables.np.metadata.name.startsWith('preview-') &&
              variables.np.metadata.name.contains('-np-') &&
              variables.np.metadata.?labels[?'app.kubernetes.io/managed-by'] == optional.of('maul-preview-controller') &&
              variables.uid != '' && !has(variables.sel.matchExpressions) &&
              size(variables.sel.matchLabels) == 2 &&
              'maul.run/preview-part' in variables.sel.matchLabels)
          message: preview-controller policies select one part of one Preview, by labels only
        - expression: >-
              !variables.pc || request.operation == 'DELETE' ||
              (has(object.spec.policyTypes) && size(object.spec.policyTypes) == 2 &&
               'Ingress' in object.spec.policyTypes && 'Egress' in object.spec.policyTypes)
          message: preview edge policies always cover both directions
        - expression: "!variables.pc || variables.rulesOK"
          message: preview edges admit only pods of the same Preview, by part, on explicit TCP ports
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-all-slots-networkpolicies
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-networkpolicies
    validationActions: [Deny]
{{- end }}
---
# No slot workload may name a Secret through its environment. The emptyDir-only
# volume rule already refuses secret and projected volumes; this closes env
# valueFrom.secretKeyRef and envFrom secretRef, for every container kind, so a
# Secret placed in a slot namespace (a preview sign-in client secret, say) can
# never reach preview code. Kept, and its own policy, so it outlives a rollback
# of the others. Only the pod spec is read, so an UPDATE that leaves the spec
# as it was (labels, annotations, finalizers) is not evaluated.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-secret-refs
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [""]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [pods, pods/ephemeralcontainers]
            - apiGroups: [apps]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [deployments]
    matchConditions:
        - name: exact-preview-slot
          expression: 'request.namespace in {{ $guardSlots | toJson }}'
        - name: pod-spec-changed
          expression: "request.operation != 'UPDATE' || object.spec != oldObject.spec"
    variables:
        # One policy for both kinds: dyn() because a Pod has no template and a
        # Deployment no containers at the top of its spec.
        - name: pod
          expression: "request.resource.resource == 'deployments' ? dyn(object).spec.template.spec : dyn(object).spec"
        - name: containers
          expression: >-
              (has(variables.pod.containers) ? variables.pod.containers : []) +
              (has(variables.pod.initContainers) ? variables.pod.initContainers : []) +
              (has(variables.pod.ephemeralContainers) ? variables.pod.ephemeralContainers : [])
    validations:
        - expression: >-
              variables.containers.all(c,
                (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) &&
                (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))
          message: preview containers may not read a Secret through env valueFrom.secretKeyRef or envFrom secretRef
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-all-slots-secret-refs
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-secret-refs
    validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-services
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [""]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [services]
    matchConditions:
        - name: exact-preview-slot
          expression: 'request.namespace in {{ $guardSlots | toJson }}'
        - name: not-metadata-only
          expression: {{ $unchangedForLB | quote }}
    variables:
        - name: helmPlaceholder
          expression: "request.namespace == 'maul-preview-0' && object.metadata.name == 'maul-preview-placeholder'"
    validations:
        - expression: >-
              object.spec.type == 'ClusterIP' &&
              (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0) &&
              (!has(object.spec.loadBalancerClass)) &&
              object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 0)
          message: preview Services must be internal ClusterIP with no external IP or node port
        # A preview component's Service may carry only its own health-check
        # path, which the load balancer applies to that Service's targets.
        - expression: >-
              !has(object.metadata.annotations) ||
              object.metadata.annotations.all(k, v,
                (variables.helmPlaceholder && (
                  (k == 'helm.sh/resource-policy' && v == 'keep') ||
                  (k == 'meta.helm.sh/release-name' && v == {{ .Release.Name | quote }}) ||
                  (k == 'meta.helm.sh/release-namespace' && v == {{ .Release.Namespace | quote }}))) ||
                (!variables.helmPlaceholder &&
                  k == 'alb.ingress.kubernetes.io/healthcheck-path' &&
                  v.matches('^/[a-zA-Z0-9/_-]*$')))
          message: preview Service annotations are restricted to a safe healthcheck path; Helm ownership and keep annotations are reserved for the placeholder Service
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-all-slots-services
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-services
    validationActions: [Deny]
{{- range $slot := $slots }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ $slot }}-services
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-services
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ $slot }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-ingresses
    annotations:
        helm.sh/resource-policy: keep
        {{- if $pas.enabled }}
        # The key generations whose sign-in annotations this policy admits;
        # the require stage refuses to apply one not listed here.
        maul.run/preview-auth-admits: {{ $pas.admits | quote }}
        # The longest auth-session-timeout this policy admits; the require
        # stage applies no longer one.
        maul.run/preview-auth-session-timeout: {{ int $pas.timeoutCeiling | toString | quote }}
        {{- end }}
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [networking.k8s.io]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [ingresses]
    matchConditions:
        - name: exact-preview-slot
          expression: 'request.namespace in {{ $guardSlots | toJson }}'
        - name: not-metadata-only
          expression: {{ $unchangedForLB | quote }}
    variables:
        - name: helmPlaceholder
          expression: "request.namespace == 'maul-preview-0' && object.metadata.name == 'maul-preview-placeholder'"
        {{- if $pas.enabled }}
        # Slot namespace -> the pinned sign-in sets admitted there, one per
        # admitted key generation.
        - name: authWant
          expression: >-
              {{ $authWant }}
        - name: authKeys
          expression: >-
              {{ $authKeys }}
        - name: authTimeoutCeiling
          expression: {{ int $pas.timeoutCeiling | toString | quote }}
        {{- end }}
    validations:
        - expression: >-
              object.spec.ingressClassName == 'alb-preview' &&
              !has(object.spec.defaultBackend) &&
              (!has(object.spec.tls) || size(object.spec.tls) == 0)
          message: preview Ingresses must use alb-preview and class-level TLS only
        - expression: >-
              has(object.spec.rules) && size(object.spec.rules) > 0 &&
              object.spec.rules.all(r, has(r.host) &&
                r.host.matches('^[a-z0-9-]+[.]{{ replace "." "[.]" $p.hostSuffix }}$'))
          message: preview Ingress hosts must be single-label subdomains of the configured preview suffix
        # One host, one rule: a Prefix path per component in the component
        # path grammar, each to a preview Service on port 80. The kept
        # placeholder routes / to its own selectorless Service instead.
        - expression: >-
              has(object.spec.rules) && size(object.spec.rules) == 1 &&
              object.spec.rules.all(r, has(r.http) && size(r.http.paths) >= 1 && size(r.http.paths) <= 4 &&
                r.http.paths.all(p,
                  has(p.pathType) && p.pathType == 'Prefix' &&
                  has(p.path) && p.path.matches('^/([a-z0-9-]+(/[a-z0-9-]+)*)?$') &&
                  has(p.backend.service) && has(p.backend.service.port.number) &&
                  p.backend.service.port.number == 80 &&
                  (variables.helmPlaceholder ?
                    p.backend.service.name == 'maul-preview-placeholder' :
                    p.backend.service.name.startsWith('preview-'))))
          message: preview Ingresses have one rule of at most 4 Prefix paths in the component path grammar, each backed by a preview- Service on port 80
        - expression: >-
              !has(object.metadata.annotations) ||
              object.metadata.annotations.all(k, v,
                (!variables.helmPlaceholder &&
                  k == 'alb.ingress.kubernetes.io/healthcheck-path' &&
                  v.matches('^/[a-zA-Z0-9/_-]*$')) ||
                (variables.helmPlaceholder && (
                  (k == 'helm.sh/resource-policy' && v == 'keep') ||
                  (k == 'meta.helm.sh/release-name' && v == {{ .Release.Name | quote }}) ||
                  (k == 'meta.helm.sh/release-namespace' && v == {{ .Release.Namespace | quote }}))){{ if $pas.enabled }} ||
                k in variables.authKeys{{ end }})
          message: preview Ingress annotations are restricted to a safe healthcheck path or the named placeholder's Helm ownership{{ if $pas.enabled }}, plus the slot's pinned sign-in annotations{{ end }}
        {{- if $pas.enabled }}
        # Sign-in annotations come as one admitted generation's whole set for
        # this very slot (its own client Secret and cookie), or not at all;
        # its auth-session-timeout a canonical whole number of seconds up to
        # the ceiling (six digits bound it before int() reads it).
        - expression: >-
              !has(object.metadata.annotations) ||
              !variables.authKeys.exists(k, k in object.metadata.annotations) ||
              (request.namespace in variables.authWant &&
                variables.authWant[request.namespace].exists(s,
                  s.all(k, k in object.metadata.annotations &&
                    (k == 'alb.ingress.kubernetes.io/auth-session-timeout' ?
                      object.metadata.annotations[k].matches('^[1-9][0-9]{0,5}$') &&
                        int(object.metadata.annotations[k]) <= variables.authTimeoutCeiling :
                      object.metadata.annotations[k] == s[k]))))
          message: preview Ingress sign-in annotations must be exactly one admitted key generation's pinned set for this slot, with an auth-session-timeout of at most {{ int $pas.timeoutCeiling }} seconds
        {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-all-slots-ingresses
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-ingresses
    validationActions: [Deny]
{{- range $slot := $slots }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ $slot }}-ingresses
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-ingresses
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ $slot }}
{{- end }}
{{- if and $pas.enabled (eq $pas.stage "require") }}
---
# Preview sign-in required: every slot Ingress carries its slot's whole pinned
# set of an admitted key generation (its auth-session-timeout up to the
# ceiling, as above), the placeholder included. Its own policy
# and kept, so a rollback that reverts the others still refuses an Ingress
# that drops sign-in (scale preview-controller to zero and delete this
# policy's binding first, and only while preview.inboundCIDRs is still set).
# A slot beyond slotCount has no set and admits no Ingress. As with the
# others, an UPDATE that changes neither spec nor annotations (Auto Mode
# removing its finalizer) is not evaluated.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-ingress-auth
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [networking.k8s.io]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [ingresses]
    matchConditions:
        - name: exact-preview-slot
          expression: 'request.namespace in {{ $guardSlots | toJson }}'
        - name: not-metadata-only
          expression: {{ $unchangedForLB | quote }}
    variables:
        - name: want
          expression: >-
              {{ $authWant }}
        - name: authTimeoutCeiling
          expression: {{ int $pas.timeoutCeiling | toString | quote }}
    validations:
        - expression: >-
              request.namespace in variables.want &&
              has(object.metadata.annotations) &&
              variables.want[request.namespace].exists(s,
                s.all(k, k in object.metadata.annotations &&
                  (k == 'alb.ingress.kubernetes.io/auth-session-timeout' ?
                    object.metadata.annotations[k].matches('^[1-9][0-9]{0,5}$') &&
                      int(object.metadata.annotations[k]) <= variables.authTimeoutCeiling :
                    object.metadata.annotations[k] == s[k])))
          message: preview Ingresses must carry their slot's pinned sign-in annotations (preview sign-in is required)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-all-slots-ingress-auth
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-ingress-auth
    validationActions: [Deny]
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-outside-ingresses
    annotations:
        helm.sh/resource-policy: keep
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [networking.k8s.io]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [ingresses]
    matchConditions:
        - name: outside-preview-slots
          expression: '!(request.namespace in {{ $slots | toJson }})'
    validations:
        - expression: >-
              !has(object.spec.ingressClassName) ||
              object.spec.ingressClassName != 'alb-preview'
          message: alb-preview is reserved for the exact preview slot namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-outside-ingresses
    annotations:
        helm.sh/resource-policy: keep
spec:
    policyName: maul-preview-outside-ingresses
    validationActions: [Deny]
{{- end }}
