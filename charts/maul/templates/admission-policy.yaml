#
# Field-level authorization for human actions on Findings — the Helm rendering
# of deploy/kustomize/base/admission-policy.yaml. Keep the two in step; the
# validation expressions are the security control and the envtest suite in
# internal/action runs against the kustomize copy.
#
# WHY THIS EXISTS
#
# The custom verbs (approve, retry, expedite, suspend, resume) let a grant say
# "this developer may approve findings, and nothing else". The status server can
# honour that alone because it writes as its own ServiceAccount and asks
# SubjectAccessReview first. Anything writing as the *user* — the maul CLI,
# kubectl, curl — is authorized by the API server, and RBAC has no notion of a
# field: `update` on findings grants the whole object. Admission control is the
# only server-side mechanism that can express the difference, and because it
# runs in the API server it applies to every client equally.
#
# Unlike the kustomize copy, the exempt subjects are computed from the release's
# actual ServiceAccount names — a renamed release or an overridden
# serviceAccount.name would otherwise silently drop a controller out of the
# exemption and stall the pipeline.
{{- if .Values.admissionPolicy.enabled }}
{{/*
Gate on KubeVersion rather than Capabilities.APIVersions: an offline
`helm template` reports only a minimal built-in API list, so an APIVersions
check would fail every render that is not against a live cluster. KubeVersion is
defined in both cases and overridable with --kube-version.

This FAILS rather than skipping itself, because silently omitting the policy is
the one outcome nobody would notice: the chart would install, the verbs would
look granted, and every one of them would be advisory.

Chart.yaml's own kubeVersion is currently stricter than this, so in practice
helm rejects an old cluster first. The check stays because it names the reason —
and because the day someone relaxes that constraint, this is what stops the
verb ladder quietly becoming decorative.
*/}}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail (printf "admissionPolicy.enabled is true but this cluster is %s; ValidatingAdmissionPolicy needs Kubernetes 1.30+. Upgrade, or set admissionPolicy.enabled=false and accept that the custom finding verbs become advisory — anyone holding `update` on findings could then change any field, including forging an approval." .Capabilities.KubeVersion.Version) }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $subjects := list }}
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController)
    (dict "name" "source-controller" "vals" .Values.sourceController)
    (dict "name" "context-controller" "vals" .Values.contextController)
    (dict "name" "investigation-controller" "vals" .Values.investigationController)
    (dict "name" "remediation-controller" "vals" .Values.remediationController)
    (dict "name" "status-server" "vals" $.Values.statusServer)
}}
{{- $sa := include "maul.serviceAccountName" (dict "root" $ "name" $c.name "vals" $c.vals) }}
{{- $subjects = append $subjects (printf "system:serviceaccount:%s:%s" $ns $sa) }}
{{- end }}
{{- range $extra := .Values.admissionPolicy.extraExemptSubjects }}
{{- $subjects = append $subjects $extra }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "maul.fullname" . }}-finding-actions
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            # CREATE is matched alongside UPDATE deliberately. Without it, a
            # user holding create+delete could delete a finding and recreate it
            # with spec.approval already set, laundering an approval they were
            # never granted.
            - apiGroups: [maul.run]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [findings]
    matchConditions:
        # The maul controllers own spec: ingest writes it, accumulation folds
        # alerts into it, and the status server does its own SubjectAccessReview
        # before writing. They are exempt; everyone else is evaluated.
        - name: not-a-maul-controller
          expression: >-
              !(request.userInfo.username in [{{ range $i, $s := $subjects }}{{ if $i }}, {{ end }}'{{ $s }}'{{ end }}])
    variables:
        - name: auth
          expression: >-
              authorizer.group('maul.run').resource('findings')
                .namespace(request.namespace)
        # oldObject is null on CREATE, so every rule below reads "unchanged from
        # old, OR authorized". On a create that means "there is nothing to be
        # unchanged from", which is what makes presetting a field count as
        # changing it.
        - name: old
          expression: "oldObject"
    validations:
        # --- the human-writable fields, each gated by its own verb ------------
        - expression: >-
              (variables.old != null && variables.old.spec.?suspend.orValue(false) == object.spec.?suspend.orValue(false))
              || (object.spec.?suspend.orValue(false)
                    ? variables.auth.check('suspend').allowed()
                    : variables.auth.check('resume').allowed())
          messageExpression: >-
              "changing spec.suspend on finding " + object.metadata.name +
              " requires the 'suspend' or 'resume' verb on findings.maul.run"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?approval == object.spec.?approval)
              || variables.auth.check('approve').allowed()
          messageExpression: >-
              "changing spec.approval on finding " + object.metadata.name +
              " requires the 'approve' verb on findings.maul.run"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?retry == object.spec.?retry)
              || variables.auth.check('retry').allowed()
          messageExpression: >-
              "changing spec.retry on finding " + object.metadata.name +
              " requires the 'retry' verb on findings.maul.run"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?expedite == object.spec.?expedite)
              || variables.auth.check('expedite').allowed()
          messageExpression: >-
              "changing spec.expedite on finding " + object.metadata.name +
              " requires the 'expedite' verb on findings.maul.run"
          reason: Forbidden

        # --- everything else in spec is the pipeline's, not a human's ---------
        #
        # Enumerated field by field because CEL cannot subtract keys from a
        # struct. A field added to FindingSpec must be added here too — the test
        # TestAdmissionPolicyCoversEveryFindingSpecField enforces that against
        # the kustomize copy, so keep this list identical to it.
        #
        # spec.related is deliberately absent: relationship edges are documented
        # as human-writable (api/v1alpha1/finding_types.go) and carry no
        # authority.
        - expression: >-
              variables.old == null || (
                variables.old.spec.integrationRef == object.spec.integrationRef
                && variables.old.spec.?trackingRef == object.spec.?trackingRef
                && variables.old.spec.source == object.spec.source
                && variables.old.spec.?repository == object.spec.?repository
                && variables.old.spec.?cloudResource == object.spec.?cloudResource
                && variables.old.spec.advisories == object.spec.advisories
                && variables.old.spec.?ruleID == object.spec.?ruleID
                && variables.old.spec.?title == object.spec.?title
                && variables.old.spec.?description == object.spec.?description
                && variables.old.spec.?severity == object.spec.?severity
                && variables.old.spec.?alerts == object.spec.?alerts
                && variables.old.spec.?overflowAlerts == object.spec.?overflowAlerts
              )
          messageExpression: >-
              "finding " + object.metadata.name + " is written by the maul pipeline; " +
              "only spec.suspend, spec.approval, spec.retry, spec.expedite and spec.related " +
              "may be changed by a user, and each needs its own verb"
          reason: Forbidden

        # --- metadata that carries meaning -----------------------------------
        #
        # The rollup finalizers guarantee a finding's spend is aggregated before
        # deletion, and the selector labels are what accumulation and child
        # lookup key on. `update` would otherwise let a user break either.
        - expression: >-
              variables.old == null || (
                variables.old.metadata.?finalizers == object.metadata.?finalizers
                && variables.old.metadata.?ownerReferences == object.metadata.?ownerReferences
                && variables.old.metadata.?labels == object.metadata.?labels
              )
          messageExpression: >-
              "finding " + object.metadata.name +
              " has pipeline-owned finalizers, ownerReferences and labels; they may not be edited by hand"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "maul.fullname" . }}-finding-actions
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "maul.fullname" . }}-finding-actions
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
# Field-level authorization for the request stamps on Integrations: the
# backfill, replay and reset triggers each need their own custom verb on
# integrations.maul.run. Two DELIBERATE divergences from the
# findings policy above: no frozen-fields rule (IntegrationSpec is operator
# configuration; plain `update` keeps working for the GitOps flow), and
# clearing a request field needs no verb (a GitOps apply pruning a stamped
# request must not be denied; cancelling carries no authority).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "maul.fullname" . }}-integration-actions
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            # CREATE is matched alongside UPDATE for the same laundering
            # reason as findings: recreating an Integration with a request
            # field preset must not smuggle the action past the verb.
            - apiGroups: [maul.run]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [integrations]
    matchConditions:
        # Same exemption as the findings policy: the status server does its
        # own SubjectAccessReview before stamping a request, and the
        # controllers never write Integration spec at all.
        - name: not-a-maul-controller
          expression: >-
              !(request.userInfo.username in [{{ range $i, $s := $subjects }}{{ if $i }}, {{ end }}'{{ $s }}'{{ end }}])
    variables:
        - name: auth
          expression: >-
              authorizer.group('maul.run').resource('integrations')
                .namespace(request.namespace)
        # oldObject is null on CREATE, so each rule reads "absent, OR
        # unchanged from old, OR authorized": presetting a request on a
        # fresh object counts as setting it, while omitting it stays free.
        - name: old
          expression: "oldObject"
    validations:
        - expression: >-
              !has(object.spec.backfill)
              || (variables.old != null && variables.old.spec.?backfill == object.spec.?backfill)
              || variables.auth.check('backfill').allowed()
          messageExpression: >-
              "setting spec.backfill on integration " + object.metadata.name +
              " requires the 'backfill' verb on integrations.maul.run"
          reason: Forbidden

        - expression: >-
              !has(object.spec.replay)
              || (variables.old != null && variables.old.spec.?replay == object.spec.?replay)
              || variables.auth.check('replay').allowed()
          messageExpression: >-
              "setting spec.replay on integration " + object.metadata.name +
              " requires the 'replay' verb on integrations.maul.run"
          reason: Forbidden

        - expression: >-
              !has(object.spec.reset)
              || (variables.old != null && variables.old.spec.?reset == object.spec.?reset)
              || variables.auth.check('reset').allowed()
          messageExpression: >-
              "setting spec.reset on integration " + object.metadata.name +
              " requires the 'reset' verb on integrations.maul.run"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "maul.fullname" . }}-integration-actions
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "maul.fullname" . }}-integration-actions
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- if include "maul.egressProxyEnabled" . }}
{{- /*
The profile-label policy (egressProxy): a second enforcement point for
network profiles, independent of controller code. A Job in the agent
namespace whose labels, or whose pod template's labels, carry a
<networkProfileLabelPrefix><name> key is admitted only from the controller
that launches that run kind, remediation-controller for kind remediation and
intent-controller for kind intent, and only with the runner-image-source
annotation repository. Every other requester is refused, the
investigation-controller (which holds jobs create there) included. It judges
CREATE, and an UPDATE only when the profile labels differ from oldObject's,
so the Job controller's and the garbage collector's own updates pass
untouched; removing every profile label is never refused.
*/}}
{{- $prefix := include "maul.networkProfileLabelPrefix" . }}
{{- $kindLabel := "maul.run/kind" }}
{{- $launchers := list (dict "sa" (printf "system:serviceaccount:%s:%s" $ns (include "maul.serviceAccountName" (dict "root" $ "name" "remediation-controller" "vals" .Values.remediationController))) "kind" "remediation") }}
{{- if .Values.intentController.enabled }}
{{- $launchers = append $launchers (dict "sa" (printf "system:serviceaccount:%s:%s" $ns (include "maul.serviceAccountName" (dict "root" $ "name" "intent-controller" "vals" .Values.intentController))) "kind" "intent") }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "maul.fullname" . }}-network-profiles
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [batch]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              resources: [jobs]
    variables:
        # The profile labels, as "job:<key>=<value>" and "pod:<key>=<value>",
        # on the object and (empty on CREATE) on oldObject.
        - name: profileLabels
          expression: >-
              object.metadata.?labels.orValue({}).filter(k, k.startsWith('{{ $prefix }}'))
                .map(k, 'job:' + k + '=' + object.metadata.labels[k])
              + object.spec.?template.?metadata.?labels.orValue({}).filter(k, k.startsWith('{{ $prefix }}'))
                .map(k, 'pod:' + k + '=' + object.spec.template.metadata.labels[k])
        - name: oldProfileLabels
          expression: >-
              oldObject == null ? [] :
              oldObject.metadata.?labels.orValue({}).filter(k, k.startsWith('{{ $prefix }}'))
                .map(k, 'job:' + k + '=' + oldObject.metadata.labels[k])
              + oldObject.spec.?template.?metadata.?labels.orValue({}).filter(k, k.startsWith('{{ $prefix }}'))
                .map(k, 'pod:' + k + '=' + oldObject.spec.template.metadata.labels[k])
        # Whether this request sets or changes a profile label: compared as
        # sets, so map ordering never reads as a change.
        - name: judged
          expression: >-
              size(variables.profileLabels) > 0
              && !(variables.profileLabels.all(l, l in variables.oldProfileLabels)
                   && variables.oldProfileLabels.all(l, l in variables.profileLabels))
        - name: runKind
          expression: "object.metadata.?labels[?'{{ $kindLabel }}'].orValue('')"
    validations:
        - expression: >-
              !variables.judged || (
                ({{ range $i, $l := $launchers }}{{ if $i }}
                 || {{ end }}(request.userInfo.username == '{{ $l.sa }}' && variables.runKind == '{{ $l.kind }}'){{ end }})
                && object.metadata.?annotations[?'maul.run/runner-image-source'].orValue('') == 'repository'
              )
          messageExpression: >-
              "job " + object.metadata.name + " carries a network profile label ({{ $prefix }}<profile>); " +
              "only remediation-controller (kind remediation) and intent-controller (kind intent) may set one, " +
              "and only on a Job running a repository image (runner-image-source: repository)"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "maul.fullname" . }}-network-profiles
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "maul.fullname" . }}-network-profiles
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Values.agent.namespace }}
{{- /*
The pod side of the same gate. The agent NetworkPolicies select Pods, not
Jobs, so the Job policy above alone left a hole: a bare Pod (or one from any
other controller) labelled <networkProfileLabelPrefix><name> in the agent
namespace got the profile's route to the egress proxy without any launch
check. A Pod carrying a profile label is admitted only when the Kubernetes
Job controller creates it (admissionPolicy.jobControllerUsernames) with a
controlling owner reference to a batch/v1 Job, so every such Pod is stamped
from a Job template the Job policy already judged, and that policy stays the
single gate on who may grant a profile. The owner reference is checked as
well as the identity so that, on a cluster whose controller manager runs
every controller as one user (system:kube-controller-manager), a ReplicaSet,
StatefulSet or DaemonSet Pod still cannot borrow the Job controller's
admission. No UPDATE may set or change a profile label (the Job controller
never relabels a Pod); removing every profile label is never refused. The
status subresource is matched too: a pods/status write keeps the labels it
is sent (the status strategy resets spec, not metadata.labels), so without
it an unlabelled bare Pod could be given a profile label through /status.
*/}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "maul.fullname" . }}-network-profile-pods
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [""]
              apiVersions: [v1]
              operations: [CREATE, UPDATE]
              # pods/status as well: a status write persists label changes.
              resources: [pods, pods/status]
    variables:
        # The profile labels as "<key>=<value>", on the object and (empty on
        # CREATE) on oldObject.
        - name: profileLabels
          expression: >-
              object.metadata.?labels.orValue({}).filter(k, k.startsWith('{{ $prefix }}'))
                .map(k, k + '=' + object.metadata.labels[k])
        - name: oldProfileLabels
          expression: >-
              oldObject == null ? [] :
              oldObject.metadata.?labels.orValue({}).filter(k, k.startsWith('{{ $prefix }}'))
                .map(k, k + '=' + oldObject.metadata.labels[k])
        # Whether this request sets or changes a profile label: compared as
        # sets, so map ordering never reads as a change.
        - name: judged
          expression: >-
              size(variables.profileLabels) > 0
              && !(variables.profileLabels.all(l, l in variables.oldProfileLabels)
                   && variables.oldProfileLabels.all(l, l in variables.profileLabels))
        # Exactly one controlling owner reference, and it is a batch/v1 Job.
        - name: jobControlled
          expression: >-
              object.metadata.?ownerReferences.orValue([])
                .filter(r, r.?controller.orValue(false))
                .all(r, r.apiVersion == 'batch/v1' && r.kind == 'Job')
              && size(object.metadata.?ownerReferences.orValue([])
                .filter(r, r.?controller.orValue(false))) == 1
    validations:
        - expression: >-
              !variables.judged || (
                oldObject == null
                && request.userInfo.username in [{{ range $i, $u := .Values.admissionPolicy.jobControllerUsernames }}{{ if $i }}, {{ end }}{{ $u | toJson }}{{ end }}]
                && variables.jobControlled
              )
          messageExpression: >-
              "pod " + object.metadata.name + " carries a network profile label ({{ $prefix }}<profile>); " +
              "only the Kubernetes Job controller may create a pod carrying one, for the batch/v1 Job " +
              "that controls it, and no update may set or change one"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "maul.fullname" . }}-network-profile-pods
    labels: {{- include "maul.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "maul.fullname" . }}-network-profile-pods
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Values.agent.namespace }}
{{- end }}
{{- end }}
