#
# Acceptance verification's request channel (preview.verification.enabled):
# a PreviewVerification in the release namespace is a request intent-controller
# writes (create, delete) and preview-controller answers (status only). RBAC
# grants each its half; this policy holds every identity to it, the cluster's
# own garbage and namespace controllers aside, so neither controller can write
# the other's half and nobody else can forge either. Fail closed.
{{- /*
maul.previewVerification: the verification switch, checked once for every
template that renders a piece of it. Returns "true" with it on, "" off. On,
it needs preview-controller (which needs the slot foundation and
intent-controller) and a tester image maul.previewTesterImage accepts.
*/}}
{{- define "maul.previewVerification" -}}
{{- $v := .Values.preview.verification | default dict -}}
{{- if $v.enabled -}}
{{- if not .Values.previewController.enabled }}{{ fail "preview.verification.enabled requires previewController.enabled (and with it preview.enabled and intentController.enabled): verification runs in the preview slots, from requests intent-controller writes" }}{{ end -}}
{{- $_ := include "maul.previewTesterImage" . -}}
true
{{- end -}}
{{- end }}
{{- /*
maul.previewTesterImage: preview.verification.testerImage, checked. The slot
policies admit it by this exact reference beside the preview prefix, so it
must be pinned by digest and must be neither a preview runtime image (under
the preview image prefix: built from an unreviewed pull request) nor under
an agent registry (invariant 17 made symmetric: no image is both a slot
workload and an agent sandbox). Compared on segment boundaries through
maul.registryPathKey, as the prefix overlap check is.
*/}}
{{- define "maul.previewTesterImage" -}}
{{- include "maul.previewMaulImage" (dict "root" . "key" "testerImage" "what" "the digest-pinned preview-tester image" "when" "preview.verification.enabled=true") -}}
{{- end }}
{{- /*
maul.previewMaulImage: one of maul's own slot images, preview.verification.<key>
(dict root, key, what, when), checked as the tester's always was: pinned by
digest, the registry named, and under neither the preview image prefix nor
an agent registry. Returns the reference.
*/}}
{{- define "maul.previewMaulImage" -}}
{{- $root := .root -}}
{{- $name := printf "preview.verification.%s" .key -}}
{{- $img := "" -}}
{{- $v := $root.Values.preview.verification | default dict -}}
{{- if hasPrefix "tools." .key -}}
{{- $img = get ($v.tools | default dict) (trimPrefix "tools." .key) | default "" | toString -}}
{{- else -}}
{{- $img = get $v .key | default "" | toString -}}
{{- end -}}
{{- if not $img }}{{ fail (printf "%s is required when %s: %s" $name .when .what) }}{{ end -}}
{{- $host := `(([a-z0-9-]+\.)+[a-z0-9-]+(:[0-9]+)?|[a-z0-9-]+:[0-9]+|localhost(:[0-9]+)?)` -}}
{{- $path := `(/[a-z0-9]+([._-][a-z0-9]+)*)+` -}}
{{- $tag := `(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?` -}}
{{- $digest := `@sha256:[0-9a-f]{64}` -}}
{{- if not (regexMatch (printf "^%s%s%s%s$" $host $path $tag $digest) $img) }}{{ fail (printf "%s %q must be pinned by digest: <registry host>/<path>[:tag]@sha256:<64 lowercase hex>, the registry named" $name $img) }}{{ end -}}
{{- $repo := regexReplaceAll (printf "%s%s$" $tag $digest) $img "" -}}
{{- $key := include "maul.registryPathKey" (printf "%s/" $repo) -}}
{{- $preview := include "maul.registryPathKey" (include "maul.previewImagePrefix" $root) -}}
{{- if hasPrefix $preview $key }}{{ fail (printf "%s %q lies under the preview image prefix %s: that path holds images built from unreviewed pull requests, and a slot image of maul's must be maul's own" $name $img (include "maul.previewImagePrefix" $root)) }}{{ end -}}
{{- range $entry := ($root.Values.agent.repositoryImages | default dict).registries | default list -}}
{{- $agent := include "maul.registryPathKey" (printf "%s/" (trimSuffix "/" (toString $entry))) -}}
{{- if hasPrefix $agent $key }}{{ fail (printf "%s %q lies under the agent registry %q (agent.repositoryImages.registries): an image a slot runs must never be one an agent sandbox may run" $name $img (toString $entry)) }}{{ end -}}
{{- end -}}
{{- $img -}}
{{- end }}
{{- /*
maul.previewTools: the slot tool pod switch. Returns "true" when acceptance
verification and the agent evaluator (intentController.verification.evaluator)
are both on, "" otherwise: the evaluator drives a tool pod in a Preview's
slot, so without verification (no slot Jobs, no PreviewVerifications) it has
nothing to evaluate, and intent-controller is not switched on. On, it checks
the three tool images and that one evaluation round's timeout fits under the
slot Job deadline.
*/}}
{{- define "maul.previewTools" -}}
{{- if and (include "maul.previewVerification" .) (include "maul.evaluatorEnabled" .) -}}
{{- $_ := include "maul.previewToolImages" . -}}
{{- $ev := .Values.intentController.verification | default dict -}}
{{- $timeout := toString ($ev.evaluateTimeout | default "20m") -}}
{{- $seconds := int64 (include "maul.durationSeconds" $timeout) -}}
{{- $deadline := int64 (include "maul.previewVerifyDeadlineSeconds" .) -}}
{{- if or (le $seconds 0) (ge $seconds $deadline) }}{{ fail (printf "intentController.verification.evaluateTimeout %s must be a whole number of h, m and s shorter than preview.verification.deadlineMaxSeconds (%ds): one evaluation round's slot tool Job runs for it plus a margin, under that deadline" $timeout $deadline) }}{{ end -}}
true
{{- end -}}
{{- end }}
{{- /*
maul.previewToolImages: the tool pod's three images, checked, as JSON
{tools, browser, toolbox}.
*/}}
{{- define "maul.previewToolImages" -}}
{{- $when := "preview.verification.enabled and intentController.verification.evaluator are on" -}}
{{- dict
    "tools" (include "maul.previewMaulImage" (dict "root" . "key" "tools.image" "what" "the digest-pinned preview-tools image (the slot tool pod's relay)" "when" $when))
    "browser" (include "maul.previewMaulImage" (dict "root" . "key" "tools.browserImage" "what" "the digest-pinned preview-browser image (the tool pod's browser sidecar)" "when" $when))
    "toolbox" (include "maul.previewMaulImage" (dict "root" . "key" "tools.toolboxImage" "what" "the digest-pinned preview-toolbox image (the tool pod's sandbox sidecar)" "when" $when))
    | toJson -}}
{{- end }}
{{- /*
maul.previewVerifyDeadlineSeconds: preview.verification.deadlineMaxSeconds
(default 1800), the one bound three readers share: maul-preview-jobs' limit
on a slot Job's activeDeadlineSeconds, preview-controller's
--preview-verify-deadline-max and intent-controller's
--intent-verify-timeout-max (maul.previewVerifyDeadlineMax renders it as a
Go duration). A request's timeout, so its tester Job's deadline, can then
never exceed what admission allows. The schema holds it to [60, 3600], the
range both flags accept.
*/}}
{{- define "maul.previewVerifyDeadlineSeconds" -}}
{{- int ((.Values.preview.verification | default dict).deadlineMaxSeconds | default 1800) -}}
{{- end }}
{{- define "maul.previewVerifyDeadlineMax" -}}
{{- printf "%ss" (include "maul.previewVerifyDeadlineSeconds" .) -}}
{{- end }}
{{- if include "maul.previewVerification" . }}
{{- $pcSA := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "maul.serviceAccountName" (dict "root" . "name" "preview-controller" "vals" .Values.previewController)) }}
{{- $icSA := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "maul.serviceAccountName" (dict "root" . "name" "intent-controller" "vals" .Values.intentController)) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-verifications
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [maul.run]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE, DELETE]
              resources: [previewverifications, previewverifications/status]
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
    validations:
        # The garbage collector deletes a request with its Intent (and
        # updates one under foreground deletion), the namespace controller
        # with its namespace; both run as their own ServiceAccounts, or as
        # the controller manager where it does not use per-controller
        # credentials.
        - expression: >-
              request.?subResource.orValue('') == 'status'
                ? request.userInfo.username == '{{ $pcSA }}'
                : request.userInfo.username in ['{{ $icSA }}',
                    'system:serviceaccount:kube-system:generic-garbage-collector',
                    'system:serviceaccount:kube-system:namespace-controller',
                    'system:kube-controller-manager']
          message: intent-controller writes verification requests; preview-controller writes their results
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-verifications
spec:
    policyName: maul-preview-verifications
    validationActions: [Deny]
{{- if include "maul.previewTools" . }}
---
# The slot tool pod's records (SPEC Q8, Q7): preview-controller writes each
# verification's full ledger and its verified screenshots to ConfigMaps in
# the release namespace, <verification>-ledger and <verification>-evidence,
# owned by that PreviewVerification so they go with it. Its configmaps grant
# there is create and delete only (no read), but the namespace also holds
# every Finding's transcripts and the controllers' settings: this holds it to
# its own two kinds of record. Fail closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: maul-preview-ledgers
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [""]
              apiVersions: [v1]
              operations: [CREATE, UPDATE, DELETE]
              resources: [configmaps]
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
    matchConditions:
        - name: preview-controller
          expression: "request.userInfo.username == '{{ $pcSA }}'"
    variables:
        - name: cm
          expression: "request.operation == 'DELETE' ? oldObject : object"
    validations:
        - expression: >-
              (variables.cm.metadata.name.endsWith('-ledger') || variables.cm.metadata.name.endsWith('-evidence')) &&
              variables.cm.metadata.?ownerReferences.orValue([]).exists(r,
                r.apiVersion == 'maul.run/v1alpha1' && r.kind == 'PreviewVerification' &&
                r.?controller.orValue(false) &&
                variables.cm.metadata.name in [r.name + '-ledger', r.name + '-evidence'])
          message: preview-controller writes only a PreviewVerification's own ledger and evidence ConfigMaps
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: maul-preview-ledgers
spec:
    policyName: maul-preview-ledgers
    validationActions: [Deny]
{{- end }}
{{- end }}
