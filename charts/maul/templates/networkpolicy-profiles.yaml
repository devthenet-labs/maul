{{/*
Copyright 2026 Bitwise Media Group Ltd.
SPDX-License-Identifier: MIT

The agent side of the operator's network profiles: one NetworkPolicy per
agent.networkProfiles entry, in the agent namespace, selecting only agent
pods labelled for that profile and allowing them exactly one more
destination, the egress proxy on that profile's port. Separate objects, so
no existing policy changes. No DNS rule (under dns none the job controllers
pin the proxy's Service name in the pod's hosts file) and no ipBlock;
ingress stays default-deny. Plain networking.k8s.io/v1 only: mode none,
gke and cilium all enforce it (Cilium unions it with the per-harness
CiliumNetworkPolicy), and mode istio is refused by maul.egressProxyGuard.
*/}}
{{- if include "maul.egressProxyEnabled" . }}
{{- $profiles := .Values.agent.networkProfiles }}
{{- $prefix := include "maul.networkProfileLabelPrefix" . }}
{{- range $pname := keys $profiles | sortAlpha }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "maul.fullname" $ }}-agents-network-{{ $pname }}
    namespace: {{ $.Values.agent.namespace }}
    labels:
        {{- include "maul.labels" (dict "root" $ "name" "maul-agents") | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" $) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    podSelector:
        matchLabels:
            {{- include "maul.agentPodSelector" $ | nindent 12 }}
            {{ $prefix }}{{ $pname }}: "true"
    policyTypes: [Egress]
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: {{ $.Release.Namespace }}
                podSelector:
                    matchLabels:
                        app.kubernetes.io/name: egress-proxy
          ports:
              - protocol: TCP
                port: {{ int (index $profiles $pname).port }}
{{- end }}
{{- end }}
