{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: intents.maul.run
spec:
  group: maul.run
  names:
    categories:
    - maul
    kind: Intent
    listKind: IntentList
    plural: intents
    singular: intent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.issue.url
      name: Issue
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - description: The intent's pull requests, one per repository it changed
      jsonPath: .status.pullRequests[*].url
      name: PRs
      type: string
    - jsonPath: .status.revisions
      name: Revisions
      type: integer
    - description: Total spend in micro-USD
      jsonPath: .status.usage.costMicroUSD
      name: Cost
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Intent is one unit of human-requested development work: an issue in a
          Project's intent repository carried from plan, through a human approval,
          to built pull requests and their merge. It is the state machine for that
          work (a local phase enum, single writer intent-controller), owns one
          immutable IntentRun per agent attempt, and expires on a TTL after
          completion. The issue is the human-facing projection. Its name is always
          IntentName(spec.project, spec.issue.number) — <project>-<issue>, at most 33
          characters — so the project reconciler's create is idempotent per issue and
          every name derived from it fits the name budget. (The rule compares the
          issue number as an integer: concatenating string(int), whose size CEL
          cannot bound, would exceed the rule cost budget.)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IntentSpec identifies one intent issue. intent-controller writes it once,
              at creation; it is immutable except spec.suspend, which humans may patch
              with the native verb (CEL-enforced per field, so a mutation of any other
              field is refused at admission).
            properties:
              issue:
                description: Issue is the intent issue.
                properties:
                  number:
                    description: |-
                      Number of the issue, at most seven digits (MaxIntentIssueNumber): it
                      is part of every Intent and IntentRun name (see the name budget).
                    format: int64
                    maximum: 9999999
                    minimum: 1
                    type: integer
                  repository:
                    description: |-
                      Repository is the https URL of the intent repository, copied from the
                      Project's spec.intentRepository at creation.
                    maxLength: 256
                    minLength: 1
                    pattern: ^https://[^/\s@?#]+/[^/\s?#]+/[^/\s?#]+$
                    type: string
                  url:
                    description: URL is the issue's html URL, for display.
                    maxLength: 512
                    pattern: ^https://
                    type: string
                required:
                - number
                - repository
                type: object
                x-kubernetes-validations:
                - message: spec.issue is immutable
                  rule: self == oldSelf
              project:
                description: |-
                  Project names the Project this intent belongs to (the Project whose
                  trigger label the issue carries); at most MaxProjectNameLength, like
                  the Project's own name.
                maxLength: 25
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.project is immutable
                  rule: self == oldSelf
              requestedBy:
                description: RequestedBy is who applied the trigger label, from the
                  issue events.
                properties:
                  at:
                    description: At is the labeled event's created_at.
                    format: date-time
                    type: string
                  eventID:
                    description: EventID is the GitHub id of the labeled issue event.
                    format: int64
                    minimum: 1
                    type: integer
                  login:
                    description: |-
                      Login of the actor that applied the trigger label. It may be anyone,
                      including a Bot ("<name>[bot]"): the intent reconciler decides
                      authority from it, and a non-approver's trigger closes the Intent.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*(\[bot\])?$
                    type: string
                  userID:
                    description: |-
                      UserID is GitHub's numeric id of the actor: their identity, which the
                      login is not (design L1). Zero on an Intent created before it was
                      recorded.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - at
                - eventID
                - login
                type: object
                x-kubernetes-validations:
                - message: spec.requestedBy is immutable
                  rule: self == oldSelf
              suspend:
                description: |-
                  Suspend pauses the intent (human-written): no run is launched and
                  nothing is written to GitHub for it until cleared. Running Jobs
                  finish; a build that finishes meanwhile holds its push (commit and
                  branch) until then, without its slot of the run pool, and loses it if
                  the suspension outlasts the finished Job's TTL (the run ends
                  hold_expired, which does not count as an attempt).
                type: boolean
            required:
            - issue
            - project
            - requestedBy
            type: object
          status:
            description: |-
              IntentStatus is the intent's observed state. Written only by
              intent-controller's intent reconciler.
            properties:
              acceptance:
                description: |-
                  Acceptance is the approved plan's acceptance criteria, re-parsed from
                  the digest-checked plan bytes once review begins, and the manual
                  criteria approvers accepted since.
                properties:
                  accepted:
                    description: Accepted are the approvers' /maul accept records,
                      oldest first.
                    items:
                      description: |-
                        AcceptanceRecord is one approver's /maul accept of a manual, command or
                        quarantined criterion. It holds only at the combined change it was given
                        at: once the heads move it is shown as not re-checked.
                      properties:
                        at:
                          description: At is the command comment's created_at.
                          format: date-time
                          type: string
                        by:
                          description: By is the approver's login, for display.
                          maxLength: 64
                          minLength: 1
                          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                          type: string
                        byID:
                          description: 'ByID is GitHub''s numeric id of the approver:
                            the identity.'
                          format: int64
                          minimum: 1
                          type: integer
                        commentID:
                          description: CommentID is GitHub's id of the comment carrying
                            the command.
                          format: int64
                          minimum: 1
                          type: integer
                        headSetDigest:
                          description: HeadSetDigest is the combined change the acceptance
                            was given at.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        heads:
                          description: Heads are that combined change's short commit
                            SHAs, for display.
                          items:
                            pattern: ^[0-9a-f]{7,40}$
                            type: string
                          maxItems: 4
                          type: array
                          x-kubernetes-list-type: atomic
                        id:
                          description: ID of the accepted criterion.
                          pattern: ^[a-z][a-z0-9-]{0,31}$
                          type: string
                        note:
                          description: |-
                            Note is the text the approver wrote after the command, if any. It
                            is untrusted and shown only through untrusted.Visible.
                          maxLength: 1024
                          type: string
                      required:
                      - at
                      - by
                      - byID
                      - commentID
                      - headSetDigest
                      - id
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  checks:
                    description: |-
                      Checks names the check store of the approved plan revision; unset
                      until a first check is saved.
                    properties:
                      configMap:
                        description: ConfigMap names the store.
                        maxLength: 253
                        minLength: 1
                        type: string
                      count:
                        description: Count is how many checks the store holds.
                        format: int32
                        maximum: 40
                        minimum: 0
                        type: integer
                      digest:
                        description: |-
                          Digest is the digest of the stored checks: what a
                          PreviewVerification's checksDigest must equal.
                        pattern: ^sha256:[0-9a-f]{64}$
                        type: string
                    required:
                    - configMap
                    - count
                    - digest
                    type: object
                  criteria:
                    description: |-
                      Criteria are the approved criteria in plan order; empty when the plan
                      declared none.
                    items:
                      description: AcceptanceCriterion is one acceptance criterion
                        of an approved plan.
                      properties:
                        argv:
                          description: Argv is a command criterion's argument vector,
                            run without a shell.
                          items:
                            maxLength: 200
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        expect:
                          description: Expect is what a command criterion's run must
                            show.
                          properties:
                            bodyContains:
                              description: BodyContains is a string the response body
                                must contain.
                              maxLength: 200
                              type: string
                            exit:
                              description: Exit is a command's expected exit code.
                              format: int32
                              type: integer
                            headers:
                              additionalProperties:
                                x-kubernetes-preserve-unknown-fields: true
                              description: Headers maps response header names to what
                                each must hold.
                              maxProperties: 4
                              type: object
                            json:
                              additionalProperties:
                                x-kubernetes-preserve-unknown-fields: true
                              description: |-
                                JSON maps RFC 6901 pointers into the response body to what each must
                                hold.
                              maxProperties: 8
                              type: object
                            status:
                              description: 'Status is the expected HTTP status: one
                                code or a list of codes.'
                              x-kubernetes-preserve-unknown-fields: true
                            stdoutContains:
                              description: StdoutContains is a string a command's
                                stdout must contain.
                              maxLength: 200
                              type: string
                            stdoutJSON:
                              additionalProperties:
                                x-kubernetes-preserve-unknown-fields: true
                              description: |-
                                StdoutJSON maps RFC 6901 pointers into a command's JSON stdout to what
                                each must hold.
                              maxProperties: 8
                              type: object
                          type: object
                        id:
                          description: ID names the criterion, unique within its plan.
                          pattern: ^[a-z][a-z0-9-]{0,31}$
                          type: string
                        in:
                          description: In is where a command criterion runs.
                          properties:
                            component:
                              description: |-
                                Component is a previewed repository key: the command runs in that
                                component's runtime image inside the slot.
                              maxLength: 16
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            repository:
                              description: |-
                                Repository is a Project repository key: the command runs in that
                                repository's accepted agent image, without a model.
                              maxLength: 16
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: in names exactly one of component and repository
                            rule: has(self.component) != has(self.repository)
                        kind:
                          description: Kind is how the criterion is checked.
                          enum:
                          - http
                          - command
                          - manual
                          type: string
                        reason:
                          description: Reason says why a manual criterion needs a
                            human.
                          maxLength: 120
                          pattern: ^[^\r\n]*$
                          type: string
                        statement:
                          description: Statement is the approved one-line statement
                            of what must hold.
                          maxLength: 200
                          minLength: 1
                          pattern: ^[^\r\n]*$
                          type: string
                        steps:
                          description: |-
                            Steps are an http criterion's requests, in order (the shorthand of a
                            bare request and expect is normalised into one step).
                          items:
                            description: |-
                              AcceptanceStep is one request of an http criterion and what its response
                              must show.
                            properties:
                              capture:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Capture names values of the response (RFC 6901 pointers into its JSON
                                  body) that later steps reference by name (the capture placeholder).
                                maxProperties: 4
                                type: object
                                x-kubernetes-validations:
                                - message: capture names are ^[a-z][a-z0-9]{0,15}$
                                    and their pointers at most 256 characters
                                  rule: self.all(k, k.matches('^[a-z][a-z0-9]{0,15}$')
                                    && size(self[k]) <= 256)
                              expect:
                                description: Expect is what the response must show.
                                properties:
                                  bodyContains:
                                    description: BodyContains is a string the response
                                      body must contain.
                                    maxLength: 200
                                    type: string
                                  exit:
                                    description: Exit is a command's expected exit
                                      code.
                                    format: int32
                                    type: integer
                                  headers:
                                    additionalProperties:
                                      x-kubernetes-preserve-unknown-fields: true
                                    description: Headers maps response header names
                                      to what each must hold.
                                    maxProperties: 4
                                    type: object
                                  json:
                                    additionalProperties:
                                      x-kubernetes-preserve-unknown-fields: true
                                    description: |-
                                      JSON maps RFC 6901 pointers into the response body to what each must
                                      hold.
                                    maxProperties: 8
                                    type: object
                                  status:
                                    description: 'Status is the expected HTTP status:
                                      one code or a list of codes.'
                                    x-kubernetes-preserve-unknown-fields: true
                                  stdoutContains:
                                    description: StdoutContains is a string a command's
                                      stdout must contain.
                                    maxLength: 200
                                    type: string
                                  stdoutJSON:
                                    additionalProperties:
                                      x-kubernetes-preserve-unknown-fields: true
                                    description: |-
                                      StdoutJSON maps RFC 6901 pointers into a command's JSON stdout to what
                                      each must hold.
                                    maxProperties: 8
                                    type: object
                                type: object
                              name:
                                description: Name labels the step for display.
                                maxLength: 32
                                pattern: ^[a-z][a-z0-9-]*$
                                type: string
                              request:
                                description: Request is what the tester sends.
                                properties:
                                  body:
                                    description: Body is a literal request body.
                                    maxLength: 2048
                                    type: string
                                  headers:
                                    additionalProperties:
                                      type: string
                                    description: Headers sent with the request.
                                    maxProperties: 8
                                    type: object
                                    x-kubernetes-validations:
                                    - message: header names are ^[A-Za-z0-9-]{1,64}$
                                        and their values at most 256 characters
                                      rule: self.all(k, k.matches('^[A-Za-z0-9-]{1,64}$')
                                        && size(self[k]) <= 256)
                                  json:
                                    description: JSON is a JSON request body.
                                    x-kubernetes-preserve-unknown-fields: true
                                  method:
                                    description: Method of the request.
                                    enum:
                                    - GET
                                    - HEAD
                                    - POST
                                    - PUT
                                    - PATCH
                                    - DELETE
                                    type: string
                                  path:
                                    description: Path, with its query, starting with
                                      exactly one slash.
                                    maxLength: 512
                                    minLength: 1
                                    pattern: ^/([^/].*)?$
                                    type: string
                                required:
                                - method
                                - path
                                type: object
                            required:
                            - request
                            type: object
                          maxItems: 8
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        target:
                          description: Target is the previewed repository key an http
                            criterion is sent to.
                          maxLength: 16
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        timeout:
                          description: Timeout bounds a command criterion's run (a
                            Go duration, at most 10m).
                          maxLength: 16
                          type: string
                      required:
                      - id
                      - kind
                      - statement
                      type: object
                      x-kubernetes-validations:
                      - message: an http criterion names its target and its steps
                        rule: self.kind != 'http' || (has(self.target) && has(self.steps))
                      - message: a command criterion names where it runs (in) and
                          its argv
                        rule: self.kind != 'command' || (has(self.__in__) && has(self.argv))
                      - message: 'a manual criterion is checked by a human: no steps
                          and no argv'
                        rule: self.kind != 'manual' || (!has(self.steps) && !has(self.argv))
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  digest:
                    description: |-
                      Digest is the digest of the full criteria list, manual criteria
                      included (acceptance.Digest): what every PreviewVerification's
                      criteriaDigest must equal.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  outcomes:
                    description: Outcomes are the approved outcomes in plan order
                      (the evaluator).
                    items:
                      description: |-
                        AcceptanceOutcome is one outcome of an approved plan: a statement of what
                        must hold, the issue line it answers, and whether a human checks it.
                      properties:
                        from:
                          description: From quotes the issue line the outcome answers.
                          maxLength: 300
                          pattern: ^[^\r\n]*$
                          type: string
                        id:
                          description: ID names the outcome, unique within its plan.
                          pattern: ^[a-z][a-z0-9-]{0,31}$
                          type: string
                        kind:
                          description: Kind is change or keep; unset is change.
                          enum:
                          - change
                          - keep
                          type: string
                        manual:
                          description: Manual marks an outcome only a human can check
                            (/maul accept).
                          type: boolean
                        outcome:
                          description: Outcome is the approved one-line statement
                            of what must hold.
                          maxLength: 500
                          minLength: 1
                          pattern: ^[^\r\n]*$
                          type: string
                        reason:
                          description: Reason says why a manual outcome needs a human.
                          maxLength: 120
                          pattern: ^[^\r\n]*$
                          type: string
                      required:
                      - id
                      - outcome
                      type: object
                    maxItems: 20
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  outcomesDigest:
                    description: |-
                      OutcomesDigest is the digest of the full outcome list, manual
                      outcomes included: what every outcome PreviewVerification's
                      outcomesDigest must equal.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  planRevision:
                    description: PlanRevision is the approved plan revision the criteria
                      are from.
                    format: int32
                    maximum: 999
                    minimum: 1
                    type: integer
                  redCleared:
                    description: |-
                      RedCleared are the checks saved red (SavedCheck.Expect fail) that
                      have since replayed green, each with the verification whose replay
                      did. Until one has, only a run red by the assertion it was saved
                      failing reproduces its defect. A clearance counts from the round
                      after the one that earned it, so that round is judged, and its fix
                      decided, on the same facts.
                    items:
                      description: RedClearance is a check saved red that replayed
                        green.
                      properties:
                        digest:
                          description: Digest is the check's digest.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        verification:
                          description: Verification names the PreviewVerification
                            whose replay passed it.
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - digest
                      - verification
                      type: object
                    maxItems: 40
                    type: array
                    x-kubernetes-list-type: atomic
                  reviews:
                    description: |-
                      Reviews cache the check reviewer's answers, so a check is reviewed
                      once per outcome statement.
                    items:
                      description: |-
                        CheckReviewRecord is one cached check review: the answer a checkreview
                        run gave for one check against one outcome statement, keyed by both
                        digests, so a changed check or outcome is reviewed again.
                      properties:
                        answer:
                          description: Answer is the reviewer's.
                          enum:
                          - proves
                          - does_not_prove
                          - unclear
                          type: string
                        checkDigest:
                          description: CheckDigest is the reviewed check's digest.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        expect:
                          description: |-
                            Expect is fail when the reviewer was asked the red question: the
                            check failed, and the evaluator proposed it to show a defect. Only
                            such a review lets a check saved red support a fail.
                          enum:
                          - fail
                          type: string
                        failedAssertion:
                          maxLength: 512
                          type: string
                        failedStep:
                          description: |-
                            FailedStep and FailedAssertion are, for the red question, the
                            failing assertion it judged: a red review counts only for that one.
                          format: int32
                          maximum: 64
                          minimum: 1
                          type: integer
                        outcomeDigest:
                          description: OutcomeDigest is the digest of the outcome
                            it was reviewed against.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        run:
                          description: Run is the checkreview IntentRun that answered.
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - answer
                      - checkDigest
                      - outcomeDigest
                      - run
                      type: object
                    maxItems: 80
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - digest
                - planRevision
                type: object
                x-kubernetes-validations:
                - message: an approved plan declares criteria or outcomes, never both
                  rule: '!has(self.criteria) || !has(self.outcomes)'
                - message: outcomes and outcomesDigest are set together
                  rule: has(self.outcomes) == has(self.outcomesDigest)
              activeRun:
                description: |-
                  ActiveRun points at the IntentRun currently holding the run lease
                  (the lease itself is the deterministic IntentRun create).
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              approval:
                description: |-
                  Approval is the accepted approval of the current plan; nil until one
                  is accepted, and cleared by a replan.
                properties:
                  at:
                    description: At is the approving action's created_at, as GitHub
                      reports it.
                    format: date-time
                    type: string
                  by:
                    description: |-
                      By is the approver's login. Only an approver's approval is ever
                      accepted, and a Bot never is, so the pattern admits no "[bot]".
                    maxLength: 64
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                    type: string
                  byID:
                    description: |-
                      ByID is GitHub's numeric id of the approver: their identity, which the
                      login is not (design L1). Zero on an approval recorded before it was.
                    format: int64
                    minimum: 1
                    type: integer
                  eventID:
                    description: |-
                      EventID is GitHub's id of the approving action, in Source's id space:
                      the labeled issue event for the approve label, or the comment
                      carrying /maul approve.
                    format: int64
                    minimum: 1
                    type: integer
                  inputDigest:
                    description: |-
                      InputDigest is the digest of the issue snapshot the plan was made
                      from.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  planDigest:
                    description: PlanDigest is the digest of the plan approved.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  planRevision:
                    description: |-
                      PlanRevision is the plan revision approved; the build runs it starts
                      take it as their round.
                    format: int32
                    maximum: 999
                    minimum: 1
                    type: integer
                  source:
                    description: |-
                      Source of the approving action — the approve label, or a /maul
                      approve comment — and so which id space EventID is in.
                    enum:
                    - label
                    - command
                    type: string
                required:
                - at
                - by
                - eventID
                - inputDigest
                - planDigest
                - planRevision
                - source
                type: object
              branch:
                description: |-
                  Branch is the branch every pull request of the intent is opened from:
                  maul-intent/<intent>, created once and then only fast-forwarded.
                maxLength: 255
                pattern: ^maul-intent/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              checkFixes:
                description: |-
                  CheckFixes counts check-fix rounds, against the Project's
                  maxCheckFixes (slice 1b).
                format: int32
                maximum: 999
                minimum: 0
                type: integer
              checksObservedHeadSHA:
                description: |-
                  ChecksObservedHeadSHA is a pushed PR head whose named checks settled,
                  or whose check-poll timeout elapsed without an observed failure. Once
                  recorded, this head is not polled again; a new pushed head resets it.
                  This Intent-level pair is deprecated in favour of the per-PR pair
                  (pullRequests[].checksObservedHeadSHA and
                  checksObservedProjectGeneration), which a multi-repository intent
                  needs; it is kept so a one-PR intent recorded before the move keeps
                  its observation, and is then read only as that fallback.
                type: string
              checksObservedProjectGeneration:
                description: |-
                  ChecksObservedProjectGeneration is the Project generation whose check
