                - repository
                x-kubernetes-list-type: map
              revisions:
                description: |-
                  Revisions counts completed review-driven revise rounds, against the
                  Project's maxRevisions.
                format: int32
                maximum: 999
                minimum: 0
                type: integer
              roundNoticesThrough:
                description: |-
                  RoundNoticesThrough is the last contiguous revise round whose PR
                  notice was posted or adopted by marker. Zero also recovers notices
                  lost by older controllers. Only intent-controller writes this cursor;
                  pending deliveries survive phase changes and prevent TTL expiry.
                format: int32
                maximum: 999
                minimum: 0
                type: integer
              rounds:
                description: |-
                  Rounds is the revise-round ordinal: how many revise-stage rounds have
                  started, whatever their trigger (review, command or checks) and
                  whatever their outcome — a failed round counts. A new round's runs
                  take spec.round = Rounds+1, and the status write that records the
                  round's first run as ActiveRun advances Rounds to it, so a restart
                  between that create and that write recomputes the same name and
                  adopts the run rather than starting the round twice. Retries and the
                  head_moved re-run are further attempts of the same round. Revisions
                  and CheckFixes count subsets of these rounds (slice 1b).
                format: int32
                maximum: 999
                minimum: 0
                type: integer
              tracking:
                description: Tracking locates the status comment on the intent issue.
                properties:
                  statusCommentID:
                    description: |-
                      StatusCommentID is GitHub's id of the status comment, posted exactly
                      once (marker <!-- maul:intent <project>/<issue> -->) and edited
                      thereafter.
                    format: int64
                    minimum: 0
                    type: integer
                  statusDigest:
                    description: |-
                      StatusDigest is the sha256 of the body last written to it, so an
                      unchanged status is never re-written.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                type: object
              usage:
                description: Usage totals the spend of every run.
                properties:
                  cacheCreationTokens:
                    description: CacheCreationTokens written to prompt cache.
                    format: int64
                    minimum: 0
                    type: integer
                  cacheReadTokens:
                    description: CacheReadTokens read from prompt cache.
                    format: int64
                    minimum: 0
                    type: integer
                  costMicroUSD:
                    description: |-
                      CostMicroUSD is the summed harness-reported cost in micro-USD,
                      checked against the Project's maxCostMicroUSD before every launch.
                    format: int64
                    minimum: 0
                    type: integer
                  inputTokens:
                    description: InputTokens consumed.
                    format: int64
                    minimum: 0
                    type: integer
                  outputTokens:
                    description: OutputTokens produced.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              verification:
                description: |-
                  Verification is the state of the acceptance verification of the
                  intent's combined change.
                properties:
                  anomalies:
                    description: Anomalies are the latest round's look-around anomalies.
                    items:
                      description: |-
                        AnomalyRecord is one look-around anomaly the evaluator reported, with the
                        ledger entries that show it: it downgrades the hand-off, never starts a
                        fix. Summary and route are the evaluator's, untrusted.
                      properties:
                        ledger:
                          description: Ledger are the entries cited, by seq.
                          items:
                            format: int32
                            maximum: 512
                            minimum: 1
                            type: integer
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: atomic
                        route:
                          description: Route it was seen on.
                          maxLength: 300
                          type: string
                        summary:
                          description: Summary of the anomaly.
                          maxLength: 600
                          minLength: 1
                          type: string
                      required:
                      - summary
                      type: object
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  attempt:
                    description: Attempt is the latest attempt within it.
                    format: int32
                    maximum: 3
                    minimum: 0
                    type: integer
                  autoFix:
                    description: AutoFix is the automatic verify-fix latch.
                    properties:
                      rearm:
                        description: Rearm is the approver's /maul verify fix that
                          last re-armed it.
                        properties:
                          at:
                            description: At is the command comment's created_at.
                            format: date-time
                            type: string
                          by:
                            description: By is the approver's login, for display.
                            maxLength: 64
                            minLength: 1
                            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                            type: string
                          byID:
                            description: ByID is GitHub's numeric id of the approver.
                            format: int64
                            minimum: 1
                            type: integer
                          round:
                            description: |-
                              Round is status.rounds when re-armed: only a human round after it
                              halts the latch again.
                            format: int32
                            maximum: 999
                            minimum: 0
                            type: integer
                        required:
                        - at
                        - by
                        - byID
                        - round
                        type: object
                      reason:
                        description: Reason the latch halted.
                        enum:
                        - HumanReview
                        - HumanCommand
                        - HumanPush
                        - MaxVerifyFixes
                        - RepeatedFailure
                        - CostCeiling
                        - CriterionError
                        - NoOpenPR
                        - FixFoundNoDefect
                        - HumanStop
                        type: string
                      since:
                        description: Since is when the latch took its state.
                        format: date-time
                        type: string
                      state:
                        description: State of the latch; unset is Armed.
                        enum:
                        - Armed
                        - Halted
                        type: string
                      stop:
                        description: |-
                          Stop is the approver's /maul verify stop that halted it (reason
                          HumanStop); a re-arm clears it.
                        properties:
                          at:
                            description: At is the command comment's created_at.
                            format: date-time
                            type: string
                          by:
                            description: By is the approver's login, for display.
                            maxLength: 64
                            minLength: 1
                            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                            type: string
                          byID:
                            description: ByID is GitHub's numeric id of the approver.
                            format: int64
                            minimum: 1
                            type: integer
                          commentID:
                            description: CommentID is GitHub's id of the comment carrying
                              the command.
                            format: int64
                            minimum: 1
                            type: integer
                        required:
                        - at
                        - by
                        - byID
                        - commentID
                        type: object
                    type: object
                  automatic:
                    description: |-
                      Automatic counts the verifications started without a request in the
                      current plan revision, against the Project's maxVerifications.
                    format: int32
                    maximum: 999
                    minimum: 0
                    type: integer
                  cancelRun:
                    description: |-
                      CancelRun names a Pending verify-fix IntentRun a human round
                      overtook: the run scheduler settles it unlaunched instead of creating
                      its Job.
                    maxLength: 63
                    type: string
                  disputed:
                    description: |-
                      Disputed are the digests of the saved checks the evaluator disputed,
                      awaiting a replay round once their replacements are confirmed and
                      reviewed.
                    items:
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    maxItems: 40
                    type: array
                    x-kubernetes-list-type: set
                  evaluationCostMicroUSD:
                    description: |-
                      EvaluationCostMicroUSD is what the intent's evaluate and checkreview
                      runs have spent, against the Project's maxEvaluateCostMicroUSD.
                    format: int64
                    maximum: 1000000000000
                    minimum: 0
                    type: integer
                  failed:
                    description: Failed counts the automatable criteria that failed.
                    format: int32
                    maximum: 20
                    minimum: 0
                    type: integer
                  failing:
                    description: Failing are the criteria that did not pass, in plan
                      order.
                    items:
                      description: CriterionState is the judged state of one criterion
                        that did not pass.
                      properties:
                        fingerprint:
                          description: |-
                            Fingerprint is the failure's signature over status codes, transport
                            error classes and matched-expectation bits only, never a value.
                          maxLength: 128
                          pattern: ^maul-verify-fingerprint/[0-9]+:[0-9a-f]{64}$
                          type: string
                        id:
                          description: ID of the criterion.
                          pattern: ^[a-z][a-z0-9-]{0,31}$
                          type: string
                        outcome:
                          description: Outcome judged.
                          enum:
                          - pass
                          - quarantined
                          - fail
                          type: string
                      required:
                      - id
                      - outcome
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  firstGreenAt:
                    description: |-
                      FirstGreenAt is when CI first went green at the first PR heads: the
                      start of the handoffMax clock.
                    format: date-time
                    type: string
                  handoff:
                    description: Handoff is the hand-off of the preview link to humans.
                    properties:
                      mode:
                        description: Mode in force for the intent.
                        enum:
                        - gated
                        - early
                        type: string
                      reason:
                        description: Reason is why.
                        enum:
                        - ready
                        - unconfirmed
                        - out-of-time
                        - human
                        - command
                        - early
                        - evaluator-unverified
                        type: string
                      released:
                        description: Released reports that the preview link has been
                          handed over.
                        type: boolean
                      releasedAt:
                        description: ReleasedAt is when.
                        format: date-time
                        type: string
                    required:
                    - mode
                    type: object
                    x-kubernetes-validations:
                    - message: a released hand-off records when and why
                      rule: '!has(self.released) || !self.released || (has(self.releasedAt)
                        && has(self.reason))'
                  headSetDigest:
                    description: HeadSetDigest is the combined change the state is
                      about.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  heads:
                    description: Heads are that combined change's components and revisions.
                    items:
                      description: |-
                        VerificationHead is one previewed component's revision in the combined
                        change a verification ran against: what the Preview spec runs.
                      properties:
                        component:
                          description: Component is the previewed repository key.
                          maxLength: 16
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        repository:
                          description: Repository is the repository's https URL.
                          maxLength: 256
                          minLength: 1
                          pattern: ^https://[^/\s@?#]+/[^/\s?#]+/[^/\s?#]+$
                          type: string
                        revision:
                          description: Revision is the full commit SHA the component
                            runs.
                          pattern: ^[0-9a-f]{40}$
                          type: string
                      required:
                      - component
                      - repository
                      - revision
                      type: object
                    maxItems: 4
                    type: array
                    x-kubernetes-list-map-keys:
                    - component
                    x-kubernetes-list-type: map
                  infraRetries:
                    description: |-
                      InfraRetries counts the attempts maul's own machinery failed in the
                      current round.
                    format: int32
                    maximum: 999
                    minimum: 0
                    type: integer
                  lastAutomaticAt:
                    description: LastAutomaticAt is when the latest of them started.
                    format: date-time
                    type: string
                  manualAccepted:
                    description: |-
                      ManualAccepted counts the manual criteria accepted at the current
                      heads.
                    format: int32
                    maximum: 20
                    minimum: 0
                    type: integer
                  manualOpen:
                    description: |-
                      ManualOpen counts the manual criteria not accepted at the current
                      heads.
                    format: int32
                    maximum: 20
                    minimum: 0
                    type: integer
                  noDefect:
                    description: |-
                      NoDefect is the latest acceptance-fix round's conclusion that the code
                      has no defect, kept apart from the auto-fix latch: it stands whatever
                      halted the latch, until the next fix round, the heads it judged move,
                      or a new plan revision.
                    properties:
                      at:
                        description: At is when the round completed.
                        format: date-time
                        type: string
                      headSetDigest:
                        description: |-
                          HeadSetDigest is the combined change it was concluded about: it is
                          shown only while the verification is about the same one.
                        pattern: ^sha256:[0-9a-f]{64}$
                        type: string
                      reason:
                        description: Reason is the agent's account of why the verification
                          failed.
                        maxLength: 1024
                        type: string
                      run:
                        description: Run is the IntentRun that concluded it.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - at
                    - run
                    type: object
                  notRun:
                    description: NotRun counts the criteria this slice cannot run
                      yet.
                    format: int32
                    maximum: 20
                    minimum: 0
                    type: integer
                  outcomes:
                    description: |-
                      Outcomes are the decided results of the approved outcomes, in plan
                      order (the evaluator).
                    items:
                      description: OutcomeResult is the decided result of one approved
                        outcome.
                      properties:
                        basis:
                          description: |-
                            Basis is the digest of the saved check the result rests on; unset
                            when none does.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        id:
                          description: ID of the outcome.
                          pattern: ^[a-z][a-z0-9-]{0,31}$
                          type: string
                        line:
                          description: |-
                            Line is the maul-rendered one-line description of the basis check
                            (its steps and assertions in maul's words).
                          maxLength: 1024
                          pattern: ^[^\r\n]*$
                          type: string
                        reason:
                          description: |-
                            Reason says why the result is not passed. It may quote the
                            evaluator, so it is untrusted and shown only through the templates'
                            sanitising.
                          maxLength: 600
                          type: string
                        result:
                          description: Result decided.
                          enum:
                          - passed
                          - failed
                          - unsure
                          - quarantined
                          - accepted
                          type: string
                      required:
                      - id
                      - result
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  passed:
                    description: |-
                      The counters and lists below count criteria, or outcomes under the
                      evaluator: their bounds are the larger list's (20 outcomes).

                      Passed counts the automatable criteria that passed.
                    format: int32
                    maximum: 20
                    minimum: 0
                    type: integer
                  previewWaitSince:
                    description: |-
                      PreviewWaitSince is when the verification last began waiting for a
                      live Preview at its heads (WaitingForPreview). A wait is bounded:
                      past it the verification is Unavailable (PreviewNotLive) until the
                      Preview is live.
                    format: date-time
                    type: string
                  quarantined:
                    description: Quarantined counts the criteria that passed only
                      on retry.
                    format: int32
                    maximum: 20
                    minimum: 0
                    type: integer
                  quarantinedIDs:
                    description: QuarantinedIDs are the criteria that passed only
                      on retry.
                    items:
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: set
                  ref:
                    description: Ref is the latest PreviewVerification, pinned by
                      UID.
                    properties:
                      name:
                        description: Name of the referent.
                        minLength: 1
                        type: string
                      uid:
                        description: UID of the referent at the time the reference
                          was written.
                        type: string
                    required:
                    - name
                    type: object
                  requested:
                    description: Requested is an approver's pending /maul verify.
                    properties:
                      at:
                        description: At is the command comment's created_at.
                        format: date-time
                        type: string
                      by:
                        description: By is the approver's login, for display.
                        maxLength: 64
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                        type: string
                      byID:
                        description: ByID is GitHub's numeric id of the approver.
                        format: int64
                        minimum: 1
                        type: integer
                      commentID:
                        description: CommentID is GitHub's id of the comment carrying
                          the command.
                        format: int64
                        minimum: 1
                        type: integer
                      fix:
                        description: Fix also re-arms automatic fixes (/maul verify
                          fix).
                        type: boolean
                      reset:
                        description: Reset also restarts the Preview's parts first
                          (/maul verify --reset).
                        type: boolean
                    required:
                    - at
                    - by
                    - byID
                    - commentID
                    type: object
                  reset:
                    description: Reset is the last /maul verify --reset.
                    properties:
                      at:
                        description: At is the command comment's created_at.
                        format: date-time
                        type: string
                      by:
                        description: By is the approver's login, for display.
                        maxLength: 64
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                        type: string
                      byID:
                        description: ByID is GitHub's numeric id of the approver.
                        format: int64
                        minimum: 1
                        type: integer
                      generation:
                        description: Generation counts resets; it never decreases.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  round:
                    description: Round is the latest verification round.
                    format: int32
                    maximum: 999
                    minimum: 0
                    type: integer
                  state:
                    description: State of the verification.
                    enum:
                    - NotDeclared
                    - "Off"
                    - WaitingForCI
                    - WaitingForPreview
                    - Verifying
                    - Passed
                    - Failing
                    - Fixing
                    - Exhausted
                    - NeedsReplan
                    - Unavailable
                    - Evaluating
                    - Unconfirmed
                    type: string
                  unavailableReason:
                    description: |-
                      UnavailableReason says why the state is Unavailable: PreviewNotLive
                      when the Preview was not live at the heads within the bound (Failed,
                      expired, or never served); empty when maul's own machinery failed
                      every attempt. Read only with state Unavailable.
                    enum:
                    - PreviewNotLive
                    type: string
                type: object
              verifyFixes:
                description: |-
                  VerifyFixes counts completed verify-fix rounds, for display. The
                  count held against the Project's maxVerifyFixes is derived from the
                  Intent's runs (the current plan revision's verify rounds), never read
                  from here.
                format: int32
                maximum: 999
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: an Intent is named <spec.project>-<spec.issue.number>
          rule: self.metadata.name.startsWith(self.spec.project + '-') && !self.metadata.name.substring(size(self.spec.project)
            + 1).startsWith('0') && int(self.metadata.name.substring(size(self.spec.project)
            + 1)) == self.spec.issue.number
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
