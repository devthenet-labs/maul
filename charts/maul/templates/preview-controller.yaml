#
# Optional, namespaced runtime renderer. It has no GitHub, ECR, AWS, Secret,
# ConfigMap, namespace or cluster-scoped permissions. The separate
# preview.enabled foundation must be present before any workload can run.
# Acceptance verification (preview.verification.enabled, off by default) adds,
# in each slot, batch jobs (create, get, list, delete: the tester Job),
# networking.k8s.io networkpolicies (create, get, list, update, delete: one
# edge policy per part), pods (delete beside list: the sweep removes a tester
# pod whose Job is gone) and pods/log (get: the tester's result and component
# log tails), and in the release namespace previewverifications (get, list,
# watch: the requests; update: only its cleanup finalizer) and
# previewverifications/status (update: the results). Admission fences each:
# maul-preview-jobs,
# maul-preview-networkpolicies and maul-preview-verifications.
# The agent evaluator's slot tool pod (intentController.verification.evaluator
# with verification on) adds, in each slot, events (get, list, watch: the pod
# events a tool pod reports), secrets (create, delete: the per-verification
# CDP key) and configmaps (create, update, delete: the tool ConfigMap), and in
# the release namespace configmaps (create, delete: each verification's ledger
# and evidence). None of them reads a Secret or ConfigMap. Admission fences
# them: maul-preview-tool-objects and maul-preview-ledgers.
{{- if .Values.previewController.enabled }}
{{- if not .Values.preview.enabled }}{{ fail "previewController.enabled requires preview.enabled: the guarded slot namespaces must exist" }}{{ end }}
{{- if and (include "maul.previewLegacyIngress" .) (not .Values.preview.placeholder.enabled) }}{{ fail "previewController.enabled requires preview.placeholder.enabled: the stable placeholder Ingress must be rendered (on the legacy path, preview.legacyIngress)" }}{{ end }}
{{- if not .Values.intentController.enabled }}{{ fail "previewController.enabled requires intentController.enabled: only intent-controller writes Preview spec" }}{{ end }}
{{- if not .Values.previewController.networkPolicy.create }}{{ fail "previewController.enabled requires its API-only NetworkPolicy" }}{{ end }}
{{- if not .Values.previewController.config.apiServerCIDR }}{{ fail "previewController.config.apiServerCIDR is required when enabled" }}{{ end }}
{{- $vals := .Values.previewController }}
{{- $name := "preview-controller" }}
{{- $verify := include "maul.previewVerification" . }}
{{- $tools := include "maul.previewTools" . }}
{{- $c := dict "name" $name "vals" $vals }}
{{- $sa := include "maul.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
{{- if $vals.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "maul.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "maul.annotations" (dict "root" . "extra" $vals.serviceAccount.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
{{- end }}
{{- include "maul.controllerConfigMap" (dict "root" . "c" $c) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "maul.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
rules:
    - apiGroups: [maul.run]
      resources: [previews]
      verbs: [get, list, watch, update, delete]
    - apiGroups: [maul.run]
      resources: [previews/status, previews/finalizers]
      verbs: [update]
    - apiGroups: [maul.run]
      resources: [intents, projects]
      verbs: [get]
    {{- if $verify }}
    # Acceptance verification: read the requests, write only their results
    # and its own cleanup finalizer (maul-preview-verifications holds it to
    # status and that finalizer).
    - apiGroups: [maul.run]
      resources: [previewverifications]
      verbs: [get, list, watch, update]
    - apiGroups: [maul.run]
      resources: [previewverifications/status]
      verbs: [update]
    {{- end }}
    {{- if $tools }}
    # The tool pod's records: each verification's ledger and evidence
    # ConfigMaps, written and deleted, never read (maul-preview-ledgers).
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, delete]
    {{- end }}
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    # Leader-election and reconcile Events, as every other controller records;
    # the reconcile and sweep Warnings (IngressRefused, UnauthenticatedIngress)
    # go through the events.k8s.io API.
    - apiGroups: ["", events.k8s.io]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "maul.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "maul.fullname" . }}-{{ $name }}
subjects:
    - kind: ServiceAccount
      name: {{ $sa }}
      namespace: {{ .Release.Namespace }}
{{- range $i := until (int .Values.preview.slotCount) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "maul.fullname" $ }}-{{ $name }}
    namespace: maul-preview-{{ $i }}
rules:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [create, get, list, update, patch, delete]
    - apiGroups: ["" ]
      resources: [services]
      verbs: [create, get, list, update, patch, delete]
    - apiGroups: [networking.k8s.io]
      resources: [ingresses]
      verbs: [create, get, list, update, patch, delete]
    - apiGroups: ["" ]
      resources: [pods]
      verbs: [list{{ if $verify }}, delete{{ end }}]
    - apiGroups: [apps]
      resources: [replicasets]
      verbs: [list]
    {{- if $verify }}
    # Acceptance verification: the tester Job (maul-preview-jobs), its edge
    # policies (maul-preview-networkpolicies) and the logs it reads results
    # and evidence from.
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [create, get, list, delete]
    - apiGroups: [networking.k8s.io]
      resources: [networkpolicies]
      verbs: [create, get, list, update, delete]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    {{- end }}
    {{- if $tools }}
    # The agent evaluator's tool pod: the events it reports on the slot's
    # pods, its per-verification CDP key Secret and its tool ConfigMap
    # (maul-preview-tool-objects; neither is ever read back).
    - apiGroups: [""]
      resources: [events]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [create, delete]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, update, delete]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "maul.fullname" $ }}-{{ $name }}
    namespace: maul-preview-{{ $i }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "maul.fullname" $ }}-{{ $name }}
subjects:
    - kind: ServiceAccount
      name: {{ $sa }}
      namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "maul.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "maul.labels" (dict "root" . "name" $name "component" "controller") | nindent 8 }}
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            {{- include "maul.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "maul.labels" (dict "root" . "name" $name "component" "controller") | nindent 16 }}
                {{- with $vals.podLabels }}{{- toYaml . | nindent 16 }}{{- end }}
            annotations:
                checksum/config: {{ include "maul.controllerConfigMap" (dict "root" . "c" $c) | sha256sum }}
                {{- with $vals.podAnnotations }}{{- toYaml . | nindent 16 }}{{- end }}
        spec:
            serviceAccountName: {{ $sa }}
            {{- with .Values.image.pullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: controller
                  image: {{ include "maul.image" (dict "root" . "binary" $name "image" $vals.image) }}
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  args: [serve]
                  envFrom:
                      {{- with $vals.extraEnvFrom }}
                      {{- toYaml . | nindent 22 }}
                      {{- end }}
                      - configMapRef:
                            name: {{ include "maul.configMapName" (dict "root" . "name" $name) }}
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                      {{- with include "maul.extraEnv" (dict "path" "previewController" "env" $vals.extraEnv) }}
                      {{- . | nindent 22 }}
                      {{- end }}
                  ports:
                      - name: health
                        containerPort: 8081
                  livenessProbe:
                      httpGet: {path: /healthz, port: health}
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet: {path: /readyz, port: health}
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  resources:
                      {{- toYaml $vals.resources | nindent 22 }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                      seccompProfile: {type: RuntimeDefault}
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      {{- with $vals.extraVolumeMounts }}
                      {{- toYaml . | nindent 22 }}
                      {{- end }}
            {{- with $vals.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with $vals.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with $vals.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            volumes:
                - name: tmp
                  emptyDir: {}
                {{- with $vals.extraVolumes }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "maul.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
spec:
    podSelector:
        matchLabels:
            {{- include "maul.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 8081
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - {protocol: UDP, port: 53}
              - {protocol: TCP, port: 53}
        {{- with include "maul.clusterDNSEgress" . }}
        {{- . | nindent 8 }}
        {{- end }}
        - to:
              {{- range $cidr := include "maul.previewAPIServerCIDRs" . | fromJsonArray }}
              - ipBlock:
                    cidr: {{ $cidr }}
              {{- end }}
          ports:
              - {protocol: TCP, port: 443}
              - {protocol: TCP, port: 6443}
{{- end }}
