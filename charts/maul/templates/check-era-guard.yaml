{{- /*
The check-era upgrade guard. 0.14.18 retired saved checks, their replays and
the check reviewer, and withdrew once, per open intent, a verification an
earlier release had judged under them; this release removes their fields and
no longer withdraws anything, so an install must pass through 0.14.18. A
render that reaches the cluster (helm install, upgrade, or helm template
--dry-run=server) fails here, before any CRD changes, naming each record only
0.14.18 settles: an open Intent whose verification carries no judge marker
and still holds what an earlier release judged (a round in flight, outcomes,
their round, heads or environment, anomalies, a pass or fail count) or was
withdrawn and waits for its fresh round (the VerificationSuperseded
condition), and an unfinished checkreview IntentRun. These are exactly
intent-controller's startup census (intent.TakeCheckEraCensus); a render
without a cluster (helm template, Argo CD, Flux) sees nothing, as with every
lookup, and the census then refuses to start instead. Renders nothing.
*/}}
{{- if lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "intents.maul.run" }}
{{- $terminal := list "Merged" "Closed" "Failed" }}
{{- $judged := list "ref" "outcomes" "outcomesRound" "outcomesHeadSetDigest" "outcomesEnvironment" "anomalies" "passed" "failed" }}
{{- $intents := list }}
{{- range $in := (lookup "maul.run/v1alpha1" "Intent" .Release.Namespace "").items | default list }}
{{- $st := $in.status | default dict }}
{{- $v := $st.verification }}
{{- if and $v (not $in.metadata.deletionTimestamp) (not (has ($st.phase | default "") $terminal)) (ne ($v.judge | default "") "observed/1") }}
{{- $held := false }}
{{- range $k := $judged }}
{{- if get $v $k }}
{{- $held = true }}
{{- end }}
{{- end }}
{{- range $c := $st.conditions | default list }}
{{- if and (eq $c.type "VerificationSuperseded") (eq $c.status "True") }}
{{- $held = true }}
{{- end }}
{{- end }}
{{- if $held }}
{{- $intents = append $intents $in.metadata.name }}
{{- end }}
{{- end }}
{{- end }}
{{- $runs := list }}
{{- range $run := (lookup "maul.run/v1alpha1" "IntentRun" .Release.Namespace "").items | default list }}
{{- $spec := $run.spec | default dict }}
{{- $phase := ($run.status | default dict).phase | default "" }}
{{- if and (eq ($spec.stage | default "") "checkreview") (not $run.metadata.deletionTimestamp) (not (has $phase (list "Complete" "Failed"))) }}
{{- $runs = append $runs $run.metadata.name }}
{{- end }}
{{- end }}
{{- if or $intents $runs }}
{{- fail (printf "saved checks and the check reviewer are removed, and an install must pass through 0.14.18, which settles these records in namespace %s: Intents %s (each holds a verification an earlier release judged with saved checks: run 0.14.18 until it withdraws it, or /maul cancel it there, or delete it), IntentRuns %s (unfinished check reviews: run 0.14.18, which stops them, or delete them); see docs/intents/evaluator.md#migrating-from-saved-checks" .Release.Namespace (join ", " ($intents | default (list "none"))) (join ", " ($runs | default (list "none")))) }}
{{- end }}
{{- end }}
