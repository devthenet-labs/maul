apiVersion: v2
name: maul-config
description: >-
    The maul pipeline switch-on: the Integration, Forge and (optional) Project custom resources, installed as a
    separate release AFTER the maul chart so the CRDs exist before Helm validates the CRs against them.
type: application
# Only Kubernetes lines that have not reached end-of-life are supported.
kubeVersion: ">=1.34.0-0"
home: https://devthenet-labs.github.io/maul
icon: https://devthenet-labs.github.io/maul/assets/images/favicon.svg
sources:
    - https://github.com/devthenet-labs/maul
maintainers:
    - name: Bitwise Media Group
      url: https://github.com/bitwise-media-group

# Both stamped by release-please (extra-files generic updater, see
# release-please-config.json): the chart version tracks the app release 1:1,
# matching the maul chart it configures.
version: 0.13.3 # x-release-please-version
appVersion: 0.13.3 # x-release-please-version
