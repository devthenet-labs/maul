#
# The Project custom resources rendered from the `projects` values array — the
# intent-driven development registration, one Project per project: its intent
# repository, trigger/approve labels, approvers, app repositories and spend
# limits. Unlike integrations and forges, projects are optional: they do
# nothing unless the maul release runs intent-controller
# (intentController.enabled). Each entry's `spec` is rendered verbatim —
# values.schema.json embeds the CRD spec schema, so it is validated
# client-side at install and again server-side by the CRD (including the CEL
# rules the values schema cannot express).
#
# A Project is the power to point agents at repositories, so writing projects
# is admin-only in RBAC; this chart is how the operator writes them.
#
# With the maul chart's statusServer.projectSettings on, a Project's
# approvers may also change some of its spec from the status page (limits,
# models, evaluator, hand-off, delegation switches, checks, each
# repository's agentResourceClass), as field manager maul-status-server. Set each field
# from one place: a field the page changed that these values also state
# makes the next default (server-side) helm upgrade fail with a conflict
# until the values agree or the upgrade is forced, which puts the values'
# setting back; an approver or check the page removed comes back if these
# values still list it. See docs/configuration/status-server.md.
{{- range .Values.projects }}
---
apiVersion: maul.run/v1alpha1
kind: Project
metadata:
    name: {{ required "projects[].name is required" .name }}
    namespace: {{ $.Release.Namespace }}
    labels:
        {{- include "maul-config.labels" (dict "root" $ "name" "intent-controller") | nindent 8 }}
    {{- with include "maul-config.annotations" (dict "root" $) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    {{- required (printf "projects[%s].spec is required" .name) .spec | toYaml | nindent 4 }}
{{- end }}
