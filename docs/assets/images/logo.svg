<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Maul</title>
  <desc id="desc">A splitting maul: a steel head with an axe blade on one side and a hammer face on the other, on an ash handle, its cutting edge bright green.</desc>
  <defs>
    <linearGradient id="ml-logo-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2422"/>
      <stop offset="100%" stop-color="#101513"/>
    </linearGradient>
    <linearGradient id="ml-logo-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f0"/>
      <stop offset="55%" stop-color="#b9c3bf"/>
      <stop offset="100%" stop-color="#7f8b87"/>
    </linearGradient>
    <linearGradient id="ml-logo-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa5a1"/>
      <stop offset="100%" stop-color="#5f6a66"/>
    </linearGradient>
    <linearGradient id="ml-logo-ash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2b884"/>
      <stop offset="100%" stop-color="#a8774a"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="118" height="118" rx="26" fill="url(#ml-logo-tile)" stroke="#2f3a37" stroke-width="2"/>

  <g transform="translate(67 63) rotate(-34) scale(0.74) translate(-62 -66)">
    <!-- ash handle -->
    <rect x="58" y="44" width="12" height="86" rx="5.5" fill="url(#ml-logo-ash)"/>
    <path d="M61 54v70" stroke="#f3d3a8" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <!-- head: wedge blade left, body, hammer face right -->
    <path d="M42 26 L24 16 Q15 39 24 62 L42 52 Z" fill="url(#ml-logo-steel)"/>
    <rect x="40" y="25" width="50" height="28" rx="4" fill="url(#ml-logo-steel)"/>
    <rect x="88" y="27" width="10" height="24" rx="2.5" fill="url(#ml-logo-face)"/>
    <path d="M44 31h40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- the cutting edge -->
    <path d="M24 16 Q15 39 24 62" fill="none" stroke="#86e05a" stroke-width="4.2" stroke-linecap="round"/>
  </g>
</svg>
