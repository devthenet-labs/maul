# Generated by `maul setup previews`.
# The wildcard certificate the gateway terminates TLS with: every preview host and the sign-in host.
# Apply it once cert-manager runs and its issuer can answer DNS-01 for both names.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-wildcard
  namespace: maul
spec:
  dnsNames:
  - '*.previews.acme.dev'
  - preview-auth.acme.dev
  issuerRef:
    kind: Issuer
    name: preview-dns01
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: preview-wildcard-tls
