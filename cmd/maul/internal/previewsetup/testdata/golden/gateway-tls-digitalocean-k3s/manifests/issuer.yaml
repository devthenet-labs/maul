# Generated by `maul setup previews`.
# The ACME Issuer the wildcard Certificate names: namespaced, so only this namespace's Certificates can
# spend the DNS credential. A wildcard needs DNS-01.
# Its credential is Secret preview-dns01-credentials, key access-token.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: preview-dns01
  namespace: maul
spec:
  acme:
    privateKeySecretRef:
      name: preview-dns01-account
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        digitalocean:
          tokenSecretRef:
            key: access-token
            name: preview-dns01-credentials
