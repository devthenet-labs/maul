# Generated by `maul setup previews` (maul v0.12.40, edge existing).
# Layer it after your own values:
#   helm upgrade maul oci://ghcr.io/devthenet-labs/maul/charts/maul -n maul \
#     -f <your values> -f maul-previews.values.yaml
# Change it by running the command again: it shows the difference before replacing this file.
preview:
  enabled: true
  hostSuffix: acme-previews.dev
  imagePathPrefix: acme/maul/previews
  imageRegistry: europe-west2-docker.pkg.dev
  legacyIngress: false
  nodeIsolation:
    eksAutoMode:
      nodeClass: ""
      nodePool: ""
    mode: required
    nodeClass: ""
    nodePool: ""
    selector:
      maul.run/previews: "true"
    taintKey: maul.run/preview-only
  placeholder:
    enabled: false
previewAuth:
  dex:
    clientID: maul-preview-auth
    clientSecretKey: clientSecret
    existingSecret: maul-preview-auth-dex
    issuerURL: https://dex.maul.acme.dev
  enabled: true
  gateway:
    enabled: true
    forwardedHops: 1
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      className: nginx
      enabled: true
      tls:
      - hosts:
        - '*.acme-previews.dev'
        secretName: preview-wildcard-tls
  host: preview-auth.maul.acme.dev
  ingress:
    annotations: {}
    className: nginx
    tls:
    - hosts:
      - preview-auth.maul.acme.dev
      secretName: preview-wildcard-tls
  viewers:
    teams:
    - acme:qa
    users:
    - octocat
previewController:
  config:
    apiServerCIDR: auto
  enabled: true
