# Generated by `maul setup previews` (maul v0.12.40, edge existing).
# Layer it after your own values:
#   helm upgrade maul oci://ghcr.io/devthenet-labs/maul/charts/maul -n maul \
#     -f <your values> -f maul-previews.values.yaml
# Change it by running the command again: it shows the difference before replacing this file.
preview:
  enabled: true
  hostSuffix: acme-previews.dev
  imagePathPrefix: acme/maul/previews
  imageRegistry: acme.azurecr.io
  legacyIngress: false
  nodeIsolation:
    eksAutoMode:
      nodeClass: ""
      nodePool: ""
    mode: required
    nodeClass: ""
    nodePool: ""
    selector:
      maul.run/previews: "true"
    taintKey: maul.run/preview-only
  placeholder:
    enabled: false
previewAuth:
  dex:
    clientID: maul-preview-auth
    clientSecretKey: clientSecret
    existingSecret: maul-preview-auth-dex
    issuerURL: https://dex.maul.acme.dev
  enabled: true
  gateway:
    enabled: true
    forwardedHops: 1
    httpRoute:
      parentRefs:
      - name: edge
        namespace: gateway-system
        sectionName: https-previews
    ingress:
      enabled: false
  host: preview-auth.maul.acme.dev
  viewers:
    teams:
    - acme:qa
    users:
    - octocat
previewController:
  config:
    apiServerCIDR: auto
  enabled: true
