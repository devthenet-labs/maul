# The answers `maul setup previews` last rendered this directory from. A re-run starts
# from them; flags given then override them. No secret is ever recorded here.
apiServerCIDR: auto
certificate:
  dns: digitalocean
cliVersion: v0.12.40
dex:
  clientID: maul-preview-auth
  issuer: https://dex.acme.dev
  namespace: dex
edge: gateway-tls
hostSuffix: previews.acme.dev
imagePathPrefix: acme/maul/previews
namespace: maul
nodeIsolation:
  label: maul.run/previews
  labelValue: "true"
  taintKey: maul.run/preview-only
platform: k3s
registry: ghcr.io
release: maul
sharedDomain: acknowledged
signInHost: preview-auth.acme-auth.dev
viewers:
  teams:
  - acme:qa
  users:
  - octocat
