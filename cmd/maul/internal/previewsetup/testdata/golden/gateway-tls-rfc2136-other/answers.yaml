# The answers `maul setup previews` last rendered this directory from. A re-run starts
# from them; flags given then override them. No secret is ever recorded here.
apiServerCIDR: auto
certificate:
  dns: rfc2136
  dnsOptions:
    nameserver: ns1.acme.dev:53
    tsigKeyName: maul-previews
cliVersion: v0.12.40
dex:
  clientID: maul-preview-auth
  issuer: https://dex.maul.acme.dev
  namespace: dex
edge: gateway-tls
hostSuffix: acme-previews.dev
imagePathPrefix: acme/maul/previews
namespace: maul
nodeIsolation:
  label: maul.run/previews
  labelValue: "true"
  mode: required
  taintKey: maul.run/preview-only
platform: other
registry: ghcr.io
release: maul
signInHost: preview-auth.maul.acme.dev
viewers:
  teams:
  - acme:qa
  users:
  - octocat
