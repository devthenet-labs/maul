# Generated by `patchy setup previews` (patchy v0.12.40, edge existing).
# Layer it after your own values:
#   helm upgrade patchy oci://ghcr.io/devthenet-labs/patchy/charts/patchy -n patchy \
#     -f <your values> -f patchy-previews.values.yaml
# Change it by running the command again: it shows the difference before replacing this file.
preview:
  enabled: true
  hostSuffix: acme-previews.dev
  imagePathPrefix: patchy/previews
  imageRegistry: registry.localhost:5000
  legacyIngress: false
  nodeIsolation:
    mode: required
    selector:
      patchy.bitwisemedia.uk/previews: "true"
    taintKey: patchy.bitwisemedia.uk/preview-only
  placeholder:
    enabled: false
previewAuth:
  dex:
    clientID: patchy-preview-auth
    clientSecretKey: clientSecret
    existingSecret: patchy-preview-auth-dex
    issuerURL: https://dex.patchy.acme.dev
  enabled: true
  gateway:
    enabled: true
    forwardedHops: 1
    ingress:
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      className: traefik
      enabled: true
      tls:
      - hosts:
        - '*.acme-previews.dev'
        secretName: preview-wildcard-tls
  host: preview-auth.patchy.acme.dev
  ingress:
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    className: traefik
    tls:
    - hosts:
      - preview-auth.patchy.acme.dev
      secretName: preview-wildcard-tls
  viewers:
    teams:
    - acme:qa
    users:
    - octocat
previewController:
  config:
    apiServerCIDR: auto
  enabled: true
