# The answers `patchy setup previews` last rendered this directory from. A re-run starts
# from them; flags given then override them. No secret is ever recorded here.
apiServerCIDR: auto
certificate:
  dns: digitalocean
cliVersion: v0.12.40
dex:
  clientID: patchy-preview-auth
  issuer: https://dex.acme.dev
  namespace: dex
edge: gateway-tls
hostSuffix: previews.acme.dev
imagePathPrefix: acme/patchy/previews
namespace: patchy
nodeIsolation:
  label: patchy.bitwisemedia.uk/previews
  labelValue: "true"
  taintKey: patchy.bitwisemedia.uk/preview-only
platform: k3s
registry: ghcr.io
release: patchy
sharedDomain: acknowledged
signInHost: preview-auth.acme-auth.dev
viewers:
  teams:
  - acme:qa
  users:
  - octocat
