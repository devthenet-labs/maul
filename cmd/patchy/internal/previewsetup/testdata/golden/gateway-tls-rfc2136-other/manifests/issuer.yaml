# Generated by `patchy setup previews`.
# The ACME Issuer the wildcard Certificate names: namespaced, so only this namespace's Certificates can
# spend the DNS credential. A wildcard needs DNS-01.
# Its credential is Secret preview-dns01-credentials, key tsig-secret.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: preview-dns01
  namespace: patchy
spec:
  acme:
    privateKeySecretRef:
      name: preview-dns01-account
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        rfc2136:
          nameserver: ns1.acme.dev:53
          tsigAlgorithm: HMACSHA512
          tsigKeyName: patchy-previews
          tsigSecretSecretRef:
            key: tsig-secret
            name: preview-dns01-credentials
