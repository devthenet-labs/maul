#   helm upgrade previews oci://ghcr.io/devthenet-labs/patchy/charts/patchy -n patchy-system \
#     -f <your values> -f patchy-previews.values.yaml
# Change it by running the command again: it shows the difference before replacing this file.
preview:
  enabled: true
  hostSuffix: acme-previews.dev
  imagePathPrefix: acme/patchy/previews
  imageRegistry: ghcr.io
  legacyIngress: false
  nodeIsolation:
    mode: none
    selector: {}
    taintKey: ""
  placeholder:
    enabled: false
previewAuth:
  dex:
    clientID: patchy-preview-auth
    clientSecretKey: clientSecret
    existingSecret: patchy-preview-auth-dex
    issuerURL: https://dex.patchy.acme.dev
  enabled: true
  gateway:
    enabled: true
    forwardedHops: 1
    ingress:
      annotations: {}
      className: haproxy
      enabled: true
      tls:
      - hosts:
        - '*.acme-previews.dev'
        secretName: preview-wildcard-tls
  host: preview-auth.patchy.acme.dev
  ingress:
    annotations: {}
    className: haproxy
    tls:
    - hosts:
      - preview-auth.patchy.acme.dev
      secretName: preview-wildcard-tls
  viewers:
    teams: []
    users: []
previewController:
  config:
    apiServerCIDR: auto
  enabled: true
